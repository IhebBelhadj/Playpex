e: (self) => { root.style.setProperty('--p', self.progress.toFixed(4)); if (opts.onUpdate) opts.onUpdate(self.progress); if (beats) root.dataset.beat = String(Math.min(beats - 1, Math.floor(self.progress * beats))); }, }, }); plan.build(tl, ctx); // pad the timeline to exactly 1 so positions in build() read as fractions of the hold if (tl.duration() < 1) tl.to({}, { duration: 1 - tl.duration() }, tl.duration()); return () => { root.classList.remove('is-live'); root.style.removeProperty('--hold'); root.style.removeProperty('--p'); }; }); Stage.scenes.push(mm); return mm; }; // Masked split text. Lines rise out of their own mask; words and characters are for short headings. Stage.split = (el, type = 'lines') => { if (!el) return []; if (window.SplitText && live) { const s = SplitText.create(el, { type: type === 'lines' ? 'lines' : type === 'words' ? 'lines,words' : 'lines,words,chars', mask: 'lines', aria: 'auto', autoSplit: false }); return type === 'lines' ? s.lines : type === 'words' ? s.words : s.chars; } // fallback: words in inline-block spans, the full text kept for screen readers if (!el.dataset.split) { el.setAttribute('aria-label', el.textContent.trim()); const words = el.textContent.trim().split(/\\s+/).map((w) => { const span = document.createElement('span'); span.setAttribute('aria-hidden', 'true'); span.style.display = 'inline-block'; span.textContent = w; return span; }); el.replaceChildren(...words.flatMap((span, i) => (i ? [' ', span] : [span]))); el.dataset.split = 'words'; } return [...el.children]; }; // Fonts and the scenes' pictures decide every height a trigger measures; refresh once they are in. Stage.ready = () => { const imgs = [...document.querySelectorAll('.scene img')].map((i) => (i.complete ? null : i.decode().catch(() => {}))).filter(Boolean); return Promise.all([document.fonts ? document.fonts.ready : null, ...imgs]).then(() => { if (live) ScrollTrigger.refresh(); }); }; // Every"
