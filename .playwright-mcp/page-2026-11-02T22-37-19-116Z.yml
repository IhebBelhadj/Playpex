          - generic [ref=f61e112]: "\"id\": \"trakt\", // [a-z][a-z0-9-]{1,31}, never changes"
          - generic [ref=f61e113]: "\"name\": \"Trakt\","
          - generic [ref=f61e114]: "\"description\": \"Scrobbles what you watch to Trakt…\","
          - generic [ref=f61e115]: "\"version\": \"1.0.0\", // semver"
          - generic [ref=f61e116]: "\"publisher\": { \"name\": \"Playpex\", \"key\": \"ed25519:…\" },"
          - generic [ref=f61e117]: "\"api\": { \"server\": \"^1\", \"nav\": \"^1\", \"ui\": \"^1\" },"
          - generic [ref=f61e118]: "\"audience\": \"everyone\", // everyone | adults"
          - generic [ref=f61e119]: "\"icon\": \"assets/trakt.svg\","
          - generic [ref=f61e120]: "\"listing\": { }, // what the dashboard's catalog shows"
          - generic [ref=f61e121]: "\"permissions\": { },"
          - generic [ref=f61e122]: "\"link\": [ ],"
