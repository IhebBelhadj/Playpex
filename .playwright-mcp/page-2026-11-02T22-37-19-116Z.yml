      - paragraph [ref=f61e104]: playpex-plugin.json, the file that says who you are, what you add and what you need.
      - generic [ref=f61e105]:
        - paragraph [ref=f61e106]:
          - text: "The manifest is plain data: the server reads it without running your code. Its schema is"
          - code [ref=f61e107]: plugin.schema.json
          - text: in the
          - code [ref=f61e108]: packages/protocol
          - text: folder of the source code.
        - code [ref=f61e110]:
