              - code [ref=f61e130]: id
            - text: is your namespace. Your screens are
            - code [ref=f61e131]: plugin.<id>.<name>
            - text: ", your settings"
            - code [ref=f61e132]: plugin.<id>.<key>
            - text: ", row keys start with"
            - code [ref=f61e133]: "<id>:"
            - text: . It never changes between versions.
          - listitem [ref=f61e134]:
            - text: Names inside the plugin (screens, data handlers, settings, secrets) are
            - code [ref=f61e135]: "[a-z][A-Za-z0-9]{0,39}"
            - text: .
          - listitem [ref=f61e136]:
            - text: Assets are paths under
            - code [ref=f61e137]: assets/
            - text: (
            - code [ref=f61e138]: .svg
            - text: ","
