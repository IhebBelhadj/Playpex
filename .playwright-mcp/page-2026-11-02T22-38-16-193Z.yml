            - row [ref=f64e169]:
              - cell [ref=f64e170]:
                - code [ref=f64e171]: metadata.details
              - cell "5 s" [ref=f64e172]
              - cell [ref=f64e173]:
                - code [ref=f64e174]: "{ title, details }"
                - text: → up to 3 ratings, 10 tags, 5 links, 3 meta lines
            - row [ref=f64e175]:
