        - paragraph [ref=f64e265]:
          - text: The admin orders metadata providers, and switches each on or off, in
          - strong [ref=f64e266]: Settings › Metadata
          - text: ". Cache what you fetch: title pages are opened often."
        - heading "Live TV" [level=2] [ref=f64e267]
        - paragraph [ref=f64e268]:
          - text: "A live TV plugin answers three hooks: its channels, their guide for a window of time, and a channel’s stream when someone tunes in, so tokens in stream addresses stay fresh. Parse playlists with"
          - code [ref=f64e269]: playpex.iptv.m3u
          - text: and guides with
          - code [ref=f64e270]: playpex.iptv.xmltv
          - text: . A
          - code [ref=f64e271]: guide
          - text: screen draws the channels and guide for you (see
          - link "Screens and slots" [ref=f64e272] [cursor=pointer]:
            - /url: /docs/screens
          - text: ). The
          - strong [ref=f64e273]: Live TV (M3U)
          - text: plugin is the reference.
