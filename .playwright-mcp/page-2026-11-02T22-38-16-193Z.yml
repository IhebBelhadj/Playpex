              - 'cell "for channels: the server remuxes it for one viewer" [ref=f64e252]'
        - paragraph [ref=f64e253]:
          - text: Every plugin’s torrents are ranked together by the core, one per info hash. Give your best 50; reorder or hide with
          - code [ref=f64e254]: play.rank
          - text: . Hidden sources show to the user as “Hidden by
          - generic [ref=f64e255]: ": ”."
        - heading "Ratings on title pages" [level=2] [ref=f64e256]
        - code [ref=f64e258]:
          - generic [ref=f64e259]: "playpex.hooks.on('metadata.details', async function (input) {"
          - generic [ref=f64e260]: "return {"
          - generic [ref=f64e261]: "ratings: [{ source: 'Example', value: 8.4, max: 10, votes: 1200, url: 'https://example.com/t/1' }],"
