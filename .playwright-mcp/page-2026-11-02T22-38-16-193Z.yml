      - heading "Hooks" [level=1] [ref=f64e103]
      - paragraph [ref=f64e104]: The stages of Play, metadata, subtitles, search and live TV that a plugin joins.
      - generic [ref=f64e105]:
        - paragraph [ref=f64e106]:
          - text: "Hooks are named stages of core features. Each has a fixed input and output, a timeout, and one rule:"
          - strong [ref=f64e107]: a handler that throws, times out or answers out of shape is skipped
          - text: . The core’s own sources run in the same stages, and a plugin can’t remove them.
        - code [ref=f64e109]:
          - generic [ref=f64e110]: "playpex.hooks.on('play.collect', async function (input, ctx) {"
          - generic [ref=f64e111]: "var t = input.title; // { kind, tmdbId, imdbId, season, episode, title, year }"
          - generic [ref=f64e112]: "var r = await playpex.http.request({ url: 'https://api.example.com/find?imdb=' + t.imdbId, responseType: 'json' });"
          - generic [ref=f64e113]: "return r.body.items.map(function (i) {"
          - generic [ref=f64e114]: "return { kind: 'http', url: i.url, label: i.name, quality: '1080p', size: i.size };"
          - generic [ref=f64e115]: "});"
          - generic [ref=f64e116]: "});"
        - heading "The hooks" [level=2] [ref=f64e117]
        - table [ref=f64e118]:
          - rowgroup [ref=f64e119]:
            - row [ref=f64e120]:
              - columnheader "Hook" [ref=f64e121]
              - columnheader "Timeout" [ref=f64e122]
              - columnheader "Input → output" [ref=f64e123]
          - rowgroup [ref=f64e124]:
            - row [ref=f64e125]:
              - cell [ref=f64e126]:
                - code [ref=f64e127]: play.collect
              - cell "8 s" [ref=f64e128]
              - cell [ref=f64e129]:
                - code [ref=f64e130]: "{ title }"
                - text: → up to 50 sources
            - row [ref=f64e131]:
              - cell [ref=f64e132]:
                - code [ref=f64e133]: play.rank
              - cell "1 s" [ref=f64e134]
              - cell [ref=f64e135]:
                - code [ref=f64e136]: "{ title, sources }"
                - text: →
                - code [ref=f64e137]: "{ order?, hide?: [{ id, reason }] }"
            - row [ref=f64e138]:
              - cell [ref=f64e139]:
                - code [ref=f64e140]: play.before
              - cell "1 s" [ref=f64e141]
              - cell [ref=f64e142]:
                - code [ref=f64e143]: "{ title, source }"
                - text: → continue, ask a question, or refuse with a reason
            - row [ref=f64e144]:
              - cell [ref=f64e145]:
                - code [ref=f64e146]: play.resolve
              - cell "3 s / 10 s" [ref=f64e147]
              - cell "check which torrents a service has cached, then turn the chosen one into a direct stream" [ref=f64e148]
            - row [ref=f64e149]:
              - cell [ref=f64e150]:
                - code [ref=f64e151]: releases.providers
              - cell "10 s" [ref=f64e152]
              - cell [ref=f64e153]:
                - code [ref=f64e154]: "{ kind, title?, query?, page }"
                - text: →
                - code [ref=f64e155]: "{ releases, last }"
                - text: ": a Find releases list"
            - row [ref=f64e156]:
              - cell [ref=f64e157]:
                - code [ref=f64e158]: sources.search
              - cell "15 s" [ref=f64e159]
              - cell [ref=f64e160]:
                - code [ref=f64e161]: "{ query, kind, page }"
                - text: →
                - code [ref=f64e162]: "{ results, last }"
                - text: ": your streams in the dashboard’s Search"
            - row [ref=f64e163]:
              - cell [ref=f64e164]:
