          - generic [ref=f66e38]: "var r = await playpex.http.request({ url: 'https://api.example.com/find?imdb=' + t.imdbId, responseType: 'json' });"
          - generic [ref=f66e39]: "return r.body.items.map(function (i) {"
          - generic [ref=f66e40]: "return { kind: 'http', url: i.url, label: i.name, quality: '1080p', size: i.size };"
