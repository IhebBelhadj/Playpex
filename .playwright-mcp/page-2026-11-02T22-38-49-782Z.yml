      - heading "Hooks" [level=1] [ref=f66e29]
      - paragraph [ref=f66e30]: The stages of Play, metadata, subtitles, search and live TV that a plugin joins.
      - generic [ref=f66e31]:
        - paragraph [ref=f66e32]:
          - text: "Hooks are named stages of core features. Each has a fixed input and output, a timeout, and one rule:"
          - strong [ref=f66e33]: a handler that throws, times out or answers out of shape is skipped
          - text: . The core’s own sources run in the same stages, and a plugin can’t remove them.
