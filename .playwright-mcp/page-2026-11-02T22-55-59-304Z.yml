    - region [ref=f18e115]:
      - heading "What changed" [level=2] [ref=f18e116]
      - article [ref=f18e117]:
        - generic [ref=f18e118]:
          - heading "0.10.1 alpha 1" [level=3] [ref=f18e120]
          - paragraph [ref=f18e121]: Remote control, 1 November 2026
        - generic [ref=f18e122]:
          - generic [ref=f18e123]:
            - heading "Playpex Media Server" [level=4] [ref=f18e124]
            - list [ref=f18e125]:
              - listitem [ref=f18e126]: "Remote control from the dashboard: play, pause, seek and stop on any screen, or take over its keyboard and pointer."
              - listitem [ref=f18e127]: Commands travel over a direct connection between the dashboard and the screen when the network allows it.
          - generic [ref=f18e128]:
            - heading "Playpex TV" [level=4] [ref=f18e129]
            - list [ref=f18e130]:
              - listitem [ref=f18e131]: Can be controlled from the dashboard or a phone; a badge and a drawn pointer show while it is.
              - listitem [ref=f18e132]: Remote control can be switched off for this screen in Settings.
          - generic [ref=f18e133]:
            - heading "Playpex Mobile" [level=4] [ref=f18e134]
            - list [ref=f18e135]:
              - listitem [ref=f18e136]: "The phone is a remote for any screen: a touchpad, the arrows, OK and Back, and typing."
          - generic [ref=f18e137]:
            - heading "Server Manager" [level=4] [ref=f18e138]
            - list [ref=f18e139]:
              - listitem [ref=f18e140]: First release. Finds the Playpex server on your Wi-Fi by itself and opens its dashboard on your phone.
              - listitem [ref=f18e141]: The remote for every screen in the house, with a touchpad and the arrows.
      - article [ref=f18e142]:
        - generic [ref=f18e143]:
          - heading "0.10.0 alpha 1" [level=3] [ref=f18e145]
          - paragraph [ref=f18e146]: First alpha, 30 October 2026
        - generic [ref=f18e147]:
          - generic [ref=f18e148]:
            - heading "Playpex Media Server" [level=4] [ref=f18e149]
            - list [ref=f18e150]:
              - listitem [ref=f18e151]: "A library of your folders: every file matched to its title, poster and story, with fixes for wrong matches."
              - listitem [ref=f18e152]: "Downloads as a full torrent client: a queue, per-download rules and speed limits, three engines to choose from."
              - listitem [ref=f18e153]: "Plugins: sources, live TV, ratings and more from signed repositories, each running in a sandbox."
              - listitem [ref=f18e154]: Live TV with a programme guide, from your own M3U playlist.
              - listitem [ref=f18e155]: One search for everything the server can reach, and pasted links read by the server.
              - listitem [ref=f18e156]: A DLNA server for the TVs on your network, and the name playpex.local.
          - generic [ref=f18e157]:
            - heading "Playpex TV" [level=4] [ref=f18e158]
            - list [ref=f18e159]:
              - listitem [ref=f18e160]: "Play opens a chooser: files on this server, streams and torrents, each with how soon it plays."
              - listitem [ref=f18e161]: Every audio track and subtitle of a file can be switched in the player.
              - listitem [ref=f18e162]: A Library section for what is on the server, and search with the on-screen keyboard.
              - listitem [ref=f18e163]: Choose how big Playpex looks on this screen.
          - generic [ref=f18e164]:
            - heading "Playpex Mobile 0.1.0 alpha 1" [level=4] [ref=f18e165]
            - list [ref=f18e166]:
              - listitem [ref=f18e167]: First release. Your library on your phone; files play as they are, with every audio track and subtitle.
