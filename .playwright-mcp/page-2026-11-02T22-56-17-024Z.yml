    - region [ref=f20e115]:
      - heading "What changed" [level=2] [ref=f20e116]
      - article [ref=f20e117]:
        - generic [ref=f20e118]:
          - heading "0.10.1 alpha 1" [level=3] [ref=f20e120]
          - paragraph [ref=f20e121]: Remote control, 1 November 2026
        - generic [ref=f20e122]:
          - generic [ref=f20e123]:
            - heading "Playpex Media Server" [level=4] [ref=f20e124]
            - list [ref=f20e125]:
              - listitem [ref=f20e126]: "Remote control from the dashboard: play, pause, seek and stop on any screen, or take over its keyboard and pointer."
              - listitem [ref=f20e127]: Commands travel over a direct connection between the dashboard and the screen when the network allows it.
          - generic [ref=f20e128]:
            - heading "Playpex TV" [level=4] [ref=f20e129]
            - list [ref=f20e130]:
              - listitem [ref=f20e131]: Can be controlled from the dashboard or a phone; a badge and a drawn pointer show while it is.
              - listitem [ref=f20e132]: Remote control can be switched off for this screen in Settings.
          - generic [ref=f20e133]:
            - heading "Playpex Mobile" [level=4] [ref=f20e134]
            - list [ref=f20e135]:
              - listitem [ref=f20e136]: "The phone is a remote for any screen: a touchpad, the arrows, OK and Back, and typing."
          - generic [ref=f20e137]:
            - heading "Server Manager" [level=4] [ref=f20e138]
            - list [ref=f20e139]:
              - listitem [ref=f20e140]: First release. Finds the Playpex server on your Wi-Fi by itself and opens its dashboard on your phone.
              - listitem [ref=f20e141]: The remote for every screen in the house, with a touchpad and the arrows.
      - article [ref=f20e142]:
        - generic [ref=f20e143]:
          - heading "0.10.0 alpha 1" [level=3] [ref=f20e145]
          - paragraph [ref=f20e146]: First alpha, 30 October 2026
        - generic [ref=f20e147]:
          - generic [ref=f20e148]:
            - heading "Playpex Media Server" [level=4] [ref=f20e149]
            - list [ref=f20e150]:
              - listitem [ref=f20e151]: "A library of your folders: every file matched to its title, poster and story, with fixes for wrong matches."
              - listitem [ref=f20e152]: "Downloads as a full torrent client: a queue, per-download rules and speed limits, three engines to choose from."
              - listitem [ref=f20e153]: "Plugins: sources, live TV, ratings and more from signed repositories, each running in a sandbox."
              - listitem [ref=f20e154]: Live TV with a programme guide, from your own M3U playlist.
              - listitem [ref=f20e155]: One search for everything the server can reach, and pasted links read by the server.
              - listitem [ref=f20e156]: A DLNA server for the TVs on your network, and the name playpex.local.
          - generic [ref=f20e157]:
            - heading "Playpex TV" [level=4] [ref=f20e158]
            - list [ref=f20e159]:
              - listitem [ref=f20e160]: "Play opens a chooser: files on this server, streams and torrents, each with how soon it plays."
              - listitem [ref=f20e161]: Every audio track and subtitle of a file can be switched in the player.
              - listitem [ref=f20e162]: A Library section for what is on the server, and search with the on-screen keyboard.
              - listitem [ref=f20e163]: Choose how big Playpex looks on this screen.
          - generic [ref=f20e164]:
            - heading "Playpex Mobile 0.1.0 alpha 1" [level=4] [ref=f20e165]
            - list [ref=f20e166]:
              - listitem [ref=f20e167]: First release. Your library on your phone; files play as they are, with every audio track and subtitle.
