        - article [ref=f24e78]:
          - 'heading "0.10.1 alpha 1: Remote control" [level=2] [ref=f24e79]'
          - paragraph [ref=f24e80]: 1 November 2026
          - heading "Playpex Media Server" [level=3] [ref=f24e81]
          - list [ref=f24e82]:
            - listitem [ref=f24e83]: "Remote control from the dashboard: play, pause, seek and stop on any screen, or take over its keyboard and pointer."
            - listitem [ref=f24e84]: Commands travel over a direct connection between the dashboard and the screen when the network allows it.
          - heading "Playpex TV" [level=3] [ref=f24e85]
          - list [ref=f24e86]:
            - listitem [ref=f24e87]: Can be controlled from the dashboard or a phone; a badge and a drawn pointer show while it is.
            - listitem [ref=f24e88]: Remote control can be switched off for this screen in Settings.
          - heading "Playpex Mobile" [level=3] [ref=f24e89]
          - list [ref=f24e90]:
            - listitem [ref=f24e91]: "The phone is a remote for any screen: a touchpad, the arrows, OK and Back, and typing."
          - heading "Server Manager" [level=3] [ref=f24e92]
          - list [ref=f24e93]:
            - listitem [ref=f24e94]: First release. Finds the Playpex server on your Wi-Fi by itself and opens its dashboard on your phone.
            - listitem [ref=f24e95]: The remote for every screen in the house, with a touchpad and the arrows.
        - article [ref=f24e96]:
          - 'heading "0.10.0 alpha 1: First alpha" [level=2] [ref=f24e97]'
          - paragraph [ref=f24e98]: 30 October 2026
          - heading "Playpex Media Server" [level=3] [ref=f24e99]
          - list [ref=f24e100]:
            - listitem [ref=f24e101]: "A library of your folders: every file matched to its title, poster and story, with fixes for wrong matches."
            - listitem [ref=f24e102]: "Downloads as a full torrent client: a queue, per-download rules and speed limits, three engines to choose from."
            - listitem [ref=f24e103]: "Plugins: sources, live TV, ratings and more from signed repositories, each running in a sandbox."
            - listitem [ref=f24e104]: Live TV with a programme guide, from your own M3U playlist.
            - listitem [ref=f24e105]: One search for everything the server can reach, and pasted links read by the server.
            - listitem [ref=f24e106]: A DLNA server for the TVs on your network, and the name playpex.local.
          - heading "Playpex TV" [level=3] [ref=f24e107]
          - list [ref=f24e108]:
            - listitem [ref=f24e109]: "Play opens a chooser: files on this server, streams and torrents, each with how soon it plays."
            - listitem [ref=f24e110]: Every audio track and subtitle of a file can be switched in the player.
            - listitem [ref=f24e111]: A Library section for what is on the server, and search with the on-screen keyboard.
            - listitem [ref=f24e112]: Choose how big Playpex looks on this screen.
          - heading "Playpex Mobile 0.1.0 alpha 1" [level=3] [ref=f24e113]
          - list [ref=f24e114]:
            - listitem [ref=f24e115]: First release. Your library on your phone; files play as they are, with every audio track and subtitle.
