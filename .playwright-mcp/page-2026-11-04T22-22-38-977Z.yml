          - generic [ref=f66e47]:
            - heading "Your films sit in folders." [level=2] [ref=f66e48]
            - paragraph [ref=f66e49]: On the computer that keeps them, or on a network share. Point Playpex at them once.
          - generic [ref=f66e50]:
            - heading "Now they’re a library." [level=2] [ref=f66e51]
            - paragraph [ref=f66e52]: Every file is matched to its title, with the poster, the cast and the ratings.
