plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.playpex.mobile.device'
version = '0.1.0'

dependencies {
  // sharing shortcuts (Share to Playpex's direct share)
  implementation 'androidx.core:core:1.13.1'
}

android {
  namespace "app.playpex.mobile.device"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
