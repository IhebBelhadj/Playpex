<px-section-layout class="adultBrowse">

  <!-- Search, filters and the other layout -->
  <div class="toolbar" pxSection="adultToolbar"
    [leaveFor]="{ left: '@menu', down: ['stack:adult-browse', '@adultPosters'] }">
    <div class="seal" aria-label="Adults only">18+</div>
    <px-search-field key="search" [query]="state.query" placeholder="Search titles"></px-search-field>
    <px-button key="filters" variant="toolbar" icon="opts" [label]="filterLabel" [active]="!!(state.studio || state.period)"></px-button>
    <px-button *ngIf="filtered" key="clear" variant="toolbar" [quiet]="true" label="Clear"></px-button>
    <span class="spacer"></span>
    <px-button key="layout" variant="toolbar" [quiet]="true" icon="rows" label="List view"></px-button>
  </div>

  <!-- Posters, and the empty state's way out: one section -->
  <div class="postersArea" pxSection="adultPosters" [leaveFor]="{ left: '@menu', up: '@adultToolbar' }">

  <!-- The focused title, laid out like <movie-description> -->
  <px-title-info class="titleInfo" *ngIf="spot && !note" [info]="titleInfo" layout="section"></px-title-info>

  <!-- never a dead end: the empty state has its own way out -->
  <px-empty class="titleInfo" *ngIf="note" size="hero" [title]="loadError ? '18+ catalog unavailable' : 'No titles'" [text]="note"
    [action]="loadError || !filtered ? 'Try again' : state.query ? 'Clear search' : 'Clear filters'"
    [actionKey]="loadError || !filtered ? 'retry' : 'clear'" [actionVariant]="loadError || !filtered ? 'outline' : 'primary'"
    (act)="loadError || !filtered ? load() : clearAll()"></px-empty>

  <px-empty class="titleInfo" *ngIf="!spot && !note && loading" size="hero" [busy]="true"
    [text]="'Loading ' + (provider?.name || 'the catalog') + '…'"></px-empty>

  <!-- Category-style rows, like the movies page -->
  <div class="sliderContainer" *ngIf="state.rows.length && !loadError" pxStack="adult-browse" align="row-top" motion="transform">
    <div class="overlay"></div>
    <div class="content" pxTrack>
      <px-card-row class="section" *ngFor="let row of state.rows; trackBy: trackRow" pxStackItem [attr.data-row]="row.key"
        [rowKey]="row.key" [title]="row.title" [loadAhead]="loadAhead" (nearEnd)="loadMore(row)">
        <ng-container *ngFor="let item of row.items; let i = index; trackBy: trackItem">
          <px-card variant="poster" [key]="item.id" [image]="item.poster" [title]="item.title" [data]="{ row: row.key, index: i }"></px-card>
        </ng-container>
      </px-card-row>
    </div>
  </div>
  </div>
</px-section-layout>

<!-- Filters: studio and release period, applied together -->
<px-panel *ngIf="panel == 'filters'" class="filterPanel" id="adultFilterPanel" title="Filter titles" align="start" [width]="1040"
  focus=".studioGrid .selected" (closed)="panel = null">
  <div class="panelBody" pxStack>
    <h3 class="groupTitle">Studio</h3>
    <div class="studioGrid" pxGrid enter="nearest">
      <px-chip key="all" label="All studios" [selected]="!draftStudio" (pxSelect)="draftStudio = null"></px-chip>
      <px-chip *ngFor="let s of studios" [key]="s.id" [label]="s.name" [selected]="draftStudio?.id == s.id"
        (pxSelect)="draftStudio = s"></px-chip>
    </div>

    <h3 class="groupTitle">Released</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <px-chip *ngFor="let p of periods" [key]="p.id" [label]="p.label" [selected]="draftPeriod == p.id"
        (pxSelect)="draftPeriod = p.id"></px-chip>
    </div>

    <div class="panelActions" pxGrid enter="nearest">
      <px-button key="apply" variant="primary" label="Show titles" (pxSelect)="applyFilters()"></px-button>
      <px-button key="reset" label="Reset filters" (pxSelect)="draftStudio = null; draftPeriod = ''"></px-button>
    </div>
  </div>
</px-panel>

<text-keyboard *ngIf="panel == 'keyboard'"
  title="Search 18+ titles"
  placeholder="Title, studio or series"
  [value]="state.query"
  [maxLength]="60"
  [capitalizeWords]="false"
  doneLabel="Search"
  (done)="onSearchDone($event)"
  (cancelled)="onSearchCancelled()">
</text-keyboard>
