<!-- Laid out like the movie page (movie-description + movie-options): the
     title info on top, then the entries of this page's pxStack: the action
     tiles, the cast row, the "More from <studio>" row -->
<px-detail-layout class="adultTitle" pxSection="adultTitle" [leaveFor]="{ left: '@menu' }" pxStack>

  <px-title-info class="titleBlock" *ngIf="item" [info]="titleInfo" layout="detail"></px-title-info>

  <div class="options" *ngIf="item">
    <px-action-bar>
      <px-action key="play" icon="play" label="Play" busyLabel="Finding torrents…" [busy]="findingTorrents" (pxSelect)="play()"></px-action>
      <px-action key="releases" icon="search" label="Find releases" (pxSelect)="findReleases(item?.title)"></px-action>
    </px-action-bar>

    <!-- Enter on a performer: their releases in the compact list -->
    <px-card-row class="casts" *ngIf="details?.performers?.length" pxStackItem rowKey="cast" title="Cast" tone="detail"
      align="third">
      <ng-container *ngFor="let p of details.performers; let i = index; trackBy: byName">
        <px-card variant="portrait" [key]="p.name" [image]="p.photo" [title]="p.name" [data]="{ performer: i }"
          (pxSelect)="findReleases(p.name)"></px-card>
      </ng-container>
    </px-card-row>

    <px-card-row class="similar" *ngIf="more.length" pxStackItem rowKey="more" [title]="'More from ' + (studio?.name || '')"
      tone="detail" align="third">
      <ng-container *ngFor="let m of more; let i = index; trackBy: byId">
        <px-card variant="compact" [key]="m.id" [image]="m.poster" [title]="m.title" [subtitle]="m.year ? '' + m.year : ''"
          [data]="{ index: i }" (pxSelect)="open(m)"></px-card>
      </ng-container>
    </px-card-row>
  </div>

  <ng-container *ngIf="error">
    <header class="titleBlock">
      <h1 class="name">Title unavailable</h1>
      <p class="overview">{{ error }}</p>
    </header>
    <div class="options">
      <px-action-bar>
        <px-action key="back" icon="back" label="Go back" (pxSelect)="navigator.back()"></px-action>
      </px-action-bar>
    </div>
  </ng-container>
</px-detail-layout>
