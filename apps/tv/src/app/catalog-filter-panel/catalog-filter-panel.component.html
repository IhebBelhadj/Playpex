<div class="catalogFilters" pxSection="catalogFilters" [trap]="true">
  <div class="panelBody" pxStack>
    <h2 class="panelTitle">Filter {{ noun }}</h2>

    <h3 class="groupTitle">Genre</h3>
    <div class="genreGrid" pxGrid enter="nearest">
      <button class="chip focusable" pxItem data-genre="" [class.selected]="draft.genre === null">All genres</button>
      <button *ngFor="let g of genres" class="chip focusable" pxItem
        [attr.data-genre]="g.id" [class.selected]="draft.genre === g.id">{{ g.name }}</button>
    </div>

    <h3 class="groupTitle">{{ media == 'tv' ? 'First aired' : 'Released' }}</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <button *ngFor="let p of periods" class="chip focusable" pxItem
        [attr.data-period]="p.id" [class.selected]="draft.period === p.id">{{ p.label }}</button>
    </div>

    <h3 class="groupTitle">TMDB score</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <button *ngFor="let r of ratings" class="chip focusable" pxItem
        [attr.data-rating]="r.value" [class.selected]="draft.rating === r.value">{{ r.label }}</button>
    </div>

    <h3 class="groupTitle">Original language</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <button *ngFor="let l of languages" class="chip focusable" pxItem
        [attr.data-language]="l.id" [class.selected]="draft.language === l.id">{{ l.label }}</button>
    </div>

    <div class="panelActions" pxGrid enter="nearest">
      <button class="actionBtn primary focusable" pxItem data-action="apply">Show {{ noun }}</button>
      <button class="actionBtn focusable" pxItem data-action="reset">Reset filters</button>
    </div>
  </div>
</div>
