<px-panel id="catalogFilters" [title]="'Filter ' + noun" align="start" [width]="1040" focus=".genreGrid .selected"
  (back)="cancelled.emit()">
  <div class="panelBody" pxStack>
    <h3 class="groupTitle">Genre</h3>
    <div class="genreGrid" pxGrid enter="nearest">
      <px-chip key="all" label="All genres" [selected]="draft.genre === null" (pxSelect)="draft.genre = null"></px-chip>
      <px-chip *ngFor="let g of genres" [key]="g.id" [label]="g.name" [selected]="draft.genre === g.id"
        (pxSelect)="draft.genre = g.id"></px-chip>
    </div>

    <h3 class="groupTitle">{{ media == 'tv' ? 'First aired' : 'Released' }}</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <px-chip *ngFor="let p of periods" [key]="p.id" [label]="p.label" [selected]="draft.period === p.id"
        (pxSelect)="draft.period = p.id"></px-chip>
    </div>

    <h3 class="groupTitle">TMDB score</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <px-chip *ngFor="let r of ratings" [key]="r.value" [label]="r.label" [selected]="draft.rating === r.value"
        (pxSelect)="draft.rating = r.value"></px-chip>
    </div>

    <h3 class="groupTitle">Original language</h3>
    <div class="chipLine" pxGrid enter="nearest">
      <px-chip *ngFor="let l of languages" [key]="l.id" [label]="l.label" [selected]="draft.language === l.id"
        (pxSelect)="draft.language = l.id"></px-chip>
    </div>

    <div class="panelActions" pxGrid enter="nearest">
      <button class="actionBtn primary focusable" pxItem (pxSelect)="apply()">Show {{ noun }}</button>
      <button class="actionBtn focusable" pxItem (pxSelect)="reset()">Reset filters</button>
    </div>
  </div>
</px-panel>
