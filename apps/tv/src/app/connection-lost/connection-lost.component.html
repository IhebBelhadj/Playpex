<px-dialog *ngIf="connection.isOpen" id="connectionLost" level="system" [global]="true" [width]="520"
  [title]="'Lost connection to ' + connection.serverName"
  [subtitle]="connection.stillLost
    ? 'Still can\'t reach ' + connection.serverName + '. It may be off, or on another network.'
    : 'Playpex can\'t reach the server. Check that it is running and on the same network as this device.'"
  [subtitleTone]="connection.stillLost ? 'caution' : ''"
  (closed)="onClosed()">
  <px-option key="retry" [label]="connection.retrying ? 'Looking for the server…' : 'Retry'"
    detail="Also finds it at a new address" (pxSelect)="connection.retry()"></px-option>
  <px-option key="servers" label="Choose server"
    detail="Servers on this network, or enter an address" (pxSelect)="connection.chooseServer()"></px-option>
</px-dialog>
