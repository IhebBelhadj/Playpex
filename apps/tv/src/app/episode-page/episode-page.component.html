<!-- Entries of the section page's pxStack (src/app/movement): the buttons, the
     season's episodes row, the guest stars row. The title block above them
     stands in for <movie-description>, which movies-page hides here. -->
<div class="episodePageContainer" pxSection="episodePage" [leaveFor]="{ left: '@menu' }">
  <px-title-info class="episodeHeader" *ngIf="episode" [info]="titleInfo" layout="episode">
    <span pxEyebrow class="position">Season {{seasonNumber}}, episode {{episode.episode_number}}</span>
  </px-title-info>

  <!-- the episode page's bar is tighter and its labels wider ("Resume (12 min left)") -->
  <px-action-bar class="actions">
    <px-action key="play" icon="play" [label]="resumeLabel || 'Play ' + code" busyLabel="Finding torrents…"
      [busy]="resolving" [progress]="resumeRatio || null" (pxSelect)="play()"></px-action>
    <!-- every source's releases of this episode -->
    <!-- kept on the server (Downloads): progress, then "On this server" -->
    <px-action key="download" icon="download" onIcon="tick" [on]="downloadTile.on" [label]="downloadTile.label"
      [progress]="downloadTile.progress" (pxSelect)="onDownload()"></px-action>
    <px-action key="releases" icon="search" label="Find releases" (pxSelect)="findReleases()"></px-action>
    <px-action key="watched" icon="mark" onIcon="tick" [on]="watched"
      [label]="watched ? 'Watched' : 'Mark as watched'" (pxSelect)="toggleWatched()"></px-action>
    <!-- plugins' actions (ui/slots) -->
    <px-slot name="core.episode.actions" [context]="slotContext"></px-slot>
  </px-action-bar>

  <px-card-row class="episodes" *ngIf="episodes.length" pxStackItem rowKey="seasonEpisodes" tone="detail" align="third"
    variant="still">
    <!-- the row's title, with the season's ratings beside it -->
    <div pxRowHeader class="rowHeader">
      <h3 class="sectionTitle">
        {{seasonName}}
        <span class="count">{{episodes.length}} episodes</span>
      </h3>
      <season-curve [episodes]="episodes" [imdb]="seasonImdb"
        [current]="episode?.episode_number" [highlight]="focusedEpisode"></season-curve>
    </div>
    <ng-container *ngFor="let ep of episodes; let i = index; trackBy: byEpisode">
      <px-card variant="still" [key]="ep.episode_number" [image]="ep.still_path ? stillBase + ep.still_path : null"
        [title]="ep.name" [number]="ep.episode_number" [dim]="ep.upcoming && ep !== episode"
        [rating]="episodeRating(ep) ? { source: 'imdb', value: episodeRating(ep) } : null"
        [meta]="episodeMeta(ep)" [badges]="episodeBadges(ep)"
        [progress]="progressOf(ep) && !progressOf(ep).finished ? progressOf(ep).ratio : null"
        [data]="{ index: i, episode: ep.episode_number }" (pxSelect)="openEpisode(ep)"></px-card>
    </ng-container>
  </px-card-row>

  <px-card-row class="guests" *ngIf="guests.length" pxStackItem rowKey="guests" title="Guest stars" tone="detail" align="third"
   >
    <ng-container *ngFor="let guest of guests; trackBy: byCredit">
      <px-card variant="portrait" [key]="guest.credit_id" [image]="profileBase + guest.profile_path" [title]="guest.name"
        [subtitle]="guest.character || ''"></px-card>
    </ng-container>
  </px-card-row>
</div>
