<!-- Entries of the section page's pxStack (src/app/movement): the buttons, the
     seasons row, a season's episodes, the cast, the guest stars, similar shows.
     The title block above them stands in for <movie-description>, which
     movies-page hides here. -->
<div class="episodePageContainer" pxSection="episodePage" [leaveFor]="{ left: '@menu' }">
  <!-- where the episode is: its show (the way back to the show page, Up from
       the buttons) and its place in the show -->
  <div class="trail" *ngIf="show && episode">
    <button class="toShow focusable" pxItem pxItemKey="show" (pxSelect)="openShow()" [attr.aria-label]="'Go to ' + show.title">
      <img class="chevron" src="assets/icons/back.svg" alt="">
      <img class="thumb" *ngIf="show.posterPath" [src]="thumbBase + show.posterPath" alt="">
      <span class="name">{{show.title}}</span>
    </button>
    <span class="position">Season {{seasonNumber}} · Episode {{episode.episodeNumber}}</span>
  </div>
  <px-title-info class="episodeHeader" *ngIf="episode" [info]="titleInfo" layout="episode"></px-title-info>

  <!-- the episode page's bar is tighter and its labels wider ("Resume (12 min left)") -->
  <px-action-bar class="actions">
    <px-action key="play" icon="play" [label]="resumeLabel || 'Play ' + code" busyLabel="Finding sources…"
      [busy]="resolving" [progress]="resumeRatio || null" (pxSelect)="play()"></px-action>
    <!-- every source's releases of this episode -->
    <!-- kept on the server (Downloads): progress, then "On this server" -->
    <px-action key="download" icon="download" onIcon="tick" [on]="downloadTile.on" [label]="downloadTile.label"
      [progress]="downloadTile.progress" (pxSelect)="onDownload()"></px-action>
    <px-action *ngIf="releasesShown$ | async" key="releases" icon="search" label="Find releases" (pxSelect)="findReleases()"></px-action>
    <px-action key="watched" icon="mark" onIcon="tick" [on]="watched"
      [label]="watched ? 'Watched' : 'Mark as watched'" (pxSelect)="toggleWatched()"></px-action>
    <!-- plugins' actions (ui/slots) -->
    <px-slot name="core.episode.actions" [context]="slotContext"></px-slot>
  </px-action-bar>

  <!-- as on the show page: a focused season shows its episodes in the row below -->
  <px-card-row class="seasons" *ngIf="seasons.length > 1" pxStackItem rowKey="seasons" title="Seasons" tone="detail" align="third">
    <ng-container *ngFor="let season of seasons; trackBy: bySeason">
      <button class="season focusable" pxItem [pxItemKey]="season.seasonNumber"
        [class.selected]="season.seasonNumber === rowSeason" [attr.data-season]="season.seasonNumber"
        (pxSelect)="enterEpisodes()">
        {{season.name}}
        <span class="seasonRating" *ngIf="seasonRating(season.seasonNumber) as rating">{{rating | number:'1.1-1'}}</span>
        <span class="seasonOnServer" *ngIf="seasonOnServer(season.seasonNumber) as n"
          [attr.aria-label]="n + ' on this server'"><img src="assets/icons/server.svg" alt="">{{n}}</span>
      </button>
    </ng-container>
  </px-card-row>

  <px-card-row class="episodes" *ngIf="rowEpisodes.length" pxStackItem rowKey="seasonEpisodes" tone="detail" align="third"
    variant="still">
    <!-- the row's title, with the season's ratings beside it -->
    <div pxRowHeader class="rowHeader">
      <h3 class="sectionTitle">
        {{rowSeasonName}}
        <span class="count">{{rowEpisodes.length}} episodes</span>
        <px-spinner *ngIf="loadingRow"></px-spinner>
      </h3>
      <season-curve [episodes]="rowEpisodes" [imdb]="rowSeasonImdb"
        [current]="rowSeason === seasonNumber ? episode?.episodeNumber : null" [highlight]="focusedEpisode"></season-curve>
    </div>
    <ng-container *ngFor="let ep of rowEpisodes; let i = index; trackBy: byEpisode">
      <px-card variant="still" [key]="ep.episodeNumber" [image]="ep.stillPath ? stillBase + ep.stillPath : null"
        [title]="ep.name" [number]="ep.episodeNumber" [dim]="ep.upcoming && ep !== episode"
        [rating]="episodeRating(ep) ? { source: 'imdb', value: episodeRating(ep) } : null"
        [meta]="episodeMeta(ep)" [badges]="episodeBadges(ep)"
        [progress]="progressOf(ep) && !progressOf(ep).finished ? progressOf(ep).ratio : null"
        [data]="{ index: i, episode: ep.episodeNumber }" (pxSelect)="openEpisode(ep)"></px-card>
    </ng-container>
  </px-card-row>

  <!-- the show's regular cast, then this episode's guest stars -->
  <px-card-row class="cast" *ngIf="cast.length" pxStackItem rowKey="cast" title="Cast" tone="detail" align="third">
    <ng-container *ngFor="let person of cast; trackBy: byCredit">
      <px-card variant="portrait" [key]="person.creditId" [image]="profileBase + person.profilePath" [title]="person.name"
        [subtitle]="person.character || ''" (pxSelect)="openPerson(person)"></px-card>
    </ng-container>
  </px-card-row>

  <px-card-row class="guests" *ngIf="guests.length" pxStackItem rowKey="guests" title="Guest stars" tone="detail" align="third">
    <ng-container *ngFor="let guest of guests; trackBy: byCredit">
      <px-card variant="portrait" [key]="guest.creditId" [image]="profileBase + guest.profilePath" [title]="guest.name"
        [subtitle]="guest.character || ''" (pxSelect)="openPerson(guest)"></px-card>
    </ng-container>
  </px-card-row>

  <!-- Enter: that show's page, over this one -->
  <px-card-row class="similar" *ngIf="similar.length" pxStackItem rowKey="similar" title="Similar shows" tone="detail" align="third">
    <ng-container *ngFor="let title of similar; let i = index; trackBy: byTitle">
      <px-card variant="compact" [key]="title.tmdbId" [image]="posterBase + title.posterPath" [title]="title.title"
        [subtitle]="title.year || ''" [data]="{ index: i, id: title.tmdbId }" (pxSelect)="openSimilar(title)"></px-card>
    </ng-container>
  </px-card-row>
</div>
