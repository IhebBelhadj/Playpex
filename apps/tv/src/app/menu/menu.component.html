<div class="menuContainer expended">

  <div class="logo">
    <img src="assets/icons/logo.svg" alt="">
  </div>

  <!-- Places to browse, centered -->
  <div class="tabs sections">
    <button class="tabGroup element menuItem" data-destination="searchPage">
      <div class="inner">
        <img src="assets/icons/search.svg" alt="">
        <span class="description">Search</span>
      </div>
    </button>
    <button [class.active] = "currentUrl.includes('/movies')" class="tabGroup element menuItem" data-destination="moviesPage">
      <div class="inner">
        <img src="assets/icons/film.svg" alt="">
        <span class="description">Movies</span>
      </div>
    </button>
    <button [class.active] = "currentUrl.includes('/shows')" class="tabGroup element menuItem" data-destination="showsPage">
      <div class="inner">
        <img src="assets/icons/tv.svg" alt="">
        <span class="description">Tv shows</span>
      </div>
    </button>
    <button [class.active] = "currentUrl.includes('/watchlist')" class="tabGroup element menuItem" data-destination="watchPage">
      <div class="inner">
        <img src="assets/icons/list.svg" alt="">
        <span class="description">Watch list</span>
      </div>
    </button>
    <button *ngIf="profile && !profile.isKid" [class.active] = "currentUrl.includes('/adult')" class="tabGroup element menuItem" data-destination="adultPage">
      <div class="inner">
        <img src="assets/icons/adult.svg" alt="">
        <span class="description">18+</span>
      </div>
    </button>
    <button class="tabGroup element menuItem" data-destination="settingsPage">
      <div class="inner">
        <img src="assets/icons/settings.svg" alt="">
        <span class="description">Settings</span>
      </div>
    </button>
  </div>

  <!-- Who's watching, anchored at the bottom like an account control: Enter
       switches profile -->
  <div class="tabs account" *ngIf="profile">
    <button class="tabGroup element menuItem profileItem" data-destination="profiles">
      <div class="inner">
        <img class="profileAvatar" [src]="avatarUrl(profile.avatar)" alt="">
        <span class="description">{{ profile.name }}</span>
      </div>
    </button>
  </div>


</div>
