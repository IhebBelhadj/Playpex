<div class="menuContainer expended">

  <div class="logo">
    <img src="assets/icons/logo.svg" alt="">
  </div>

  <!-- Places to browse, centered: the sections declared with a menu entry
       (src/app/nav/screens.ts), in their order -->
  <div class="tabs sections">
    <button *ngFor="let section of sections; trackBy: trackById" class="tabGroup element menuItem"
      [class.active]="section.id == activeSection" (pxSelect)="openSection(section)">
      <div class="inner">
        <img [src]="'assets/icons/' + section.menu.icon + '.svg'" alt="">
        <span class="description">{{ section.menu.label }}</span>
      </div>
    </button>
  </div>

  <!-- The server in use (Enter → /connect) and who's watching (Enter →
       switch profile), anchored at the bottom like account controls -->
  <div class="tabs account" *ngIf="profile">
    <button *ngIf="serverName" class="tabGroup element menuItem serverItem" (pxSelect)="openConnect()">
      <div class="inner">
        <img src="assets/icons/server.svg" alt="">
        <span class="description">{{ serverName }}</span>
      </div>
    </button>
    <button class="tabGroup element menuItem profileItem" (pxSelect)="openProfiles()">
      <div class="inner">
        <img class="profileAvatar" [src]="avatarUrl(profile.avatar)" alt="">
        <span class="description">{{ profile.name }}</span>
      </div>
    </button>
  </div>


</div>
