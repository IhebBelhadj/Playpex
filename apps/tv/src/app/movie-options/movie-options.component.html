<!-- Entries of the section page's pxStack (src/app/movement): the buttons, the
     cast row, the similar titles row -->
<div class="optionsMasterContainer" pxSection="options" [leaveFor]="{ left: '@menu' }">
  <px-action-bar>
    <px-action key="play" icon="play" [label]="resumeLabel || 'Play'" busyLabel="Finding torrents…"
      [busy]="findingTorrents" (pxSelect)="onPlay()"></px-action>
    <px-action key="trailer" icon="trailer" label="Trailer" (pxSelect)="onTrailer()"></px-action>
    <!-- every source plugin's releases of this movie (none: no button) -->
    <px-action *ngIf="releasesShown$ | async" key="releases" icon="search" label="Find releases" (pxSelect)="findReleases()"></px-action>
    <!-- kept on the server (Downloads): progress, then "On this server" -->
    <px-action key="download" icon="download" onIcon="tick" [on]="downloadTile.on" [label]="downloadTile.label"
      [progress]="downloadTile.progress" (pxSelect)="onDownload()"></px-action>
    <px-action key="watchlist" icon="bookmark" onIcon="tick" [on]="inWatchlist"
      [label]="inWatchlist ? 'In your watch list' : 'Add to watch list'" (pxSelect)="toggleWatchlist()"></px-action>
    <px-action key="watched" icon="mark" onIcon="tick" [on]="watched"
      [label]="watched ? 'Watched' : 'Mark as watched'" (pxSelect)="toggleWatched()"></px-action>
    <!-- plugins' actions (ui/slots) -->
    <px-slot name="core.movie.actions" [context]="slotContext"></px-slot>
  </px-action-bar>

  <px-card-row class="casts" pxStackItem rowKey="cast" title="cast" tone="detail" align="third">
    <ng-container *ngFor="let cast of casts; let i = index; trackBy: byCredit">
      <px-card variant="portrait" [key]="cast.credit_id" [image]="profileImgBase + cast.profile_path" [title]="cast.name"
        [data]="{ index: i }"></px-card>
    </ng-container>
  </px-card-row>

  <px-card-row class="similar" pxStackItem rowKey="similar" title="Similar titles to watch" tone="detail" align="third"
   >
    <ng-container *ngFor="let movie of similar; let i = index; trackBy: byId">
      <px-card variant="compact" [key]="movie.id" [image]="movieImgBase + movie.poster_path" [title]="movie.original_title"
        [subtitle]="(movie.release_date || '').slice(0, 4)" [data]="{ index: i, id: movie.id }" (pxSelect)="openSimilar(movie)"></px-card>
    </ng-container>
  </px-card-row>

  <px-slot name="core.movie.rows" [context]="slotContext"></px-slot>
</div>
