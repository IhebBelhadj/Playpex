<!-- A scrolling pxStack (src/app/movement): its entries are the routed page's
     rows (the list's translated rows, a detail page's buttons and rows) -->
<px-detail-layout class="pageContainer" pxStack>
  <!-- List page: search and filter this section (their rows stand in for the section's) -->
  <div class="sectionToolbar" *ngIf="onList" pxSection="sectionToolbar" [leaveFor]="toolbarExits">
    <px-search-field key="search" [query]="catalog.query" [placeholder]="searchHint" (pxSelect)="catalog.typing = true"></px-search-field>
    <px-button key="filters" variant="toolbar" icon="opts" [label]="filterLabel" [active]="filtered"
      (pxSelect)="catalog.filtering = true"></px-button>
    <px-button *ngIf="catalog.search" key="clear" variant="toolbar" [quiet]="true" label="Clear" (pxSelect)="clearSearch()"></px-button>
  </div>
  <!-- an episode page shows its own title block -->
  <!-- (nor while a search / filters show nothing: it would describe an earlier title) -->
  <movie-description *ngIf="!onEpisode && !(onList && viewEmpty)"></movie-description>
  <router-outlet></router-outlet>

</px-detail-layout>

<text-keyboard *ngIf="catalog.typing"
  [title]="searchHint"
  [placeholder]="catalog.media == 'tv' ? 'Show title' : 'Movie title'"
  [value]="catalog.query"
  [maxLength]="60"
  [capitalizeWords]="false"
  doneLabel="Search"
  (done)="onSearchDone($event)"
  (cancelled)="onSearchCancelled()">
</text-keyboard>

<catalog-filter-panel *ngIf="catalog.filtering"
  [media]="catalog.media"
  [filters]="catalog.filters"
  [genres]="genres"
  (applied)="onFiltersApplied($event)"
  (cancelled)="closeFilters()">
</catalog-filter-panel>
