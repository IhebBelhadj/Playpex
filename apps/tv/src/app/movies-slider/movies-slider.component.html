<!-- Category rows: a pxStack of pxRows, translated (motion="transform"), see src/app/movement -->
<div class="sliderContainer"
  pxSection="slider" [leaveFor]="{ left: '@menu', up: '@sectionToolbar' }"
  [pxStack]="stackId" align="row-top" motion="transform">
  <div class="overlay"></div>
  <!-- the section's search / filters (movies-page): while they load, or find nothing -->
  <p class="searchNote" *ngIf="catalog.search && searchEmpty">{{ searchNote }}</p>
  <div class="content" pxTrack>
    <ng-container *ngFor="let category of movies | keyvalue:unsorted ; trackBy:trackByCategory ">
    <!-- rows are created in category order; empty ones are still loading -->
    <div class="section" *ngIf="category.value.length" pxStackItem>
      <h3 class="sectionTitle">{{category.key}}</h3>
      <div class="slider" rowArrows>
        <div class="elements_wrapper sliderSection" [pxRow]="category.key" align="start"
          [loadAhead]="loadAhead" (nearEnd)="loadMore(category.key)">

          <button class="element" pxItem [pxItemKey]="movie?.id"
            *ngFor="let movie of category.value ; let i=index; trackBy:trackById"
            [attr.data-id]="movie?.id"
            [attr.data-section]="category.key"
            [attr.data-index]="i"
            (pxSelect)="open(movie)">

            <img src="{{imgBaseUrl + movie?.poster_path}}" alt="">

          </button>

        </div>
      </div>
    </div>

    </ng-container>
  </div>
</div>
