<!-- Category rows: a pxStack of pxRows, translated (motion="transform"), see src/app/movement -->
<div class="sliderContainer"
  pxSection="slider" [leaveFor]="{ left: '@menu', up: '@sectionToolbar' }"
  [pxStack]="stackId" align="row-top" motion="transform">
  <div class="overlay"></div>
  <!-- the section's search / filters (movies-page): while they load, or find nothing -->
  <px-empty class="searchNote" *ngIf="catalog.search && searchEmpty" [text]="searchNote"></px-empty>
  <div class="content" pxTrack>
    <ng-container *ngFor="let category of movies | keyvalue:unsorted ; trackBy:trackByCategory ">
    <!-- rows are created in category order; empty ones are still loading -->
    <px-card-row class="section" *ngIf="category.value.length" pxStackItem [rowKey]="category.key" [title]="category.key"
      [loadAhead]="loadAhead" (nearEnd)="loadMore(category.key)">
      <ng-container *ngFor="let movie of category.value; let i = index; trackBy: trackById">
        <px-card variant="poster" [key]="movie?.tmdbId" [image]="movie?.posterPath ? imgBaseUrl + movie.posterPath : null"
          [title]="movie?.title || ''" [data]="{ id: movie?.tmdbId, section: category.key, index: i }"
          (pxSelect)="open(movie)"></px-card>
      </ng-container>
    </px-card-row>

    </ng-container>
    <!-- plugins' rows (ui/slots), after the section's; not while a search / filters stand in -->
    <px-slot *ngIf="!catalog.search" [name]="slotName" [context]="slotContext"></px-slot>
  </div>
</div>
