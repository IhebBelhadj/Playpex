<!-- The section's rows: a pxStack of pxRows, translated (motion="transform"), see src/app/movement -->
<div class="sliderContainer"
  pxSection="slider" [leaveFor]="{ left: '@menu', up: '@sectionToolbar' }"
  [pxStack]="stackId" align="row-top" motion="transform">
  <div class="overlay"></div>
  <!-- the section's search / filters (movies-page): while they load, or find nothing -->
  <px-empty class="searchNote" *ngIf="catalog.search && searchEmpty" [text]="searchNote"></px-empty>
  <!-- no row at all (a layout with everything hidden, nothing answered) -->
  <px-empty class="searchNote" *ngIf="!catalog.search && !catalog.loading && sectionEmpty" [text]="emptyNote"></px-empty>
  <div class="content" pxTrack>
    <ng-container *ngFor="let row of catalog.rows; trackBy: trackByRow">
    <!-- rows in the layout's order; empty ones are still loading (or have nothing) -->
    <px-card-row class="section" *ngIf="movies[row.key]?.length" pxStackItem [rowKey]="row.key" [title]="row.title"
      [variant]="movies[row.key][0].variant" [loadAhead]="loadAhead" (nearEnd)="loadMore(row.key)">
      <ng-container *ngFor="let card of movies[row.key]; let i = index; trackBy: trackByKey">
        <px-card [variant]="card.variant" [key]="card.key" [image]="card.image" [title]="card.title"
          [subtitle]="card.subtitle || ''" [badges]="card.badges || null" [progress]="card.progress ?? null" [number]="card.number ?? null" [overlay]="card.overlay || ''"
          [data]="{ id: card.key, section: row.key, index: i }" (pxSelect)="open(row, card)"></px-card>
      </ng-container>
    </px-card-row>

    </ng-container>
    <!-- an older server's rows: plugins' rows come through the section's slot; not while a search / filters stand in -->
    <px-slot *ngIf="!catalog.search && !catalog.serverRows && slotName" [name]="slotName" [context]="slotContext"></px-slot>
  </div>
</div>
