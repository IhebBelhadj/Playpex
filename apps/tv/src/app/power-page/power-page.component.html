<div class="pageContainer">
  <div class="powerSection" pxSection="powerControls" pxGrid>
    <button class="powerBtn" pxItem data-instruction="quit" (pxSelect)="send('quit')">Quit</button>
    <button class="powerBtn" pxItem data-instruction="sleep" (pxSelect)="send('sleep')">Sleep</button>
    <button class="powerBtn" pxItem data-instruction="shutdown" (pxSelect)="send('shutdown')">Shutdown</button>
    <button class="powerBtn" pxItem data-instruction="restart" (pxSelect)="send('restart')">Restart</button>
  </div>
</div>
