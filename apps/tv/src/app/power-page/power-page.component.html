<div class="pageContainer">
  <div class="powerSection" pxSection="powerControls" pxGrid>
    <px-button key="quit" variant="plate" [width]="width" label="Quit" (pxSelect)="send('quit')"></px-button>
    <px-button key="sleep" variant="plate" [width]="width" label="Sleep" (pxSelect)="send('sleep')"></px-button>
    <px-button key="shutdown" variant="plate" [width]="width" label="Shutdown" (pxSelect)="send('shutdown')"></px-button>
    <px-button key="restart" variant="plate" [width]="width" label="Restart" (pxSelect)="send('restart')"></px-button>
  </div>
</div>
