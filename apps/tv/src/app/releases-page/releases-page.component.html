<px-rail-layout class="releasesPage" [railWidth]="360">

  <!-- Search, source and filters -->
  <aside pxRail class="rail" pxSection="releasesFilters"
    [leaveFor]="{ left: '@menu', right: ['grid:' + listId, '@releasesList'] }">
    <div class="railHead">
      <!-- opened from a title's "Find releases": the way back to it -->
      <px-button *ngIf="origin" key="origin" variant="toolbar" size="l" icon="back" align="start" width="100%"
        [label]="'Back to ' + origin.label" (pxSelect)="navigator.back()"></px-button>
      <div class="seal" *ngIf="!origin && kind == 'adult'" aria-label="Adults only">18+</div>
    </div>

    <px-search-field key="search" size="l" width="100%" [query]="state.query" placeholder="Search releases"
      (pxSelect)="keyboardOpen = true"></px-search-field>
    <div class="clearSearch" *ngIf="state.query">
      <px-button key="clear" variant="toolbar" [quiet]="true" label="Clear search"
        (pxSelect)="change({ query: '', imdb: null }, SEARCH_FIELD)"></px-button>
    </div>

    <h2 class="groupTitle">Source</h2>
    <div class="chips">
      <px-chip *ngFor="let p of providers" [key]="'provider:' + p.id" [label]="p.name"
        [selected]="p.id == state.provider" (pxSelect)="change({ provider: p.id })"></px-chip>
    </div>

    <h2 class="groupTitle">Quality</h2>
    <div class="chips">
      <px-chip *ngFor="let q of qualities" [key]="'quality:' + q.id" [label]="q.label"
        [selected]="q.id == state.quality" (pxSelect)="change({ quality: q.id })"></px-chip>
    </div>

    <div class="playableToggle">
      <px-switch key="playable" label="Only releases that play here" hint="Hides x265, 4K and Dolby / DTS audio"
        [on]="state.playableOnly" (pxSelect)="change({ playableOnly: !state.playableOnly })"></px-switch>
    </div>

    <!-- back to the poster layout: quiet, at the bottom of the rail -->
    <div class="layoutSwitch" *ngIf="kind == 'adult'">
      <px-button key="layout" variant="toolbar" [quiet]="true" icon="grid" label="Poster view" (pxSelect)="switchLayout()"></px-button>
    </div>
  </aside>

  <!-- That source's releases, most seeded first -->
  <section pxMain class="releases" pxSection="releasesList" [leaveFor]="{ left: '@releasesFilters' }">
    <header class="listHeader">
      <h1 class="heading">{{ heading }}</h1>
      <p class="count" *ngIf="state.releases.length">
        {{ state.releases.length }}{{ state.hasMore ? '+' : '' }} releases, most seeded first
      </p>
    </header>

    <px-empty class="listNote" *ngIf="note" [text]="note" [action]="loadError ? 'Try again' : ''" actionKey="retry"
      (act)="load()"></px-empty>

    <div class="releasesViewport" *ngIf="state.releases.length"
      [pxGrid]="listId" align="third" [loadAhead]="loadAhead" (nearEnd)="loadMore()">
      <ol class="releaseList">
        <li *ngFor="let r of state.releases; let i = index; trackBy: trackRelease">
          <button class="release focusable" pxItem [pxItemKey]="r.hash"
            [class.quiet]="r.seeds < 5"
            [attr.data-hash]="r.hash"
            [attr.data-index]="i">

            <span class="seeds">
              <span class="seedCount">{{ r.seeds | number }}</span>
              <span class="seedLabel">{{ r.seeds == 1 ? 'seeder' : 'seeders' }}</span>
              <span class="seedMeter"><span [style.width.%]="seedShare(r.seeds) * 100"></span></span>
            </span>

            <span class="releaseInfo">
              <span class="releaseTitle">{{ r.title }}</span>
              <span class="releaseMeta">
                <span class="episode" *ngIf="episodeLabel(r)">{{ episodeLabel(r) }}</span>
                <span class="studio" *ngIf="r.studio">{{ r.studio }}</span>
                <span *ngIf="r.year">{{ r.year }}</span>
                <span *ngIf="r.scenes">Split scenes</span>
                <span *ngIf="r.added">{{ age(r.added) }}</span>
              </span>
              <span class="releaseName">{{ r.name }}</span>
            </span>

            <span class="releaseTags">
              <span class="tag quality">{{ qualityLabel(r.quality) }}</span>
              <span class="tag" *ngIf="r.size">{{ size(r.size) }}</span>
              <span class="tag warn" *ngIf="!r.playable">May not play</span>
              <span class="tag warn" *ngIf="r.audio == 'unsupported'">Probably no sound</span>
            </span>
          </button>
        </li>
      </ol>
      <p class="moreNote" *ngIf="loading && state.releases.length">Loading more…</p>
    </div>
  </section>
</px-rail-layout>

<text-keyboard *ngIf="keyboardOpen"
  title="Search releases"
  [placeholder]="searchHint"
  [value]="state.query"
  [maxLength]="60"
  [capitalizeWords]="false"
  doneLabel="Search"
  (done)="onSearchDone($event)"
  (cancelled)="onSearchCancelled()">
</text-keyboard>
