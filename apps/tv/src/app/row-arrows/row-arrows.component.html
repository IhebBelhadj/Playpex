<ng-content></ng-content>
<!-- not navigable (no pxItem / .focusable): never focused; a click pages the row -->
<button type="button" class="rowArrow back" tabindex="-1" aria-label="Scroll back" (click)="page(-1)">
  <span class="rowArrowCap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
  </span>
</button>
<button type="button" class="rowArrow forward" tabindex="-1" aria-label="Scroll forward" (click)="page(1)">
  <span class="rowArrowCap">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
  </span>
</button>
