<!-- Settings › Rows: the section's rows, one line each (a pxStackItem of the
     settings page's pxStack, holding a pxGrid of its three buttons) -->
<div class="rowsEditor">
  <px-empty *ngIf="!entries && !failed" text="Reading the rows…"></px-empty>
  <px-empty *ngIf="failed" text="The server didn't answer. Try again in a moment."></px-empty>

  <ng-container *ngIf="entries">
    <div class="entry" *ngFor="let e of entries; let i = index; trackBy: byId" [class.hidden]="e.hidden"
      pxStackItem pxGrid enter="nearest">
      <span class="position">{{ i + 1 }}</span>
      <span class="label">
        <span class="name">{{ e.label || e.title || e.source }}</span>
        <span class="tag" *ngIf="e.hidden">Hidden</span>
        <span class="tag" *ngIf="e.new && !e.hidden">New</span>
      </span>
      <px-button [key]="'up:' + e.id" variant="toolbar" label="Up" [quiet]="i == 0" (pxSelect)="move(e, -1)"></px-button>
      <px-button [key]="'down:' + e.id" variant="toolbar" label="Down" [quiet]="i == entries.length - 1" (pxSelect)="move(e, 1)"></px-button>
      <px-button [key]="'hide:' + e.id" variant="toolbar" [label]="e.hidden ? 'Show' : 'Hide'" [active]="!!e.hidden" (pxSelect)="toggle(e)"></px-button>
    </div>

    <div class="actions" *ngIf="own" pxStackItem pxGrid enter="nearest">
      <px-button key="reset" label="Reset to the usual rows" (pxSelect)="reset()"></px-button>
    </div>
  </ng-container>
</div>
