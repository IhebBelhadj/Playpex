<div class="settingsPage" pxSection="settings" [leaveFor]="{ left: '@menu' }">
  <h1 class="heading">Settings</h1>

  <section class="group">
    <h2 class="groupTitle">Display</h2>
    <div class="setting">
      <p class="label">Size</p>
      <p class="help">How big text and pictures are on this screen. Moving over a size shows it; Enter keeps it. Saved on this device only.</p>
      <display-size></display-size>
    </div>
  </section>
</div>
