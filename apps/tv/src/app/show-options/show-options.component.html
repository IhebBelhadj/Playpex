<!-- Entries of the section page's pxStack (src/app/movement): the buttons, the
     seasons row, the episodes row -->
<div class="showOptionsContainer" pxSection="showOptions" [leaveFor]="{ left: '@menu' }">
  <px-action-bar>
    <px-action key="play" icon="play" [label]="'Play' + (selectedSeason ? ' S' + selectedSeason : '')" (pxSelect)="play()"></px-action>
    <px-action key="trailer" icon="trailer" label="Trailer" (pxSelect)="playTrailer()"></px-action>
    <!-- every source's releases of this show: episodes and season packs -->
    <px-action key="releases" icon="search" label="Find releases" (pxSelect)="findReleases()"></px-action>
    <px-action key="watchlist" icon="bookmark" onIcon="tick" [on]="inWatchlist"
      [label]="inWatchlist ? 'In your watch list' : 'Add to watch list'" (pxSelect)="toggleWatchlist()"></px-action>
    <!-- plugins' actions (ui/slots) -->
    <px-slot name="core.show.actions" [context]="slotContext"></px-slot>
  </px-action-bar>

  <px-card-row class="seasons" *ngIf="seasons.length" pxStackItem rowKey="seasons" title="Seasons" tone="detail" align="third"
   >
    <!-- a season chip, with the season's IMDb mean -->
    <ng-container *ngFor="let season of seasons; trackBy: bySeason">
      <button class="season focusable" pxItem [pxItemKey]="season.season_number"
        [class.selected]="season.season_number === selectedSeason" [attr.data-season]="season.season_number"
        (pxSelect)="enterEpisodes()">
        {{season.name}}
        <span class="seasonRating" *ngIf="seasonRating(season.season_number) as rating">{{rating | number:'1.1-1'}}</span>
        <!-- episodes of the season on the Playpex server -->
        <span class="seasonOnServer" *ngIf="seasonOnServer(season.season_number) as n"
          [attr.aria-label]="n + ' on this server'"><img src="assets/icons/server.svg" alt="">{{n}}</span>
      </button>
    </ng-container>
  </px-card-row>

  <px-card-row class="episodes" pxStackItem rowKey="episodes" tone="detail" align="third" variant="still"
   >
    <!-- the row's title, with the season's ratings beside it -->
    <div pxRowHeader class="rowHeader">
      <h3 class="sectionTitle">
        {{seasonName}}
        <span class="count" *ngIf="episodes.length">{{episodes.length}} episodes</span>
        <px-spinner *ngIf="loadingEpisodes"></px-spinner>
      </h3>
      <season-curve [episodes]="episodes" [imdb]="selectedSeasonImdb" [highlight]="focusedEpisode"></season-curve>
    </div>
    <ng-container *ngFor="let ep of episodes; let i = index; trackBy: byEpisode">
      <px-card variant="still" [key]="ep.episode_number" [image]="ep.still_path ? stillBase + ep.still_path : null"
        [title]="ep.name" [number]="ep.episode_number" [dim]="ep.upcoming"
        [rating]="episodeRating(ep) ? { source: 'imdb', value: episodeRating(ep) } : null"
        [meta]="episodeMeta(ep)" [badges]="episodeBadges(ep)"
        [progress]="progressOf(ep) && !progressOf(ep).finished ? progressOf(ep).ratio : null"
        [busy]="isResolving(ep)" busyLabel="Finding torrents…" [data]="{ index: i, episode: ep.episode_number }"
        (pxSelect)="openEpisode(ep)"></px-card>
    </ng-container>
  </px-card-row>

  <px-slot name="core.show.rows" [context]="slotContext"></px-slot>
</div>
