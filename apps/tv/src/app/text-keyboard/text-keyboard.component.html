<div class="textKeyboard" pxSection="textKeyboard" [trap]="true" pxStack>
  <p class="panelTitle" *ngIf="title">{{ title }}</p>
  <div class="textDisplay" [class.empty]="!value">{{ value || placeholder }}<span class="caret"></span></div>
  <div class="keyGrid" pxGrid enter="nearest">
    <button *ngFor="let k of letters" class="key" pxItem [attr.data-key]="k">{{ k }}</button>
    <button *ngFor="let k of digits" class="key" pxItem [attr.data-key]="k">{{ k }}</button>
    <button *ngFor="let k of symbols" class="key" pxItem [attr.data-key]="k">{{ k }}</button>
  </div>
  <div class="keyRow" pxGrid enter="nearest">
    <button class="key wide" pxItem data-key="space"><img src="assets/icons/spacebar.svg" alt="Space"></button>
    <button class="key wide" pxItem data-key="del"><img src="assets/icons/keyboardDelete.svg" alt="Delete"></button>
    <button class="key wide" pxItem data-key="clear">Clear</button>
    <button class="key wide primary" pxItem data-key="done">{{ doneLabel }}</button>
  </div>
</div>
