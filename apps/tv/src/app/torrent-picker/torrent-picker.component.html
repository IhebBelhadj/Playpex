<px-dialog *ngIf="request" id="torrentPicker" title="Choose a torrent" [width]="560"
  [subtitle]="request.title + ' · ' + request.options.length + (request.options.length == 1 ? ' source' : ' sources')"
  (closed)="cancel()">
  <px-option *ngFor="let option of request.options" (pxSelect)="pick(option)">
    <span class="main">
      <span class="quality">{{option.quality}}</span>
      <span class="tag" *ngFor="let tag of option.tags">{{tag}}</span>
      <span class="tag recommended" *ngIf="option.recommended">Best match</span>
    </span>
    <span class="meta">
      <span *ngIf="option.size">{{option.size}}</span>
      <span *ngIf="option.seeds !== undefined">{{option.seeds}} seeds</span>
      <span *ngIf="option.peers !== undefined">{{option.peers}} peers</span>
    </span>
    <span class="name" *ngIf="option.name">{{option.name}}</span>
    <span class="warning" *ngFor="let warning of option.warnings">{{warning}}</span>
  </px-option>
</px-dialog>
