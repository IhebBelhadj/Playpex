<button class="px-option" pxItem [pxItemKey]="key">
  <span class="px-option-label" *ngIf="label">{{ label }}</span>
  <span class="px-option-detail" *ngIf="detail">{{ detail }}</span>
  <ng-content></ng-content>
  <span class="px-option-progress" *ngIf="progress !== null"><span [style.width.%]="progress * 100"></span></span>
</button>
