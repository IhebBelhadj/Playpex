<div class="px-panel" [pxSection]="id" [trap]="true" [attr.data-level]="level" [class.end]="edge == 'end'">
  <div class="px-panel-frame" role="dialog" aria-modal="true" [attr.aria-label]="title || null" [class.start]="align == 'start' || edge == 'end'" [style.width]="width ? dp(width) : null">
    <h2 class="px-panel-title" *ngIf="title">{{ title }}</h2>
    <ng-content></ng-content>
  </div>
</div>
