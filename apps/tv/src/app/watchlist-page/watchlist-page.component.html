<px-section-layout class="libraryPage" pxSection="library" [leaveFor]="{ left: '@menu' }">

  <!-- The focused title, laid out like <movie-description> -->
  <!-- The focused title, laid out like <movie-description>, with where this profile is with it -->
  <px-title-info class="titleInfo" *ngIf="spot && !isEmpty && !loadError" [info]="titleInfo" layout="section"></px-title-info>

  <px-empty class="titleInfo" *ngIf="isEmpty" size="hero" title="Your watch list is empty"
    text="Save movies and shows with “Add to watch list” on their page. Anything you start watching shows up here too, so you can pick up where you left off."
    action="Browse movies" actionKey="browse" (act)="navigator.switchSection('core.movies')"></px-empty>

  <px-empty class="titleInfo" *ngIf="loadError" size="hero" title="Watch list unavailable" [text]="loadError"
    action="Try again" actionKey="retry" (act)="load()"></px-empty>

  <!-- Category-style rows, like the movies page -->
  <div class="sliderContainer" *ngIf="rows.length" pxStack="watchlist" align="row-top" motion="transform">
    <div class="overlay"></div>
    <div class="content" pxTrack>
      <px-card-row class="section" *ngFor="let row of rows" pxStackItem [attr.data-row]="row.key" [rowKey]="row.key"
        [title]="row.title">
        <ng-container *ngFor="let card of row.cards">
          <px-card variant="poster" [key]="card.key" [image]="posterUrl(card)" [title]="card.title" [progress]="card.progress || null"
            [data]="{ key: card.key }"></px-card>
        </ng-container>
      </px-card-row>
      <!-- plugins' rows (ui/slots), after the library's -->
      <px-slot name="core.watchlist.rows" [context]="slotContext"></px-slot>
    </div>
  </div>
</px-section-layout>
