openapi: 3.1.0
info:
  title: Playpex Media Server API
  version: '1'
  summary: The API every Playpex client talks to (TV app, future Android TV / mobile / web clients).
  description: |
    Source of truth for the Playpex protocol (docs/server-separation-plan.md §6). TypeScript types are
    generated from this file (`npm run generate -w packages/protocol` → types/api.d.ts), and the
    server's contract test (`npm test -w apps/server`) checks real answers against it.

    **Base URL**: `http://<server>:<port>/api/v1`. The default port is 28470 (the server's settings
    can change it).

    **Finding a server** (not HTTP; constants in `@playpex/protocol` `DISCOVERY`; plan §5.7). A server
    sharing on the LAN answers both ways below; use both and merge what you find by `id`. Then confirm
    with `GET /server` on the address found: identify a server by its `id`, never by its address, so a
    paired client finds it again after a DHCP or port change.
    - mDNS / DNS-SD: browse `_playpex._tcp.local`. SRV = the HTTP port in use; TXT `id` (server id),
      `v` (apiVersion), `ver` (server version), `name` (full server name).
    - UDP (for networks that filter multicast): send the datagram `PLAYPEX_DISCOVER 1` to port 28471
      (broadcast `255.255.255.255` and each interface's broadcast address, or unicast). Each server answers
      the sender with one JSON datagram `{ id, name, port, apiVersion, minApiVersion, version }`.
    - Manual entry: an address without a port means 28470.

    **Versioning**: `info.version` is the API version (`apiVersion` in `GET /server`), bumped only on
    breaking changes. Clients may send `X-Playpex-Client: <name>/<version>; api=<n>`; the server
    answers 426 `CLIENT_TOO_OLD` / `SERVER_TOO_OLD` when it can't serve that version.

    **Errors**: every error answer is JSON `{ error, code }` (see `Error`). Some list routes add an
    empty list next to it (`torrents: []`, `subtitles: []`).

    **Auth** (`auth: "pairing"` in `GET /server`; plan §6.3):
    - A client pairs once with the **RFC 8628 device flow**: `POST /auth/device/code` → it shows
      `user_code` (and `verification_uri`, maybe as a QR code of `verification_uri_complete`), then polls
      `POST /auth/device/token` every `interval` seconds until the server's admin approves the code
      (dashboard, tray, or `playpex-server devices approve <code>`). The answer's `access_token` is the
      device's token (valid a year, renewed while used); then `PUT /devices/me` says what the device is.
    - Every other request carries `Authorization: Bearer <token>`; media elements that can't set
      headers add `?access_token=<token>`. Without a valid token: **401 `PAIRING_REQUIRED`** (any route
      but the public ones: `GET /server`, `GET /openapi.yaml`, `GET /docs`, the two device-flow routes,
      `/admin/setup`). A revoked token
      gets the same 401: pair again.
    - Clients on the server machine (loopback) need no token, unless the server's setting
      `security.requirePairingOnLoopback` is on.
    - The dashboard signs in as the admin (`POST /auth/sign-in/username`, an HttpOnly session cookie)
      for `/admin/*` and `/sessions` (else **401 `ADMIN_REQUIRED`**). A device token never grants admin.
    - Device-flow errors follow RFC 8628 / RFC 6749: `{ error, error_description }` with 400
      (`authorization_pending`, `slow_down`, `expired_token`, `access_denied`, `invalid_grant`,
      `invalid_client`). Better Auth's other routes (`/auth/sign-in/…`) answer `{ message, code }`.

    **Events**: `GET /events` upgrades to a WebSocket of JSON messages `{ topic, time, data }`
    (see `Event`); same auth (`?access_token=` for clients that can't set headers).

    **Media refs**: every playable file has a ref (`TorrentFile.ref`; files on disk later from the
    play sources), and `/media/{ref}` streams, probes and transcodes it, wherever it is. Refs are
    opaque: use the ones the server gives. The `/torrents/{infoHash}/files|probe|keyframe|transcode/{path}`
    routes are aliases kept for API v1 clients.

    **Devices and leases**: a torrent stays running while a device holds it. Adding it,
    streaming its files (`/media/{ref}` or the torrent routes) and the keepalives take or refresh the
    calling device's lease; `DELETE /torrents/{infoHash}` (or `DELETE /media/{ref}`) releases it. A
    `stream` torrent pauses 30 s after the last lease is gone (its data is kept: only the admin
    deletes downloads). A file on disk has leases too (Activity), with nothing to stop. A lease with no request for the
    server's idle timeout (10 min by default) is dropped, so players send a keepalive every minute
    while open, paused or not. A paired device is the one its token names; a local client (no token)
    names its device with the `X-Playpex-Device` header or the `device` query parameter (media URLs),
    else the server uses its address. Past the server's limits (torrents, transcodes) answers are 503
    `BUSY`.

    Playpex is an educational project; streaming copyrighted content via torrents may be illegal
    where you live.
  license:
    name: See licence.md
servers:
  - url: http://localhost:28470/api/v1

security:
  - deviceToken: []
  - accessTokenParam: []
  - adminSession: []
  - {}   # loopback clients, unless the server requires pairing there too

tags:
  - name: server
  - name: auth
    description: Pairing (RFC 8628 device flow) and the admin's sign-in
  - name: devices
    description: A paired device's own record
  - name: admin
    description: The dashboard's routes (admin session)
  - name: events
    description: Real-time events (WebSocket)
  - name: media
    description: Any playable file by its media ref (a torrent's file or a file on disk), byte-range streaming, probe, transcode
  - name: torrents
    description: The player's torrents (and their media routes, aliases of /media)
  - name: downloads
    description: Every torrent the server keeps (running or not), managed like a torrent client
  - name: sessions
    description: What every device is playing (leases on torrents)
  - name: catalog
    description: Movie / show data from providers (YTS, IMDb)
  - name: play
    description: 'What can play a title: files on this server, downloads, torrents, ranked (the play pipeline)'
  - name: releases
    description: Torrent search and release lists (EZTV, TheRARBG, The Pirate Bay, YTS)
  - name: subtitles
  - name: adult
    description: 18+ section (releases and pluggable metadata providers)
  - name: profiles
  - name: library
    description: One profile's watch list, playback progress and history
  - name: media-library
    description: 'The server''s media library: what is on this server (clients), and its folders, scans and matches to TMDB (admin)'
  - name: settings
    description: User settings (per device and per profile), keys in @playpex/protocol settings.js
  - name: trailers
  - name: plugins
    description: 'What clients render of plugins (docs/plugins-plan.md §4.9): their screens and contributions, the answers of their data handlers, their assets. Setup is the dashboard''s'

paths:
  /server:
    get:
      tags: [server]
      operationId: getServer
      summary: Who this server is (no auth). Probe it after discovery and before pairing.
      security: []
      responses:
        '200':
          description: Server identity and features
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }
  /openapi.yaml:
    get:
      tags: [server]
      operationId: getOpenApi
      summary: This API's OpenAPI document (no auth)
      security: []
      responses:
        '200':
          description: The spec this server implements (packages/protocol/openapi.yaml)
          content:
            application/yaml:
              schema: { type: string }
  /docs:
    get:
      tags: [server]
      operationId: getDocs
      summary: The client author guide (redirects to /docs, served by the dashboard; no auth)
      security: []
      responses:
        '302':
          description: Location `/docs`

  # ── auth ────────────────────────────────────────────────────────────────────
  /auth/device/code:
    post:
      tags: [auth]
      operationId: requestDeviceCode
      summary: Start pairing (RFC 8628 §3.1). Show the user_code; poll /auth/device/token.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
      responses:
        '200':
          description: A pairing request, pending until the admin approves it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorization' }
        '400': { $ref: '#/components/responses/OAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/device/token:
    post:
      tags: [auth]
      operationId: requestDeviceToken
      summary: Poll for the device's token (RFC 8628 §3.4); once per `interval` seconds
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
      responses:
        '200':
          description: Approved; the token is given once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceToken' }
        '400': { $ref: '#/components/responses/OAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sign-in/username:
    post:
      tags: [auth]
      operationId: adminSignIn
      summary: The admin signs in (dashboard). Sets the session cookie. 5 attempts a minute per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        '200':
          description: Signed in (Better Auth's answer; the cookie is what matters)
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { type: object } } }
        '400': { $ref: '#/components/responses/BetterAuthError' }
        '401': { $ref: '#/components/responses/BetterAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sign-out:
    post:
      tags: [auth]
      operationId: adminSignOut
      summary: Ends the admin's session (needs the page's Origin header, like any cookie POST)
      security:
        - adminSession: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
        '403': { $ref: '#/components/responses/BetterAuthError' }
  /auth/get-session:
    get:
      tags: [auth]
      operationId: adminSession
      summary: The admin's session and user, or null (device tokens get null)
      security:
        - adminSession: []
      responses:
        '200':
          description: Session, or null when not signed in
          content:
            application/json:
              schema:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [session, user]
                    properties:
                      session: { type: object }
                      user: { type: object }

  # ── devices ─────────────────────────────────────────────────────────────────
  /devices/me:
    get:
      tags: [devices]
      operationId: getMyDevice
      summary: The calling paired device's record (404 for local clients, which aren't paired)
      responses:
        '200':
          description: This device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [devices]
      operationId: describeMyDevice
      summary: Say what this device is, right after pairing (and whenever it changes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceDescription' }
      responses:
        '200':
          description: This device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── admin (dashboard) ───────────────────────────────────────────────────────
  /admin/setup:
    get:
      tags: [admin]
      operationId: getSetup
      summary: Whether the first-run setup is still needed (the admin has no password yet)
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [needed, local]
                properties:
                  needed: { type: boolean }
                  local: { type: boolean, description: 'The request comes from the server machine (where the setup is allowed)' }
    post:
      tags: [admin]
      operationId: setup
      summary: Create the admin account. From the server machine only, and only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCredentials' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/password:
    put:
      tags: [admin]
      operationId: changeAdminPassword
      summary: Change the admin's password; every admin session is signed out, devices stay paired
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/pairing:
    get:
      tags: [admin]
      operationId: listPairingRequests
      summary: Pending pairing requests, oldest first
      security:
        - adminSession: []
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/PairingRequest' } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/pairing/{code}/approve:
    parameters:
      - $ref: '#/components/parameters/UserCode'
    post:
      tags: [admin]
      operationId: approvePairing
      summary: Approve a pairing request; the device gets its token on its next poll
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/pairing/{code}/deny:
    parameters:
      - $ref: '#/components/parameters/UserCode'
    post:
      tags: [admin]
      operationId: denyPairing
      summary: Deny a pairing request (the device gets access_denied)
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/devices:
    get:
      tags: [admin]
      operationId: listDevices
      summary: Paired devices, most recently seen first
      security:
        - adminSession: []
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: renameDevice
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 64 } } }
      responses:
        '200':
          description: The device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: revokeDevice
      summary: Revoke a device; its token stops working at once and its streams are closed
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/overview:
    get:
      tags: [admin]
      operationId: getOverview
      summary: The dashboard's Overview (server, process, machine, traffic, disks, ffmpeg, providers)
      security:
        - adminSession: []
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/restart:
    post:
      tags: [admin]
      operationId: restartServer
      summary: Restart the server (applies port, LAN sharing, download dir). Answers first, restarts 200 ms later.
      description: |
        `port` is the configured port the server will try; when another program holds it, the server starts
        in recovery mode on a free loopback port instead (see `Overview.server.recovery`).
      security:
        - adminSession: []
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                required: [ok, port, currentPort]
                properties:
                  ok: { const: true }
                  port: { type: integer }
                  currentPort: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/host:
    get:
      tags: [admin]
      operationId: getHost
      summary: The program the server runs in, and the desktop app's own settings and updater state
      description: |
        `kind` is `desktop` when Playpex Media Server's desktop app (tray icon) runs the server, `headless`
        on its own (systemd, Docker, `playpex-server`). `desktop` is null
        unless `kind` is `desktop`. Changes arrive on the events socket as `host.updated` (admin).
      security:
        - adminSession: []
      responses:
        '200':
          description: Host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '401': { $ref: '#/components/responses/AdminRequired' }
    put:
      tags: [admin]
      operationId: updateHost
      summary: Change the desktop app's settings (start at login, automatic update checks)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openAtLogin: { type: boolean }
                checkForUpdates: { type: boolean }
      responses:
        '200':
          description: Host after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/host/update/check:
    post:
      tags: [admin]
      operationId: checkForUpdate
      summary: Ask the desktop app to look for an update now (downloaded in the background when found)
      security:
        - adminSession: []
      responses:
        '200':
          description: Host, with the updater's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/host/update/install:
    post:
      tags: [admin]
      operationId: installUpdate
      summary: Restart the desktop app into the downloaded update
      description: '409 `CONFLICT` while streams are playing, unless `force` is true. 409 too when no update is downloaded.'
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: Effective settings (secrets masked), where each comes from
      security:
        - adminSession: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
        '401': { $ref: '#/components/responses/AdminRequired' }
    put:
      tags: [admin]
      operationId: updateSettings
      summary: Change settings (a partial object). Masked secrets sent back unchanged are kept.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsUpdate' }
        '400':
          description: Invalid values (`INVALID`); nothing saved
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    properties:
                      errors: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/settings/check-port:
    post:
      tags: [admin]
      operationId: checkPort
      summary: Whether the server could listen on a port right now
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [port], properties: { port: { type: integer } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortCheck' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/dlna:
    get:
      tags: [admin]
      operationId: getDlna
      summary: 'The DLNA media server: its state, the folders it may serve, the renderers that used it in the last day'
      description: 'On / off and its port are settings (`dlna.enabled`, `dlna.port`); a folder is served with `PATCH /admin/library/folders/{id}` `{dlna: true}` (never an adults-only one).'
      security:
        - adminSession: []
      responses:
        '200':
          description: DLNA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlnaStatus' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
  /admin/engines/{id}/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: installEngine
      summary: Download and install an optional torrent engine (its pinned release, SHA-256 checked)
      security:
        - adminSession: []
      responses:
        '200':
          description: The engines after the install
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Upstream' }
  /admin/engines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: uninstallEngine
      summary: Remove an installed optional engine (409 while it runs)
      security:
        - adminSession: []
      responses:
        '200':
          description: The engines after the removal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/logs:
    get:
      tags: [admin]
      operationId: getLogs
      summary: Recent log entries (ring buffer of 2 000), oldest first; live ones come as `log` events
      security:
        - adminSession: []
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] }, description: 'Minimum level' }
        - { name: area, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: 'Only entries after this time' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 'The newest N' }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, levels, file]
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
                  levels: { type: array, items: { type: string } }
                  file: { type: [string, 'null'], description: 'Current log file' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/logs/download:
    get:
      tags: [admin]
      operationId: downloadLogs
      summary: Every log file (current and rotated) as a zip
      security:
        - adminSession: []
      responses:
        '200':
          description: Zip archive
          content:
            application/zip: {}
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage:
    get:
      tags: [admin]
      operationId: getStorage
      summary: What the download directory holds (one entry per torrent), largest first
      security:
        - adminSession: []
      responses:
        '200':
          description: Storage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage/clear:
    post:
      tags: [admin]
      operationId: clearStorage
      summary: Delete every entry of the download directory that no running torrent uses (their downloads are forgotten)
      security:
        - adminSession: []
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [removed, freedBytes]
                properties:
                  removed: { type: integer }
                  freedBytes: { type: number }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage/items/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string }, description: 'Top-level entry name (URL-encoded)' }
    delete:
      tags: [admin]
      operationId: deleteStorageItem
      summary: Delete one entry of the download directory (409 while a running torrent uses it)
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/storage/check:
    post:
      tags: [admin]
      operationId: checkDirectory
      summary: Whether a directory can be the download directory (absolute, writable, free space)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [dir], properties: { dir: { type: string } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirCheck' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }

  # ── plugins (admin; docs/plugins-plan.md §6.3) ──────────────────────────────
  /admin/plugins:
    get:
      tags: [plugins]
      operationId: listAdminPlugins
      summary: Installed plugins and the developer copies that run, with the install settings
      security:
        - adminSession: []
      responses:
        '200':
          description: The plugins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugins' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/packages:
    post:
      tags: [plugins]
      operationId: stagePluginPackage
      summary: Read a package (an upload, or a URL) and show what it is before installing it
      description: |
        A `.ppx` / `.zip` (≤ 20 MB, ≤ 64 MB unpacked, ≤ 2000 files) holding `playpex-plugin.json` at its root or in
        one folder (a GitHub source zip). A URL is a direct link, or a GitHub repository / release page
        (`https://github.com/<owner>/<repo>[/releases[/latest|/tag/<tag>]]`: the release's `.ppx` / `.zip` asset, else
        its source zip; a repository without releases: its default branch). The manifest is checked like the
        loader does. Nothing runs yet: the answer is kept 15 min; install it by its `token`. `installable` false:
        unsigned (or signed by a key not in `plugins.publisherKeys`) outside developer mode, or a developer copy
        of the same id runs (`reason`).
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/zip }
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'http(s): a package, or a GitHub repository / release page' }
      responses:
        '200':
          description: What it is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackagePreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/packages/{token}/install:
    post:
      tags: [plugins]
      operationId: installPluginPackage
      summary: Install a previewed package
      description: |
        Into `<config>/plugins/<id>/`; the version it replaces is kept (`.previous/<id>/`) and comes back when the
        new one doesn't start (400). 403 when it isn't installable any more (trust settings changed), 404 for an
        unknown or expired token, 409 when a developer copy of that id runs.
      security:
        - adminSession: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The installed plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/plugins/packages/{token}:
    delete:
      tags: [plugins]
      operationId: discardPluginPackage
      summary: Forget a previewed package
      security:
        - adminSession: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/{pluginId}:
    parameters:
      - { name: pluginId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [plugins]
      operationId: updateAdminPlugin
      summary: Switch an installed plugin on or off (off stops it and hides it from clients; its data stays)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plugins]
      operationId: removeAdminPlugin
      summary: Remove an installed plugin
      description: Its files, and (unless `data=keep`) its store, secrets and settings. Library folders it recognised go back to TMDB.
      security:
        - adminSession: []
      parameters:
        - { name: data, in: query, required: false, schema: { type: string, enum: [keep, delete] } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/reload:
    post:
      tags: [plugins]
      operationId: reloadDeveloperPlugin
      summary: Load a developer copy again from its folder (after its author changed it)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── media library (admin; docs/media-server-plan.md §5) ────────────────────
  /admin/library:
    get:
      tags: [media-library]
      operationId: getMediaLibrary
      summary: The library's folders (with file counts and scan state) and the scanner's queue
      security:
        - adminSession: []
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryView' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/library/folders:
    post:
      tags: [media-library]
      operationId: addLibraryFolder
      summary: Add a folder of video files (its realpath is kept) and scan it
      description: |
        400 when it isn't a readable folder, 409 when it is in the library already, inside one of its folders or
        around one. Nothing on disk is ever written or deleted.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddLibraryFolderRequest' }
      responses:
        '201':
          description: The folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/library/folders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [media-library]
      operationId: updateLibraryFolder
      summary: Change a folder's kind, audience, DLNA flag or information provider
      description: |
        A new kind rescans it, matching unmatched files again. A new `matcher` (a plugin of `matchers` with
        `library.match`, or null for Playpex's own TMDB matching) rescans it matching every file again but
        those the admin matched; the plugin answering nothing for a file leaves it to Playpex's rules.
        400 for a matcher that isn't a running plugin with `library.match`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { $ref: '#/components/schemas/LibraryFolderKind' }
                audience: { $ref: '#/components/schemas/LibraryAudience' }
                dlna: { type: boolean }
                matcher: { type: [string, 'null'], description: 'A plugin id from `matchers`, or null (TMDB)' }
      responses:
        '200':
          description: The folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [media-library]
      operationId: removeLibraryFolder
      summary: Forget a folder and its files (nothing on disk is deleted); 409 for the built-in download folder
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/library/scan:
    post:
      tags: [media-library]
      operationId: scanLibrary
      summary: Queue a scan of one folder, or of all
      description: |
        Unchanged files (same size and modification time) are not probed or matched again. `force` also matches
        unmatched files again and probes files that couldn't be probed. Progress arrives as `library.scan` events.
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: string, description: 'Omitted: every folder' }
                force: { type: boolean }
      responses:
        '200':
          description: The scanner's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryScanStatus' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files:
    get:
      tags: [media-library]
      operationId: listLibraryFiles
      summary: The library's files, newest first, with what each is
      security:
        - adminSession: []
      parameters:
        - { name: folder, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/LibraryFileState' } }
        - { name: item, in: query, required: false, schema: { type: string }, description: 'Files of one item' }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Part of the path or of the matched title' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: object
                required: [files, total]
                properties:
                  files: { type: array, items: { $ref: '#/components/schemas/LibraryFile' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/library/files/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [media-library]
      operationId: getLibraryFile
      summary: One file
      security:
        - adminSession: []
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files/{id}/match:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [media-library]
      operationId: matchLibraryFile
      summary: Say what a file is (kept by rescans); 400 when TMDB has no such movie or episode
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryMatch' }
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [media-library]
      operationId: unmatchLibraryFile
      summary: Forget a file's match (the next scan matches it again)
      security:
        - adminSession: []
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files/{id}/ignored:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [media-library]
      operationId: ignoreLibraryFile
      summary: Ignore a file (never matched nor listed to clients) or bring it back
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ignored]
              properties:
                ignored: { type: boolean }
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/search:
    get:
      tags: [media-library]
      operationId: searchLibraryCatalog
      summary: Search TMDB for a movie or a show (to fix a match)
      security:
        - adminSession: []
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Up to 20 results, TMDB's order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [tmdbId, title, year, overview, posterPath]
                      properties:
                        tmdbId: { type: integer }
                        title: { type: string }
                        year: { type: [integer, 'null'] }
                        overview: { type: [string, 'null'] }
                        posterPath: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/fs:
    get:
      tags: [media-library]
      operationId: browseFolders
      summary: The server's folders, to pick a library folder (directories only, no hidden ones, no file names)
      security:
        - adminSession: []
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: 'Absolute; omitted: only `places`' }
      responses:
        '200':
          description: A folder's subfolders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListing' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── events ──────────────────────────────────────────────────────────────────
  /events:
    get:
      tags: [events]
      operationId: events
      summary: WebSocket of server events (an `Upgrade` to websocket)
      description: |
        Text messages, each an `Event`. Topics for everyone: `server.status` (on connect, then every 30 s),
        `torrent.stats` (every 2 s while torrents with a lease run), `session.started` / `session.updated` /
        `session.ended`, `download.added` / `download.updated` (a `Download`; state changes at once, progress
        at most every 2 s) / `download.removed`, `settings.changed`, `library.changed` (`LibraryChangedEvent`). Admin session only: `log`, `device.paired`, `device.revoked`,
        `pairing.requested`, `pairing.approved`, `pairing.denied`, `host.updated`, `library.scan` (`LibraryScanEvent`). `?topics=session,torrent.stats` keeps
        topics starting with one of those prefixes. Messages sent to the server are ignored. A web page
        from another origin is refused (403 `ORIGIN_NOT_ALLOWED`).
      parameters:
        - { name: topics, in: query, required: false, schema: { type: string }, description: 'Comma-separated topic prefixes' }
        - { name: access_token, in: query, required: false, schema: { type: string } }
      responses:
        '101': { description: Switching protocols; then `Event` messages }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── torrents ────────────────────────────────────────────────────────────────
  /torrents:
    get:
      tags: [torrents]
      operationId: listTorrents
      summary: The torrents running now (streams and downloads); GET /downloads lists every one the server keeps
      responses:
        '200':
          description: Running torrents
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Torrent' } }
    post:
      tags: [torrents]
      operationId: addTorrent
      summary: Add a torrent to play (idempotent per info hash) and hold it for the calling device. Its metadata arrives later; poll GET /torrents/{infoHash}.
      description: |
        The torrent becomes a download with intent `stream`. A torrent the server already keeps is
        reused: a paused one starts again, a completed one plays from disk. Past `streaming.maxTorrents`
        running torrents, room is made (streams nobody holds stop, downloads nobody watches go back to
        the queue), else 503 `BUSY`. `link`: a magnet, a bare info hash or an http(s) .torrent URL.
      parameters:
        - $ref: '#/components/parameters/Device'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTorrentRequest' }
      responses:
        '200':
          description: The torrent's info hash (lowercase)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoHash' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /upload:
    post:
      tags: [torrents]
      operationId: uploadTorrent
      summary: Add a torrent to play from an uploaded .torrent file (like POST /torrents)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/x-bittorrent }
      responses:
        '200':
          description: The torrent's info hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoHash' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /torrents/{infoHash}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: getTorrent
      summary: A torrent the server keeps (running or not); only `infoHash` until its metadata has arrived
      responses:
        '200':
          description: The torrent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [torrents]
      operationId: deleteTorrent
      summary: Release the calling device's lease (never deletes anything)
      description: |
        30 s after its last lease is released (another device may still be watching it, or come
        back), a `stream` download pauses (no traffic, data kept; `completed` when its files are done)
        and a `download` keeps going. Only DELETE /downloads/{infoHash} deletes data.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/keepalive:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/Device'
    post:
      tags: [torrents]
      operationId: keepTorrent
      summary: Refresh the calling device's lease (every minute while a player is open), with what it plays
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeepaliveRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/stats:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [torrents]
      operationId: getTorrentStats
      summary: Swarm statistics; safe before the metadata has arrived (zeros while the torrent is stopped)
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TorrentStats' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/start/{index}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - { name: index, in: path, required: true, description: 'File index; out of range = every file', schema: { type: integer } }
    post:
      tags: [torrents]
      operationId: startTorrentFile
      summary: Download this file (or every file)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/stop/{index}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - { name: index, in: path, required: true, description: 'File index; out of range = every file', schema: { type: integer } }
    post:
      tags: [torrents]
      operationId: stopTorrentFile
      summary: Stop downloading this file (or every file)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/deselect:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: deselectTorrent
      summary: Stop downloading every file
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/pause:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: pauseTorrent
      summary: Stop the torrent's traffic (state `paused`, kept across restarts; data kept)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/resume:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: resumeTorrent
      summary: Run a paused torrent again (its intent unchanged)
      responses:
        '503': { $ref: '#/components/responses/Busy' }
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: streamFile
      summary: Stream a file (HTTP byte ranges). Only this file of a `stream` torrent is downloaded from then on.
      description: |
        Alias of `GET /media/{ref}` (the file's `ref`) for API v1 clients. Use the `link` of a `TorrentFile`. Supports `Range` (answers 206); the end of the file is
        fetched early, where MKV keeps its index. Media elements can use the URL directly. A stopped
        torrent starts again (503 `BUSY` past the limit), unless the file is finished on disk: then it
        is read from disk.
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Busy' }
    head:
      tags: [torrents]
      operationId: headFile
      responses:
        '200': { description: 'Length and type of the file' }
        '206': { description: 'Length of the range' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/probe/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: probeFile
      summary: Codecs and duration of a file (ffprobe); alias of /media/{ref}/probe
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /torrents/{infoHash}/keyframe/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: getKeyframe
      summary: Where a transcoded stream asked to start at `t` really starts (the keyframe at or before it); alias of /media/{ref}/keyframe
      parameters:
        - { name: t, in: query, required: true, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: Time in seconds
          content:
            application/json:
              schema:
                type: object
                required: [time]
                properties:
                  time: { type: number }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/transcode/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: transcodeFile
      summary: The file with its audio re-encoded to AAC stereo (video copied), as live Matroska from `t`; alias of /media/{ref}/transcode
      description: Not byte-seekable; to seek, request again with a new `t` (from /keyframe).
      parameters:
        - { name: t, in: query, required: false, schema: { type: number, minimum: 0, default: 0 } }
        - { name: audio, in: query, required: false, description: 'Audio track index (ProbeResult.audio[].index)', schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Matroska stream
          content:
            video/x-matroska: {}
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: '`BUSY` (the server runs its maximum of transcodes; a new one from the same device and file replaces the previous) or `TRANSCODER_UNAVAILABLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── media (any file by its media ref) ───────────────────────────────────────
  /media/{ref}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: streamMedia
      summary: Stream a file by its media ref (HTTP byte ranges)
      description: |
        A torrent's file (`TorrentFile.ref`) or a file on disk. Supports `Range` (answers 206); media
        elements can use the URL directly. Takes or refreshes the calling device's lease (on the
        torrent, or on the disk file). A torrent's file: as `GET /torrents/{infoHash}/files/{path}` (a
        stopped torrent starts again, 503 `BUSY` past the limit, unless the file is finished on disk).
        A disk file of an adults-only library folder answers 403 `FORBIDDEN` to a kids profile
        (`profile`, else the profile of the device's last keepalive).
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Busy' }
    head:
      tags: [media]
      operationId: headMedia
      responses:
        '200': { description: 'Length and type of the file' }
        '206': { description: 'Length of the range' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [media]
      operationId: releaseMedia
      summary: Release the calling device's lease (leaving the player)
      description: For a torrent's file, the same as `DELETE /torrents/{infoHash}`. Never deletes anything.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/probe:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: probeMedia
      summary: Codecs and duration of a file (ffprobe)
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /media/{ref}/keyframe:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: getMediaKeyframe
      summary: Where a transcoded stream asked to start at `t` really starts (the keyframe at or before it)
      parameters:
        - { name: t, in: query, required: true, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: Time in seconds
          content:
            application/json:
              schema:
                type: object
                required: [time]
                properties:
                  time: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/transcode:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: transcodeMedia
      summary: The file with its audio re-encoded to AAC stereo (video copied), as live Matroska from `t`
      description: Not byte-seekable; to seek, request again with a new `t` (from /keyframe).
      parameters:
        - { name: t, in: query, required: false, schema: { type: number, minimum: 0, default: 0 } }
        - { name: audio, in: query, required: false, description: 'Audio track index (ProbeResult.audio[].index)', schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Matroska stream
          content:
            video/x-matroska: {}
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: '`BUSY` (the server runs its maximum of transcodes; a new one from the same device and file replaces the previous) or `TRANSCODER_UNAVAILABLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /media/{ref}/subtitles:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: listMediaSubtitles
      summary: Subtitle files next to a file on disk (`Movie.en.srt`, `Subs/…`); empty for a torrent's file
      responses:
        '200':
          description: Sidecar subtitles
          content:
            application/json:
              schema:
                type: object
                required: [subtitles]
                properties:
                  subtitles: { type: array, items: { $ref: '#/components/schemas/MediaSubtitle' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/subtitles/{index}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Profile'
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [media]
      operationId: getMediaSubtitle
      summary: One sidecar subtitle as WebVTT (for `<track>`)
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/keepalive:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    post:
      tags: [media]
      operationId: keepMedia
      summary: Refresh the calling device's lease (every minute while a player is open), with what it plays
      description: For a torrent's file, the same as `POST /torrents/{infoHash}/keepalive`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeepaliveRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── downloads ───────────────────────────────────────────────────────────────
  /downloads:
    get:
      tags: [downloads]
      operationId: listDownloads
      summary: Every torrent the server keeps, running or not (oldest first)
      responses:
        '200':
          description: Downloads
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Download' } }
    post:
      tags: [downloads]
      operationId: addDownload
      summary: Add a torrent to download to the end without a client (intent `download`)
      description: |
        Queued past `downloads.maxActive` running downloads. A torrent the server already keeps becomes a
        download (a paused one is queued again). JSON `{ link, files? }`, or a .torrent as multipart `file`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDownloadRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/x-bittorrent }
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /downloads/{infoHash}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: getDownload
      summary: A download with its files (`files` null until the metadata has arrived)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [downloads]
      operationId: updateDownload
      summary: Its rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [removeWhenWatched]
              properties:
                removeWhenWatched: { type: boolean, description: 'Delete it and its data once a player watched it to the end (90 %)' }
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [downloads]
      operationId: removeDownload
      summary: Forget a download, keeping or deleting its data (the only way data is deleted). Admin only.
      description: Its sessions end (open streams are closed).
      security:
        - adminSession: []
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, enum: [keep, delete] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/start:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: startDownload
      summary: Download it to the end without a client (intent `download`; queued when downloads.maxActive run)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/pause:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: pauseDownload
      summary: Stop its traffic (state `paused` until started again; data kept)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/files:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    put:
      tags: [downloads]
      operationId: selectDownloadFiles
      summary: Which files to download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: [array, 'null']
                  items: { type: string }
                  description: 'Paths inside the torrent; null = every file'
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── sessions ────────────────────────────────────────────────────────────────
  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: Every device's lease on a torrent, with what it plays (oldest first). Admin only.
      security:
        - adminSession: []
      responses:
        '401': { $ref: '#/components/responses/AdminRequired' }
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
  /sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [sessions]
      operationId: stopSession
      summary: Stop a session (its streams are closed and its lease released). Admin only.
      security:
        - adminSession: []
      responses:
        '401': { $ref: '#/components/responses/AdminRequired' }
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── catalog ─────────────────────────────────────────────────────────────────
  /movies:
    get:
      tags: [catalog]
      operationId: listYtsMovies
      summary: YTS `list_movies.json`, passed through (query parameters forwarded)
      responses:
        '200':
          description: YTS answer, unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YtsResponse' }
        '502': { $ref: '#/components/responses/Upstream' }
  /movies/{imdbId}:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getYtsMovie
      summary: YTS `movie_details.json` for an IMDb id, passed through (torrents, rating, runtime…)
      responses:
        '200':
          description: YTS answer, unchanged (`data.movie`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/YtsResponse' }
        '502': { $ref: '#/components/responses/Upstream' }
  /imdb/{imdbId}:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getImdbRating
      summary: IMDb rating of a title (cached 6 h)
      responses:
        '200':
          description: Rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImdbRating' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /imdb/{imdbId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getImdbEpisodes
      summary: IMDb ratings of a series, its seasons (mean of the rated episodes) and episodes
      responses:
        '200':
          description: Ratings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImdbSeries' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }

  # ── releases ────────────────────────────────────────────────────────────────
  /shows/{imdbId}/torrents:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [releases]
      operationId: findEpisodeTorrents
      summary: Torrents of one episode (EZTV + TheRARBG), best streaming candidate first; season packs as fallback
      parameters:
        - { name: title, in: query, required: true, description: 'Show title, used to match release names', schema: { type: string } }
        - { name: season, in: query, required: true, schema: { type: integer, minimum: 0 } }
        - { name: episode, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Ranked torrents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankedTorrents' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /play/sources:
    post:
      tags: [play]
      operationId: playSources
      summary: Every way to play a movie or an episode, best first
      description: |
        The play pipeline (docs/media-server-plan.md §6): library files of the title, the server's
        downloads of it, and torrents from the providers (YTS for movies, EZTV + TheRARBG for episodes),
        the same file found twice kept once. With the profile's `player.preferLocalFiles` (default on),
        files on this server that play come first, and `policy.autoplay` names the source to start
        without asking when it is the only one. A provider that fails or takes longer than its timeout
        (10 s) only drops its sources, named in `errors`. A kids profile gets no files of adults-only folders.
        Plugins (docs/plugins-plan.md §4.3) add sources (`plugin` HTTPS sources the server proxies, and
        torrents), mark torrents a service serves at once (badge `cached`, ranked before other torrents),
        reorder and hide sources (`hidden`, with the reason to show). Before playing the chosen source, ask
        `POST /play/start` with this answer's `request`; then play a source with a `ref` through
        `/media/{ref}` (no `POST /torrents`), a torrent through its `magnet`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaySourcesRequest' }
      responses:
        '200':
          description: Ranked sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaySources' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /play/start:
    post:
      tags: [play]
      operationId: playStart
      summary: What to play of the source the user chose (or the autoplay one)
      description: |
        Runs the plugins' `play.before` (one may ask a question first, or refuse) and, for a `cached`
        torrent, its service's `play.resolve` (the torrent becomes a `plugin` source with a `ref`; if the
        service fails, the torrent itself comes back with a note). `ask`: show the question with `yes` /
        `no`, and on yes ask again with `confirmed: true`. `refuse`: show the reason, play nothing. Without
        plugins the answer is always `play` with the source as listed. 404 when the sources answer is
        older than 30 min or the server restarted (ask `/play/sources` again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, source]
              properties:
                request: { type: string, description: 'The sources answer''s `request`' }
                source: { type: string, description: 'The chosen source''s `id`' }
                confirmed: { type: boolean, description: 'The user said yes to the question of an `ask` answer' }
      responses:
        '200':
          description: Play it, ask first, or refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayStart' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /play/markers:
    post:
      tags: [play]
      operationId: playMarkers
      summary: Intros, recaps, credits and chapters of what plays (plugins' `player.markers`)
      description: |
        Ask once the video's duration is known. Intro / recap: show "Skip intro" / "Skip recap" between
        `start` and `end` (seek to `end`); credits: start Up next at `start` instead of the last 40 s;
        chapters: marks on the timeline. Empty without plugins. Seconds of the file that plays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlaySourcesRequest'
                - type: object
                  required: [duration]
                  properties:
                    duration: { type: number, exclusiveMinimum: 0, description: 'Seconds' }
                    fileName: { type: string, description: 'The file''s name, when known' }
                    size: { type: integer, minimum: 0, description: 'The file''s size in bytes, when known' }
      responses:
        '200':
          description: The markers, by start
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items:
                      type: object
                      required: [plugin, kind, start]
                      properties:
                        plugin: { type: string }
                        kind: { type: string, enum: [intro, recap, credits, chapter] }
                        start: { type: number }
                        end: { type: number, description: 'Credits may leave it out (until the end)' }
                        label: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/meta:
    post:
      tags: [plugins]
      operationId: pluginTitleMeta
      summary: What plugins add to a title page (`metadata.title`)
      description: |
        Up to 3 items per plugin: `text`, `chip`, `score` (0–10, `votes`, `label`), `seal`
        (`$defs/metaItem` of `@playpex/protocol/plugin-api.schema.json`). Plugins that fail or take longer
        than 3 s are left out. A kids profile gets nothing from `audience: adults` plugins.
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: object
                  description: '`$defs/titleRef`: kind movie / show / episode (tmdbId = the show''s) / video'
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [movie, show, episode, video] }
                    tmdbId: { type: integer, minimum: 1 }
                    imdbId: { type: string }
                    season: { type: integer, minimum: 0 }
                    episode: { type: integer, minimum: 1 }
                    title: { type: string }
                    year: { type: integer }
                profile: { type: string }
      responses:
        '200':
          description: Each plugin's items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginTitleMeta' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: The plugins a client renders for a profile
      description: |
        Enabled plugins and what they add (docs/plugins-plan.md §4.9, author guide docs/plugins/): menu sections,
        screens (core templates), slot contributions, accent. Never permissions, settings, links or states: setup
        is the dashboard's. A kids profile (`?profile=`) gets no `audience: adults` plugin. Refetch on the
        `plugin.changed` event. Asset paths in a plugin (`assets/…`) are served at `<api>{assets}<path under assets/>`.
      parameters:
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The plugins
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items: { $ref: '#/components/schemas/ClientPlugin' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/{pluginId}/data/{name}:
    post:
      tags: [plugins]
      operationId: callPluginData
      summary: A plugin's data handler, for a screen, a slot, a card or an action
      description: |
        Runs the plugin's handler in its sandbox with the caller's context (profile, device, locale). The answer's
        `data` is the model its template or slot expects (`$defs/templates`, `$defs/slots` of
        `@playpex/protocol/plugin-api.schema.json`); `effects` are what the client performs (open, play,
        toast, refresh, confirm, download), already checked against the plugin's permissions. A handler that
        fails, takes longer than 10 s or answers out of schema → 502 `PLUGIN_FAILED`. Rate limited per device
        and plugin (429 `TOO_MANY_ATTEMPTS`).
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' } }
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,39}$' } }
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                args: { type: object, description: 'The handler''s arguments (a screen''s params, a call''s args, a page number)' }
                profile: { type: string, description: 'The profile (or ?profile=)' }
      responses:
        '200':
          description: The handler's answer
          content:
            application/json:
              schema:
                type: object
                required: [data, effects]
                properties:
                  data: { description: 'The model of the template / slot / call' }
                  effects:
                    type: array
                    items: { type: object, required: [type], properties: { type: { type: string, enum: [open, play, toast, refresh, confirm, download] } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /plugins/{pluginId}/assets/{path}:
    get:
      tags: [plugins]
      operationId: getPluginAsset
      summary: A file of a plugin's assets/ (an icon, an image)
      description: SVG, PNG, JPEG or WebP only, `X-Content-Type-Options nosniff`, a CSP that runs no script.
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, description: 'Path under assets/ (may contain /)', schema: { type: string } }
      responses:
        '200':
          description: The file
          content:
            image/svg+xml: {}
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404': { $ref: '#/components/responses/NotFound' }
  /library/home:
    get:
      tags: [media-library]
      operationId: getServerLibrary
      summary: What is on this server, for a profile
      description: |
        The server's media library as a client browses it (docs/media-server-plan.md §5.5): the movies and
        shows matched to TMDB (one entry per title, by title), the titles added last (20, newest first),
        and the folders that hold other videos (files not matched to a title, and every file of an `other`
        folder). Files missing or ignored never show. A kids profile (`?profile=`) never sees files of
        adults-only folders. Refetch on the `library.changed` event.
      parameters:
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibrary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/titles/{mediaType}/{tmdbId}:
    get:
      tags: [media-library]
      operationId: getServerLibraryTitle
      summary: Whether a movie, or which episodes of a show, are on this server
      description: |
        For "On this server" marks: the title's files that play (state ok), and for a show (`tv`) its
        episodes on this server. `fileCount` 0 = not on this server. Same audience rule as `/library/home`.
      parameters:
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The title's files on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibraryTitle' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/folders/{folderId}:
    get:
      tags: [media-library]
      operationId: browseServerLibraryFolder
      summary: One level of a folder's other videos
      description: |
        The subfolders that hold other videos (with how many, at any depth) and the videos right in it,
        in natural name order. `path` is a folder inside it from a previous answer (`folders[].path`,
        `parent`); none = the folder itself. Play a video by its `ref` (`/media/{ref}`). 404 for an
        unknown folder, one a kids profile doesn't see, or a path with no videos.
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: false, schema: { type: string }, description: 'A folder inside it, / separated' }
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The folder's level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /releases/providers:
    get:
      tags: [releases]
      operationId: listReleaseProviders
      parameters:
        - $ref: '#/components/parameters/ReleaseKind'
      responses:
        '200':
          description: Sources for this kind, the default first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReleaseProvider' } }
        '400': { $ref: '#/components/responses/Invalid' }
  /releases/browse:
    get:
      tags: [releases]
      operationId: browseReleases
      summary: One source's releases, most seeded first
      parameters:
        - $ref: '#/components/parameters/ReleaseKind'
        - { name: provider, in: query, description: 'Source id (unknown → the kind''s default)', schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Playable'
        - $ref: '#/components/parameters/Page'
        - { name: imdb, in: query, description: 'Optional IMDb id (EZTV lists that show)', schema: { type: string } }
      responses:
        '200':
          description: A page of releases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }

  # ── subtitles ───────────────────────────────────────────────────────────────
  /subtitles/providers:
    get:
      tags: [subtitles]
      operationId: listSubtitleProviders
      responses:
        '200':
          description: Providers, in the player's tab order (first enabled = default)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubtitleProvider' } }
  /subtitles/search:
    get:
      tags: [subtitles]
      operationId: searchSubtitles
      parameters:
        - { name: provider, in: query, description: 'Provider id (default first enabled)', schema: { type: string } }
        - { name: imdb_id, in: query, required: true, schema: { type: string, pattern: '^tt\d+$' } }
        - { name: season, in: query, schema: { type: integer } }
        - { name: episode, in: query, schema: { type: integer } }
        - { name: languages, in: query, description: 'Comma-separated ISO 639-1 codes, e.g. en,ar', schema: { type: string } }
      responses:
        '200':
          description: Subtitles found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubtitleSearch' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /subtitles/file:
    get:
      tags: [subtitles]
      operationId: getSubtitleFile
      summary: A subtitle as WebVTT (for `<track>`)
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: ref, in: query, required: true, description: '`ref` from the search; validated by the provider', schema: { type: string } }
        - { name: lang, in: query, schema: { type: string } }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt: { schema: { type: string } }
        '502': { $ref: '#/components/responses/Upstream' }

  # ── 18+ ─────────────────────────────────────────────────────────────────────
  /adult/torrents:
    get:
      tags: [adult]
      operationId: findAdultTorrents
      summary: Torrents of one adult film, matched by title (+ year), best first
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Ranked torrents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RankedTorrents' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /adult/providers:
    get:
      tags: [adult]
      operationId: listAdultReleaseProviders
      summary: Same as /releases/providers?kind=adult
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReleaseProvider' } }
  /adult/browse:
    get:
      tags: [adult]
      operationId: browseAdultReleases
      summary: Same as /releases/browse?kind=adult
      parameters:
        - { name: provider, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Playable'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of releases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
        '502': { $ref: '#/components/responses/Upstream' }
  /adult/meta/providers:
    get:
      tags: [adult]
      operationId: listAdultMetaProviders
      responses:
        '200':
          description: Metadata providers (`enabled` false without their API key)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdultMetaProvider' } }
  /adult/meta/{provider}/home:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
    get:
      tags: [adult]
      operationId: getAdultHome
      responses:
        '200':
          description: Rows of the home page
