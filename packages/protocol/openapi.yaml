            application/json:
              schema: { $ref: '#/components/schemas/AdultHome' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /adult/meta/{provider}/rows/{key}:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [adult]
      operationId: getAdultRow
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdultPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /adult/meta/{provider}/discover:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
    get:
      tags: [adult]
      operationId: discoverAdult
      parameters:
        - { name: studio, in: query, schema: { type: string } }
        - { name: period, in: query, description: 'An id from the provider''s `periods`', schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [popular, newest, rated], default: popular } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdultPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /adult/meta/{provider}/search:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
    get:
      tags: [adult]
      operationId: searchAdult
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
        - { name: period, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdultPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /adult/meta/{provider}/studios:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
    get:
      tags: [adult]
      operationId: listAdultStudios
      responses:
        '200':
          description: Studios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Studio' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /adult/meta/{provider}/titles/{id}:
    parameters:
      - $ref: '#/components/parameters/AdultMetaProvider'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [adult]
      operationId: getAdultTitle
      responses:
        '200':
          description: A title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdultTitle' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }

  # ── profiles ────────────────────────────────────────────────────────────────
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      responses:
        '200':
          description: Profiles of this server ("Who's watching?")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileList' }
    post:
      tags: [profiles]
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCreate' }
      responses:
        '201':
          description: The new profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Error' }
  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [profiles]
      operationId: getProfile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [profiles]
      operationId: updateProfile
      summary: Update; `preferences.adult` (deprecated) is written to the profile's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete the profile and all its data
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/unlock:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [profiles]
      operationId: unlockProfile
      summary: Pick the profile (PIN if it has one); records it as last used
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
  /profiles/{profileId}/pin:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [profiles]
      operationId: setProfilePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: [string, 'null'], pattern: '^\d{4,6}$', description: 'null removes the lock' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profiles/{profileId}/settings:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      tags: [settings]
      operationId: updateProfileSettings
      summary: Change some of the profile's settings
      description: |
        Profile-scoped keys only (`subtitles.provider`, `player.autoplayNext`, `player.preferLocalFiles`, `adult.*`, or
        `client.<clientId>.<name>`). `null` resets a key to its default. All or nothing: one bad key
        refuses the whole patch (`INVALID`, with `errors`). `adult.*` keys are refused for kids
        profiles (`FORBIDDEN`). Publishes `settings.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: The profile's effective settings, after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── settings ────────────────────────────────────────────────────────────────
  /settings:
    get:
      tags: [settings]
      operationId: getUserSettings
      summary: The calling device's settings, and a profile's
      description: |
        Every registered key with its effective value (stored, else the default), so clients
        never hard-code defaults. Plus the `client.*` values stored for this device / profile.
        The device is the one the token names (paired clients), else `X-Playpex-Device` /
        `?device=` (clients on the server machine); without one → `DEVICE_REQUIRED`.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
        - name: profile
          in: query
          required: false
          description: A profile id; without it `profile` is null
          schema: { type: string }
        - name: definitions
          in: query
          required: false
          description: '`1` adds the registry (`definitions`), for clients that don''t bundle @playpex/protocol'
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings/device:
    patch:
      tags: [settings]
      operationId: updateDeviceSettings
      summary: Change some of the calling device's settings
      description: |
        Device-scoped keys only (`display.*`, `player.volume`, `subtitles.size`, or
        `client.<clientId>.<name>`). `null` resets a key. All or nothing. Publishes `settings.changed`.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: The device's effective settings, after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [settings]
      operationId: resetDeviceSettings
      summary: Reset every setting of the calling device (its rows are deleted)
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
      responses:
        '200':
          description: The device's effective settings (the defaults)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }

  # ── library ─────────────────────────────────────────────────────────────────
  /profiles/{profileId}/library:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: getLibrary
      summary: Everything the Watch list page shows, in one call
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watchlist:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: listWatchlist
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Watch list, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WatchlistItem' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watchlist/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: inWatchlist
      responses:
        '200':
          description: Whether the title is on the watch list
          content:
            application/json:
              schema:
                type: object
                required: [inWatchlist]
                properties:
                  inWatchlist: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [library]
      operationId: addToWatchlist
      summary: Add (idempotent)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Artwork' }
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItem' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [library]
      operationId: removeFromWatchlist
      responses:
        '200': { $ref: '#/components/responses/Removed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/progress/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: getProgress
      summary: Where to resume (null under 5 % or once finished)
      parameters:
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/Episode'
      responses:
        '200':
          description: Resume point
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressState' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [library]
      operationId: saveProgress
      summary: Save the playback position (finished at ≥ 90 %; the first finish is added to the history)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProgressRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveProgressResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/progress/{mediaType}/{tmdbId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: getEpisodesProgress
      summary: Progress of every episode of a show (or of the movie)
      responses:
        '200':
          description: Per-episode progress
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EpisodeProgress' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watched/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    put:
      tags: [library]
      operationId: markWatched
      summary: Mark as watched without playing (logged in the history)
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Artwork'
                - type: object
                  properties:
                    season: { type: integer }
                    episode: { type: integer }
                    durationS: { type: number }
      responses:
        '200':
          description: The progress row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressRow' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [library]
      operationId: markUnwatched
      summary: Forget the progress (the history is kept)
      parameters:
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/Episode'
      responses:
        '200': { $ref: '#/components/responses/Removed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/history:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: getHistory
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Finished views, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── trailers ────────────────────────────────────────────────────────────────
  /youtube/{videoId}:
    parameters:
      - { name: videoId, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$' } }
    get:
      tags: [trailers]
      operationId: streamTrailer
      summary: A YouTube trailer, proxied with byte ranges. Currently stops after ~1 MB (YouTube attestation).
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [video, audio] } }
        - { name: quality, in: query, description: 'YouTube itag', schema: { type: string } }
        - { name: Range, in: header, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: 'Range not satisfiable' }

components:
  parameters:
    InfoHash:
      name: infoHash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{40}$' }
    Device:
      name: device
      in: query
      required: false
      description: |
        The calling device, for local clients (no token) and media URLs that can't carry the
        `X-Playpex-Device` header. Letters, digits and `._:-`, up to 64. Without either, the server
        uses the client's address. Ignored for paired devices (their token names them).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    DeviceHeader:
      name: X-Playpex-Device
      in: header
      required: false
      description: The calling device's own id (`deviceId` of the client), for clients that aren't paired
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    UserCode:
      name: code
      in: path
      required: true
      description: The code the device shows; case and dashes don't matter
      schema: { type: string }
    ClientHeader:
      name: X-Playpex-Client
      in: header
      required: false
      description: '`<name>/<version>; api=<n>` — shown to the admin next to the pairing request'
      schema: { type: string }
    MediaRef:
      name: ref
      in: path
      required: true
      description: A media ref from the server (`TorrentFile.ref`, …); opaque (`@playpex/protocol` MEDIA_REF_PATTERN)
      schema: { type: string, pattern: '^(t_[0-9a-f]{40}_[0-9a-f]{16}|f_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|r_[0-9a-f]{32})$' }
    Profile:
      name: profile
      in: query
      required: false
      description: The profile watching (files of adults-only library folders are refused to kids profiles)
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: The file's `path`, URL-encoded (it may contain slashes)
      schema: { type: string }
    ImdbId:
      name: imdbId
      in: path
      required: true
      schema: { type: string, pattern: '^tt\d+$' }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    MediaType:
      name: mediaType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MediaType' }
    TmdbId:
      name: tmdbId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Season:
      name: season
      in: query
      description: Episodes only
      schema: { type: integer, minimum: 0 }
    Episode:
      name: episode
      in: query
      description: Episodes only
      schema: { type: integer, minimum: 0 }
    ReleaseKind:
      name: kind
      in: query
      required: true
      schema: { type: string, enum: [movie, tv, adult] }
    Quality:
      name: quality
      in: query
      description: SD also keeps 480p
      schema: { type: string, enum: ['2160p', '1080p', '720p', SD] }
    Playable:
      name: playable
      in: query
      description: '1 / true: only releases the TV app can play (video and audio)'
      schema: { type: string, enum: ['1', 'true', '0', 'false'] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    AdultMetaProvider:
      name: provider
      in: path
      required: true
      description: A provider id, or `default`
      schema: { type: string }

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: A paired device's token (from POST /auth/device/token)
    accessTokenParam:
      type: apiKey
      in: query
      name: access_token
      description: The same token, for media elements that can't set headers
    adminSession:
      type: apiKey
      in: cookie
      name: playpex.session_token
      description: The admin's session (POST /auth/sign-in/username), HttpOnly

  responses:
    AdminRequired:
      description: Not signed in as the admin (`ADMIN_REQUIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthError:
      description: RFC 8628 / RFC 6749 error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
    BetterAuthError:
      description: Better Auth's error shape
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              code: { type: string }
    RateLimited:
      description: Too many requests from this address; wait (see `X-Retry-After`)
      content:
        application/json:
          schema: { type: object }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Bad parameters or body (`INVALID`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Upstream:
      description: A provider failed (`UPSTREAM`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Busy:
      description: A server limit is reached (`BUSY`); try again later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { const: true }
    Removed:
      description: Whether something was removed
      content:
        application/json:
          schema:
            type: object
            required: [removed]
            properties:
              removed: { type: boolean }
    Media:
      description: Media bytes (the whole file, or the requested range with 206)
      content:
        video/*: {}
        audio/*: {}
        application/octet-stream: {}

  schemas:
    ClientPlugin:
      type: object
      description: A plugin as clients render it (its manifest's `contributes`, docs/plugins/manifest.md)
      required: [id, name, version, audience, icon, assets, sections, screens, slots, chrome]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        audience: { type: string, enum: [everyone, adults] }
        icon: { type: [string, 'null'], description: 'assets/… of the package' }
        assets: { type: string, description: 'Where its assets are, under the API prefix: /plugins/<id>/assets/' }
        sections:
          type: array
          items:
            type: object
            required: [screen, menu]
            properties:
              screen: { type: string }
              menu: { type: object, required: [label, icon], properties: { label: { type: string }, icon: { type: string }, order: { type: integer } } }
        screens:
          type: array
          items:
            type: object
            required: [name, template]
            properties:
              name: { type: string }
              template: { type: string, enum: [catalog, title, releases, list] }
              data: { type: string }
              title: { type: string }
              params: { type: array, items: { type: string } }
        slots:
          type: array
          items:
            type: object
            required: [slot, data]
            properties:
              slot: { type: string }
              data: { type: string }
              order: { type: integer }
        chrome:
          oneOf:
            - { type: 'null' }
            - { type: object, properties: { accent: { type: string, enum: [adult] } } }
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: 'Message for people (may change)' }
        errors: { type: array, items: { type: string }, description: 'Some INVALID answers (settings): one message per bad field' }
        code:
          type: string
          description: Stable code (HTTP status in parentheses)
          enum:
            - INVALID                  # 400
            - DEVICE_REQUIRED          # 400
            - PAIRING_REQUIRED         # 401
            - ADMIN_REQUIRED           # 401
            - FORBIDDEN                # 403
            - HOST_NOT_ALLOWED         # 403
            - ORIGIN_NOT_ALLOWED       # 403
            - NOT_FOUND                # 404
            - CONFLICT                 # 409
            - CLIENT_TOO_OLD           # 426
            - SERVER_TOO_OLD           # 426
            - TOO_MANY_ATTEMPTS        # 429
            - INTERNAL                 # 500
            - NOT_SUPPORTED            # 501
            - BUSY                     # 503
            - UPSTREAM                 # 502
            - PROBE_FAILED             # 502
            - PLUGIN_FAILED            # 502
            - PROVIDER_NOT_CONFIGURED  # 503
            - TRANSCODER_UNAVAILABLE   # 503

    ServerInfo:
      type: object
      required: [id, name, version, apiVersion, minApiVersion, auth, features]
      properties:
        id: { type: string, description: 'Stable server id (UUID); identify servers by it, not by address' }
        name: { type: string }
        version: { type: string, description: 'Server software version' }
        apiVersion: { type: integer }
        minApiVersion: { type: integer }
        auth: { type: string, enum: [none, pairing] }
        features:
          type: object
          required: [transcode, subtitles, adult]
          properties:
            transcode: { type: boolean, description: 'ffmpeg available (audio transcoding)' }
            subtitles: { type: array, items: { type: string }, description: 'Enabled subtitle provider ids' }
            adult: { type: boolean }

    # ── torrents
    AddTorrentRequest:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 'Magnet link, .torrent URL, or a bare 32/40-character info hash' }
    InfoHash:
      type: object
      required: [infoHash]
      properties:
        infoHash: { type: string }
    Torrent:
      type: object
      required: [infoHash]
      description: Everything but `infoHash` is missing until the metadata has arrived
      properties:
        infoHash: { type: string }
        name: { type: string }
        length: { type: number, description: 'Bytes' }
        state: { $ref: '#/components/schemas/DownloadState' }
        interested: { type: boolean, description: 'Running and still downloading' }
        ready: { type: boolean, description: 'Files can be streamed now (running and checked, or completed on disk)' }
        files: { type: array, items: { $ref: '#/components/schemas/TorrentFile' } }
        progress: { type: array, items: { type: number }, description: 'Piece runs in percent, alternating downloaded / missing, starting with downloaded' }
    KeepaliveRequest:
      type: object
      description: What the player plays, all optional (shown in the server's Activity)
      properties:
        positionS: { type: number, description: 'Playback position, seconds' }
        durationS: { type: number }
        paused: { type: boolean }
        title: { type: string, maxLength: 300, description: 'For people, e.g. "Breaking Bad · S02E05"' }
        profileId: { type: string }
        file: { type: string, description: 'Path of the file in the torrent' }
        media:
          type: object
          description: 'Which title it is (TMDB): kept with the download, so the server knows what it holds'
          required: [mediaType, tmdbId]
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 0 }
    Session:
      type: object
      required: [id, deviceId, deviceName, paired, client, address, infoHash, ref, torrentName, file, method, streaming, since, lastActivity, playback, torrent]
      properties:
        id: { type: string }
        deviceId: { type: string, description: 'A paired device''s id, else what a local client named itself (or addr:<ip>)' }
        deviceName: { type: [string, 'null'], description: 'Paired devices: the name it gave itself / the admin gave it' }
        paired: { type: boolean }
        client: { type: [string, 'null'], description: '<name>/<version> from X-Playpex-Client' }
        address: { type: string }
        infoHash: { type: [string, 'null'], description: 'The torrent held; null for a file on disk' }
        ref: { type: [string, 'null'], description: 'Media ref of the file last streamed (null before the first stream)' }
        torrentName: { type: [string, 'null'], description: 'null until the metadata has arrived, and for a file on disk' }
        file: { type: [string, 'null'], description: 'Path of the file being played (in the torrent, or in its library folder)' }
        method: { type: [string, 'null'], enum: [direct, audio-transcode, null] }
        streaming: { type: boolean, description: 'A media response is open right now' }
        since: { type: string, format: date-time }
        lastActivity: { type: string, format: date-time }
        playback:
          type: [object, 'null']
          description: The player's last keepalive
          properties:
            positionS: { type: number }
            durationS: { type: number }
            paused: { type: boolean }
            title: { type: string }
            profileId: { type: string }
            file: { type: string }
            updatedAt: { type: string, format: date-time }
        torrent:
          type: [object, 'null']
          description: The swarm; null once the torrent has stopped
          required: [peers, downloadSpeed, uploadSpeed, downloaded, length]
          properties:
            peers: { type: integer }
            downloadSpeed: { type: number, description: 'Bytes per second' }
            uploadSpeed: { type: number }
            downloaded: { type: number, description: 'Bytes' }
            length: { type: [number, 'null'], description: 'Bytes; null until the metadata has arrived' }
    DownloadState:
      type: string
      enum: [queued, downloading, seeding, checking, paused, completed, error]
      description: |
        Running: `downloading`, `seeding`, `checking` (the engine verifies data already on disk). Stopped
        (no traffic, data kept): `queued` (waits for room), `paused`, `completed` (every selected file is
        done), `error`.
    Download:
      type: object
      description: A torrent the server keeps (docs/media-server-plan.md §4)
      required: [infoHash, name, state, intent, error, sizeBytes, doneBytes, progress, uploadedBytes, ratio,
        downloadSpeed, uploadSpeed, peers, seeds, eta, checking, fileCount, selectedFiles, title, addedBy,
        profileId, removeWhenWatched, addedAt, completedAt, lastActiveAt]
      properties:
        infoHash: { type: string }
        name: { type: [string, 'null'], description: 'null until the metadata has arrived' }
        state: { $ref: '#/components/schemas/DownloadState' }
        intent:
          type: string
          enum: [stream, download]
          description: '`stream`: a client plays it, it pauses when the last one leaves; `download`: it runs to the end without clients'
        error: { type: [string, 'null'] }
        sizeBytes: { type: [number, 'null'], description: 'Of the selected files; null until the metadata has arrived' }
        doneBytes: { type: number }
        progress: { type: [number, 'null'], description: '0 to 1' }
        uploadedBytes: { type: number, description: 'Since it was added' }
        ratio: { type: [number, 'null'], description: 'uploadedBytes / sizeBytes' }
        downloadSpeed: { type: number, description: 'Bytes per second' }
        uploadSpeed: { type: number }
        peers: { type: integer }
        seeds: { type: integer }
        eta: { type: [integer, 'null'], description: 'Seconds' }
        checking: { type: [number, 'null'], description: 'Progress (0 to 1) of the check of the data on disk' }
        fileCount: { type: [integer, 'null'] }
        selectedFiles: { type: [array, 'null'], items: { type: string }, description: 'null = every file' }
        title:
          type: [object, 'null']
          description: 'The title a player said it is (keepalive `media`)'
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer }
            season: { type: integer }
            episode: { type: integer }
            title: { type: string }
        addedBy: { type: [string, 'null'], description: 'A device id, or `admin`' }
        profileId: { type: [string, 'null'] }
        removeWhenWatched: { type: boolean }
        addedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time }
    DownloadDetail:
      allOf:
        - $ref: '#/components/schemas/Download'
        - type: object
          required: [files]
          properties:
            files:
              type: [array, 'null']
              items:
                type: object
                required: [name, path, ref, size, offset, selected, doneBytes]
                properties:
                  name: { type: string }
                  path: { type: string }
                  ref: { type: string, description: 'Media ref (GET /media/{ref})' }
                  size: { type: number }
                  offset: { type: number }
                  selected: { type: boolean }
                  doneBytes: { type: [number, 'null'], description: 'Verified bytes of this file; null when unknown (stopped and not completed)' }
    AddDownloadRequest:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 'Magnet link, a bare 40-character info hash, or an http(s) .torrent URL' }
        files: { type: array, items: { type: string }, description: 'Paths to download (default: every file)' }
        media:
          type: object
          description: 'Which title it is (TMDB): the download''s `title`, so a client finds it again from that title''s page'
          required: [mediaType, tmdbId]
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 0 }
        title: { type: string, maxLength: 300, description: 'For people, e.g. "Breaking Bad · S02E05"' }
        profileId: { type: string }
    # ── media library
    LibraryFolderKind: { type: string, enum: [movies, shows, mixed, other], description: 'What to match its files as (other: never matched)' }
    LibraryAudience: { type: string, enum: [everyone, adults], description: 'adults: never for kids profiles or over DLNA' }
    LibraryFileState: { type: string, enum: [ok, missing, unmatched, ignored] }
    AddLibraryFolderRequest:
      type: object
      required: [path, kind]
      properties:
        path: { type: string, description: 'Absolute path on the server' }
        kind: { $ref: '#/components/schemas/LibraryFolderKind' }
        audience: { $ref: '#/components/schemas/LibraryAudience' }
        dlna: { type: boolean }
    LibraryFolder:
      type: object
      required: [id, path, kind, audience, dlna, matcher, builtin, status, addedAt, lastScanAt, counts, scanning, queued]
      properties:
        id: { type: string }
        path: { type: string }
        kind: { $ref: '#/components/schemas/LibraryFolderKind' }
        audience: { $ref: '#/components/schemas/LibraryAudience' }
        dlna: { type: boolean }
        matcher: { type: [string, 'null'], description: 'Its information provider: a plugin''s id (`library.match`), null = Playpex (TMDB)' }
        builtin: { type: boolean, description: 'The download directory: added by the server, not removable' }
        status: { type: string, description: 'ok · scanning · missing (unreachable: its files are kept 7 days) · error: <message>' }
        addedAt: { type: string, format: date-time }
        lastScanAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [ok, missing, unmatched, ignored]
          properties:
            ok: { type: integer }
            missing: { type: integer }
            unmatched: { type: integer }
            ignored: { type: integer }
        scanning: { type: boolean }
        queued: { type: boolean }
    LibraryScanStatus:
      type: object
      required: [current, queued]
      properties:
        current:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LibraryScanProgress'
        queued: { type: array, items: { type: string }, description: 'Folder ids waiting' }
    LibraryScanProgress:
      type: object
      required: [folderId]
      properties:
        folderId: { type: string }
        total: { type: integer, description: 'New or changed files to probe and match' }
        processed: { type: integer }
        added: { type: integer }
        changed: { type: integer }
        missing: { type: integer }
        matched: { type: integer }
        unmatched: { type: integer }
    LibraryScanEvent:
      description: '`data` of `library.scan` (admin): a scan started, progressed (every 25 files), ended'
      allOf:
        - $ref: '#/components/schemas/LibraryScanProgress'
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [scanning, done, missing, error] }
            error: { type: string }
    LibraryView:
      type: object
      required: [folders, scan, matchers]
      properties:
        folders: { type: array, items: { $ref: '#/components/schemas/LibraryFolder' } }
        scan: { $ref: '#/components/schemas/LibraryScanStatus' }
        matchers:
          type: array
          description: Running plugins that recognise library files (`library.match`), for a folder's `matcher`
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    LibraryItem:
      type: object
      description: What a file is. For an episode, `tmdbId` is the episode's, `imdbId` the show's.
      required: [id, kind, tmdbId, showTmdbId, season, episode, imdbId, title, episodeTitle, year, artwork]
      properties:
        id: { type: string }
        kind: { type: string, enum: [movie, episode] }
        tmdbId: { type: [integer, 'null'] }
        showTmdbId: { type: [integer, 'null'] }
        season: { type: [integer, 'null'] }
        episode: { type: [integer, 'null'] }
        imdbId: { type: [string, 'null'] }
        title: { type: [string, 'null'], description: "The movie's, or the show's" }
        episodeTitle: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        artwork:
          type: [object, 'null']
          properties:
            posterPath: { type: [string, 'null'] }
            backdropPath: { type: [string, 'null'] }
            stillPath: { type: [string, 'null'] }
    LibraryFile:
      type: object
      required: [id, ref, folderId, relPath, size, mtime, state, matchedBy, addedAt, missingSince, parse, probe, subtitles, item]
      properties:
        id: { type: string }
        ref: { type: string, description: 'Media ref: GET /media/{ref} streams it' }
        folderId: { type: string }
        relPath: { type: string, description: 'Inside its folder, / separated' }
        size: { type: number }
        mtime: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/LibraryFileState' }
        matchedBy: { type: [string, 'null'], enum: [auto, nfo, admin, null], description: 'admin: kept by rescans' }
        addedAt: { type: string, format: date-time }
        missingSince: { type: [string, 'null'], format: date-time }
        parse:
          type: [object, 'null']
          description: What the path says (kind, title, year, season, episode, episodeEnd, resolution, source, codec, tmdbId, imdbId)
        probe:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProbeResult'
        subtitles:
          type: array
          items:
            type: object
            required: [index, language, forced, sdh, relPath]
            properties:
              index: { type: integer }
              language: { type: [string, 'null'] }
              forced: { type: boolean }
              sdh: { type: boolean }
              relPath: { type: string }
        item:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LibraryItem'
    LibraryMatch:
      oneOf:
        - type: object
          required: [kind, tmdbId]
          properties:
            kind: { const: movie }
            tmdbId: { type: integer, minimum: 1 }
        - type: object
          required: [kind, showTmdbId, season, episode]
          properties:
            kind: { const: episode }
            showTmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 1 }
    FolderListing:
      type: object
      required: [path, parent, dirs, places]
      properties:
        path: { type: [string, 'null'], description: 'The folder listed (its realpath); null without ?path=' }
        parent: { type: [string, 'null'] }
        dirs:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
        places:
          type: array
          description: Where to start (home, the download directory, the file system's roots or drives)
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
    MediaSubtitle:
      type: object
      required: [index, language, languageName, forced, sdh]
      properties:
        index: { type: integer, description: 'GET /media/{ref}/subtitles/{index}' }
        language: { type: [string, 'null'], description: 'ISO 639-1 when known' }
        languageName: { type: [string, 'null'] }
        forced: { type: boolean }
        sdh: { type: boolean }
    DownloadRemovedEvent:
      type: object
      description: '`data` of `download.removed`'
      properties:
        infoHash: { type: string }
    TorrentFile:
      type: object
      required: [name, path, ref, link, length, offset, selected]
      properties:
        name: { type: string }
        path: { type: string }
        ref: { type: string, description: 'Media ref: GET /media/{ref} streams it (also probe / keyframe / transcode)' }
        link: { type: string, description: 'Stream URL path (append to the server origin): /api/v1/torrents/{infoHash}/files/{path} (an alias of /media/{ref})' }
        length: { type: number }
        offset: { type: number }
        selected: { type: boolean }
    TorrentStats:
      type: object
      required: [metadata, peers, traffic, speed, eta]
      properties:
        metadata: { type: boolean }
        peers:
          type: object
          properties:
            total: { type: integer }
            unchocked: { type: integer }
        traffic:
          type: object
          properties:
            down: { type: number, description: 'Bytes' }
            up: { type: number }
        speed:
          type: object
          properties:
            down: { type: number, description: 'Bytes per second' }
            up: { type: number }
        eta: { type: [integer, 'null'], description: 'Seconds; null until known' }
        queue: { type: number }
        paused: { type: boolean, description: 'Not running (paused, queued, completed or error)' }
        state: { $ref: '#/components/schemas/DownloadState' }
    ProbeResult:
      type: object
      required: [duration, video, audio, transcode]
      properties:
        duration: { type: [number, 'null'], description: 'Seconds' }
        video: { type: [string, 'null'], description: 'Codec, e.g. h264, hevc' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        hdr: { type: boolean, description: 'PQ (HDR10, Dolby Vision) or HLG transfer' }
        audio:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              codec: { type: string }
              language: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
              channels: { type: integer }
              default: { type: boolean }
        subtitles:
          type: array
          description: Subtitle streams inside the file (not played by the server yet)
          items:
            type: object
            properties:
              index: { type: integer }
              codec: { type: [string, 'null'] }
              language: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
              forced: { type: boolean }
        transcode: { type: boolean, description: 'The default audio track needs /transcode to be heard in Chromium' }

    # ── catalog
    YtsResponse:
      type: object
      description: YTS API answer, passed through unchanged (https://yts.mx/api). A catalog API of our own replaces it later (plan §12 G).
      properties:
        status: { type: string }
        data: { type: object }
    ImdbRating:
      type: object
      required: [id, rating, votes]
      properties:
        id: { type: string }
        rating: { type: [number, 'null'] }
        votes: { type: [integer, 'null'] }
    ImdbSeries:
      allOf:
        - $ref: '#/components/schemas/ImdbRating'
        - type: object
          required: [seasons]
          properties:
            seasons:
              type: array
              items:
                type: object
                required: [season, rating, rated, episodes]
                properties:
                  season: { type: integer }
                  rating: { type: [number, 'null'], description: 'Mean of the rated episodes' }
                  rated: { type: integer, description: 'Number of rated episodes' }
                  episodes:
                    type: array
                    items:
                      type: object
                      required: [episode, id, rating, votes]
                      properties:
                        episode: { type: integer }
                        id: { type: string }
                        rating: { type: [number, 'null'] }
                        votes: { type: [integer, 'null'] }

    # ── releases
    ReleaseDescription:
      type: object
      description: What the release name says about playability in the TV app (Chromium)
      properties:
        quality: { type: [string, 'null'], description: '2160p, 1080p, 720p, 480p, SD or null' }
        codec: { type: [string, 'null'] }
        audio: { type: [string, 'null'], description: '"unsupported" for Dolby / DTS' }
        playable: { type: boolean, description: 'Video codec playable (no HEVC / 10-bit / XviD / 4K)' }
    RankedTorrent:
      allOf:
        - $ref: '#/components/schemas/ReleaseDescription'
        - type: object
          required: [provider, name, hash, magnet, seeds]
          properties:
            provider: { type: string }
            name: { type: string }
            hash: { type: string, description: 'Info hash, lowercase' }
            magnet: { type: string, description: 'Magnet with the server''s tracker list' }
            seeds: { type: integer }
            size: { type: [number, 'null'], description: 'Bytes' }
            pack: { type: boolean, description: 'Season pack (the episode is one of its files)' }
    RankedTorrents:
      type: object
      required: [torrents]
      properties:
        torrents: { type: array, items: { $ref: '#/components/schemas/RankedTorrent' } }
        providerErrors: { type: integer, description: 'How many providers failed' }
    PlaySourcesRequest:
      type: object
      required: [kind, tmdbId, title]
      properties:
        kind: { type: string, enum: [movie, episode] }
        tmdbId: { type: integer, minimum: 1, description: 'The movie''s, or the episode''s show''s' }
        imdbId: { type: [string, 'null'], pattern: '^tt\\d{5,10}$', description: 'The movie''s / the show''s (torrent providers search by it)' }
        title: { type: string, maxLength: 200, description: 'The movie''s / the show''s, to match release names' }
        year: { type: [integer, 'null'] }
        season: { type: integer, minimum: 0, description: 'Episodes' }
        episode: { type: integer, minimum: 1, description: 'Episodes' }
        profileId: { type: [string, 'null'], description: 'Who is watching: their settings and kids rules apply' }
    PlaySource:
      type: object
      required: [id, type, provider, label, playable, badges, notes]
      properties:
        id: { type: string, description: 'Stable for a source: the media ref of a file, a download''s file or a plugin''s source, `torrent:<infoHash>` of a torrent' }
        type: { type: string, enum: [file, download, torrent, plugin], description: 'file: in the library; download: a file of the server''s download of this title; torrent: from a provider or a plugin; plugin: a plugin''s HTTPS source, proxied by the server (play its `ref`)' }
        provider: { type: string, description: 'library, downloads, yts, eztv, therarbg… (unknown values may come with plugins)' }
        handler: { type: string, description: 'The collect handler that found it' }
        label: { type: string, description: 'A file''s or a release''s name' }
        ref: { type: string, description: 'file, download, plugin: the media ref to play (GET /media/{ref})' }
        plugin: { type: string, description: 'The plugin that found it' }
        resolver:
          type: object
          description: 'torrent: a plugin''s service has it and plays it at once (POST /play/start resolves it)'
          required: [plugin, label]
          properties:
            plugin: { type: string }
            label: { type: string, description: 'Real-Debrid…: "Cached on <label>"' }
        infoHash: { type: string, description: 'download, torrent' }
        path: { type: string, description: 'download: the file''s path in its torrent' }
        magnet: { type: string, description: 'torrent: with the server''s tracker list' }
        size: { type: [number, 'null'], description: 'Bytes' }
        quality: { type: [string, 'null'], description: '2160p, 1080p, 720p, 480p, SD' }
        codec: { type: [string, 'null'] }
        audio: { type: [string, 'null'] }
        duration: { type: [number, 'null'], description: 'file: seconds (ffprobe)' }
        seeds: { type: [integer, 'null'] }
        peers: { type: [integer, 'null'] }
        progress: { type: number, minimum: 0, maximum: 1, description: 'download: how much of the file is there (1 = on disk)' }
        state: { $ref: '#/components/schemas/DownloadState' }
        playable:
          type: string
          enum: [yes, audio-converted, maybe, no]
          description: 'yes; audio-converted (Dolby / DTS sound re-encoded by the server''s ffmpeg); maybe (HEVC / 10-bit / 4K: depends on the hardware); no'
        badges:
          type: array
          items: { type: string }
          description: 'Flags clients may show: best (the first), on-server, downloading, pack, hdr, plugin (from a plugin), cached (a service plays it at once). Ignore those you don''t know'
        notes: { type: array, items: { type: string }, description: 'Why it may not play, in words (English)' }
    PlaySources:
      type: object
      required: [request, sources, hidden, policy, errors]
      properties:
        request: { type: string, description: 'For POST /play/start (kept 30 min)' }
        sources: { type: array, items: { $ref: '#/components/schemas/PlaySource' } }
        hidden:
          type: array
          description: 'Sources a plugin''s `play.rank` hid: show "Hidden by <by>: <reason>" (they can''t be played from here)'
          items:
            type: object
            required: [id, label, plugin, by, reason]
            properties:
              id: { type: string }
              label: { type: string }
              plugin: { type: string }
              by: { type: string, description: 'The plugin''s name' }
              reason: { type: string }
        policy:
          type: object
          required: [autoplay]
          properties:
            autoplay: { type: [string, 'null'], description: 'The id of the source to play without asking, else null: show the sources' }
        errors:
          type: array
          items:
            type: object
            required: [handler, message]
            properties:
              handler: { type: string }
              message: { type: string }
    PluginTitleMeta:
      type: object
      required: [meta]
      properties:
        meta:
          type: array
          items:
            type: object
            required: [plugin, name, items]
            properties:
              plugin: { type: string }
              name: { type: string }
              items:
                type: array
                description: '`$defs/metaItem`: text (`text`, `small`), chip (`text`, `icon`: a core icon name or a path under its assets/), score (`value` 0–10, `votes`, `label`), seal (`text`)'
                items: { type: object, required: [kind], properties: { kind: { type: string, enum: [text, chip, score, seal] } } }
    PluginPermission:
      type: object
      required: [key, text, personal]
      properties:
        key: { type: string }
        text: { type: string, description: 'In words, for the admin' }
        personal: { type: boolean, description: 'Granted per profile (later steps)' }
    AdminPlugin:
      type: object
      required: [id, name, version, origin, enabled, state, error, permissions, hooks, previous]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: [string, 'null'] }
        publisher: { type: ['object', 'null'], properties: { name: { type: string }, url: { type: string } } }
        audience: { type: [string, 'null'], enum: [everyone, adults, null] }
        icon: { type: [string, 'null'], description: 'Under the API prefix: /plugins/<id>/assets/…' }
        origin: { type: string, enum: [upload, url, dev], description: 'dev: a developer copy from <config>/plugins-dev/' }
        source: { type: [string, 'null'], description: 'The uploaded file''s name, the URL, or the developer folder' }
        signer: { type: [string, 'null'], description: 'The trusted publisher key''s fingerprint; null = unsigned' }
        enabled: { type: boolean }
        state: { type: string, enum: [loading, enabled, failed, disabled, removed] }
        error: { type: [string, 'null'] }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
        hooks: { type: array, items: { type: string } }
        registered: { type: ['object', 'null'] }
        stats: { type: ['object', 'null'] }
        previous: { type: boolean, description: 'The version it replaced is kept' }
        installedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    AdminPlugins:
      type: object
      required: [plugins, developerMode, publisherKeys, devDir, pluginsDir]
      properties:
        plugins: { type: array, items: { $ref: '#/components/schemas/AdminPlugin' } }
        developerMode: { type: boolean, description: 'Setting plugins.developerMode: unsigned packages install; plugins-dev folders load (restart)' }
        publisherKeys:
          type: array
          description: Setting plugins.publisherKeys
          items: { type: object, required: [key, fingerprint], properties: { key: { type: string }, fingerprint: { type: string } } }
        devDir: { type: string }
        pluginsDir: { type: string }
    PluginPackagePreview:
      type: object
      required: [token, id, name, version, permissions, hooks, origin, source, size, fileCount, change, current, signer, installable, reason, expiresAt]
      properties:
        token: { type: string }
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: [string, 'null'] }
        publisher: { type: ['object', 'null'], properties: { name: { type: string }, url: { type: string } } }
        audience: { type: string }
        icon: { type: [string, 'null'], description: 'A data: URL of its icon (≤ 256 KB)' }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
        hooks: { type: array, items: { type: string } }
        origin: { type: string, enum: [upload, url] }
        source: { type: string }
        resolved: { type: [string, 'null'], description: 'What a URL led to (a GitHub release asset, a source zip)' }
        root: { type: [string, 'null'], description: 'The folder of the zip the plugin was found in' }
        size: { type: integer }
        fileCount: { type: integer }
        changelog: { type: [string, 'null'] }
        current: { type: [string, 'null'], description: 'The installed version, if any' }
        change: { type: string, enum: [install, update, downgrade, reinstall] }
        conflict: { type: [string, 'null'] }
        signer:
          oneOf:
            - type: 'null'
            - type: object
              required: [key, fingerprint, trusted]
              properties:
                key: { type: string }
                fingerprint: { type: string }
                trusted: { type: boolean }
        installable: { type: boolean }
        reason: { type: [string, 'null'], description: 'Why it can''t be installed now' }
        expiresAt: { type: string, format: date-time }
    PlayStart:
      oneOf:
        - type: object
          required: [action, source]
          properties:
            action: { const: play }
            source: { $ref: '#/components/schemas/PlaySource' }
        - type: object
          required: [action, question, yes, no, by]
          properties:
            action: { const: ask }
            question: { type: string }
            yes: { type: string }
            no: { type: string }
            by: { type: string, description: 'The plugin''s name' }
        - type: object
          required: [action, reason, by]
          properties:
            action: { const: refuse }
            reason: { type: string }
            by: { type: string }
    ServerLibraryEntry:
      type: object
      description: A movie or a show on this server, from its files' matches
      required: [mediaType, tmdbId, imdbId, title, year, posterPath, backdropPath, addedAt, fileCount, quality, episodeCount, seasonCount, latest]
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        imdbId: { type: [string, 'null'] }
        title: { type: string }
        year: { type: [integer, 'null'] }
        posterPath: { type: [string, 'null'], description: 'TMDB image path' }
        backdropPath: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time, description: 'When its newest file was found' }
        fileCount: { type: integer }
        quality: { type: [string, 'null'], description: 'The best of its files: 2160p, 1080p, 720p, 480p' }
        episodeCount: { type: [integer, 'null'], description: 'Shows: episodes on this server (null for a movie)' }
        seasonCount: { type: [integer, 'null'] }
        latest:
          description: 'Shows: the episode added last (null for a movie)'
          oneOf:
            - type: 'null'
            - type: object
              required: [season, episode, episodeTitle]
              properties:
                season: { type: integer }
                episode: { type: integer }
                episodeTitle: { type: [string, 'null'] }
    ServerLibrary:
      type: object
      required: [movies, shows, recent, other]
      properties:
        movies: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'By title' }
        shows: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'By title' }
        recent: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'Movies and shows, newest file first (20)' }
        other:
          type: object
          required: [count, folders]
          properties:
            count: { type: integer, description: 'Other videos in all' }
            folders:
              type: array
              description: 'Library folders holding other videos, by name'
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: string }
                  name: { type: string, description: 'The folder''s own name (the download folder: Downloads)' }
                  count: { type: integer }
    ServerLibraryTitle:
      type: object
      required: [mediaType, tmdbId, fileCount, episodes]
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        fileCount: { type: integer, description: '0: not on this server' }
        episodes:
          type: array
          description: 'A show''s episodes on this server, in order ([] for a movie)'
          items:
            type: object
            required: [season, episode, fileCount]
            properties:
              season: { type: integer }
              episode: { type: integer }
              fileCount: { type: integer }
    ServerLibraryFolder:
      type: object
      required: [folder, path, parent, folders, videos]
      properties:
        folder:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        path: { type: string, description: 'This level inside the folder ('''' = the folder itself)' }
        parent: { type: [string, 'null'], description: 'The level above (null at the folder itself)' }
        folders:
          type: array
          items:
            type: object
            required: [name, path, count]
            properties:
              name: { type: string }
              path: { type: string }
              count: { type: integer, description: 'Videos inside, at any depth' }
        videos:
          type: array
          items:
            type: object
            required: [id, ref, name, size, duration, quality, addedAt]
            properties:
              id: { type: string }
              ref: { type: string, description: 'Its media ref (/media/{ref})' }
              name: { type: string, description: 'The file name' }
              size: { type: integer }
              duration: { type: [number, 'null'], description: 'Seconds (ffprobe), null when unknown' }
              quality: { type: [string, 'null'] }
              addedAt: { type: string, format: date-time }
    LibraryChangedEvent:
      description: '`data` of `library.changed` (everyone): what clients see of the library changed (a scan found, changed or lost files, the admin fixed a match or edited a folder); refetch'
      type: object
      required: [folderId]
      properties:
        folderId: { type: [string, 'null'] }
    ReleaseProvider:
      type: object
      required: [id, name, paged, default]
      properties:
        id: { type: string }
        name: { type: string }
        paged: { type: boolean, description: 'Has more than one page' }
        default: { type: boolean }
    ReleaseTorrent:
      allOf:
        - $ref: '#/components/schemas/ReleaseDescription'
        - type: object
          required: [provider, name, hash, magnet, seeds]
          properties:
            provider: { type: string }
            name: { type: string }
            hash: { type: string }
            magnet: { type: string }
            seeds: { type: integer }
            peers: { type: [integer, 'null'] }
            size: { type: [number, 'null'] }
            added: { type: number, description: 'Unix seconds, 0 if unknown' }
            title: { type: [string, 'null'] }
            year: { type: [integer, 'null'] }
            studio: { type: [string, 'null'], description: '18+ only' }
            scenes: { type: boolean, description: '18+ split scenes' }
            season: { type: [integer, 'null'], description: 'kind tv' }
            episode: { type: [integer, 'null'], description: 'kind tv' }
            pack: { type: boolean, description: 'kind tv' }
    ReleasePage:
      type: object
      required: [provider, page, hasMore, torrents]
      properties:
        provider: { type: string }
        page: { type: integer, description: 'Last page read; ask for page + 1 next' }
        hasMore: { type: boolean }
        torrents: { type: array, items: { $ref: '#/components/schemas/ReleaseTorrent' } }

    # ── subtitles
    SubtitleProvider:
      type: object
      required: [id, name, description, supports, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        supports:
          type: object
          properties:
            movie: { type: boolean }
            episode: { type: boolean }
        enabled: { type: boolean, description: 'false when its API key is missing' }
    SubtitleSearch:
      type: object
      required: [provider, subtitles]
      properties:
        provider: { type: string }
        subtitles:
          type: array
          items:
            type: object
            required: [provider, ref, language]
            properties:
              provider: { type: string }
              ref: { type: string, description: 'Pass to /subtitles/file' }
              language: { type: string, description: 'ISO 639-1' }
              languageName: { type: string }
              name: { type: [string, 'null'] }
        unsupported: { type: boolean, description: 'The provider doesn''t cover this kind of title' }

    # ── 18+ metadata
    AdultMetaProvider:
      type: object
      required: [id, name, enabled, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        default: { type: boolean }
        periods:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
        sorts: { type: array, items: { type: string, enum: [popular, newest, rated] } }
    AdultHome:
      type: object
      required: [provider, rows]
      properties:
        provider: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [key, title]
            properties:
              key: { type: string }
              title: { type: string }
    Studio:
      type: object
      required: [id, name]
      properties:
        id: { type: [string, integer] }
        name: { type: string }
    AdultItem:
      type: object
      required: [id, title]
      properties:
        id: { type: [string, integer] }
        title: { type: string }
        year: { type: [integer, 'null'] }
        releaseDate: { type: [string, 'null'] }
        overview: { type: [string, 'null'] }
        poster: { type: [string, 'null'], description: 'Full image URL' }
        backdrop: { type: [string, 'null'] }
        rating: { type: [number, 'null'], description: '0–10' }
        studio:
          oneOf:
            - $ref: '#/components/schemas/Studio'
            - type: 'null'
    AdultTitle:
      allOf:
        - $ref: '#/components/schemas/AdultItem'
        - type: object
          properties:
            runtime: { type: [integer, 'null'], description: 'Minutes' }
            performers:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  photo: { type: [string, 'null'] }
            director: { type: [string, 'null'] }
            studios: { type: array, items: { $ref: '#/components/schemas/Studio' } }
    AdultPage:
      type: object
      required: [items, page, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdultItem' } }
        page: { type: integer }
        totalPages: { type: integer }

    # ── profiles
    Profile:
      type: object
      required: [id, name, avatar, isKid, hasPin, preferences, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: [string, 'null'] }
        isKid: { type: boolean }
        hasPin: { type: boolean }
        preferences:
          type: object
          deprecated: true
          description: 'Read-only view of the profile''s `adult.*` settings, `{ adult: { layout, metadataProvider } }`, kept for one release; use GET /settings?profile='
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    ProfileList:
      type: object
      required: [profiles, lastUsedId, maxProfiles]
      properties:
        profiles: { type: array, items: { $ref: '#/components/schemas/Profile' } }
        lastUsedId: { type: [string, 'null'] }
        maxProfiles: { type: integer }
    ProfileCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 'Unique, case-insensitive' }
        avatar: { type: string }
        isKid: { type: boolean }
        pin: { type: string, pattern: '^\d{4,6}$' }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        avatar: { type: string }
        isKid: { type: boolean }
        preferences:
          type: object
          deprecated: true
          description: 'Only `{ adult: { layout?, metadataProvider? } }` is read (written to the profile''s settings); use PATCH /profiles/{profileId}/settings'

    UserSettingValues:
      type: object
      description: '`{ key: value }`: every registered key of the scope with its effective value, plus stored `client.*` keys'
      additionalProperties: true
    UserSettingsPatch:
      type: object
      description: '`{ key: value | null }`; null resets the key to its default'
      additionalProperties: true
    SettingDefinition:
      type: object
      required: [scope, type, default]
      properties:
        scope: { type: string, enum: [device, profile] }
        type: { type: string, enum: [number, string, boolean] }
        default: {}
        enum: { type: array, items: { type: [number, string] } }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        nullable: { type: boolean }
        adult: { type: boolean, description: 'Refused for kids profiles' }
    UserSettings:
      type: object
      required: [device, profile]
      properties:
        device: { $ref: '#/components/schemas/UserSettingValues' }
        profile:
          oneOf:
            - $ref: '#/components/schemas/UserSettingValues'
            - type: 'null'
        definitions:
          type: object
          description: 'Only with `?definitions=1`: the registry, `{ key: SettingDefinition }`'
          additionalProperties: { $ref: '#/components/schemas/SettingDefinition' }

    # ── library
    MediaType:
      type: string
      enum: [movie, tv]
    Artwork:
      type: object
      description: Sent with writes so lists render without TMDB; a write without them keeps what is stored
      properties:
        title: { type: string }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        genreIds: { type: array, items: { type: integer } }
    WatchlistItem:
      type: object
      required: [profileId, mediaType, tmdbId, title, posterPath, backdropPath, addedAt]
      properties:
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
    SaveProgressRequest:
      allOf:
        - $ref: '#/components/schemas/Artwork'
        - type: object
          required: [positionS, durationS]
          properties:
            season: { type: integer, description: 'Episodes only' }
            episode: { type: integer, description: 'Episodes only' }
            positionS: { type: number }
            durationS: { type: number }
            infoHash: { type: [string, 'null'], description: 'The release being played, to resume the same one' }
            filePath: { type: [string, 'null'] }
            fileId: { type: [string, 'null'], description: 'Or a library file being played (the id of its `f_` media ref)' }
    ProgressRow:
      type: object
      required: [profileId, mediaType, tmdbId, season, episode, positionS, durationS, finished, updatedAt]
      properties:
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer, description: '0 for movies' }
        episode: { type: integer, description: '0 for movies' }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        positionS: { type: number }
        durationS: { type: number }
        infoHash: { type: [string, 'null'] }
        filePath: { type: [string, 'null'] }
        fileId: { type: [string, 'null'] }
        finished: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SaveProgressResult:
      type: object
      required: [progress, finished, justFinished]
      properties:
        progress: { $ref: '#/components/schemas/ProgressRow' }
        finished: { type: boolean }
        justFinished: { type: boolean, description: 'This save finished it for the first time' }
    ProgressState:
      type: object
      required: [resume, finished]
      properties:
        resume:
          oneOf:
            - type: 'null'
            - type: object
              required: [positionS, durationS]
              properties:
                positionS: { type: number }
                durationS: { type: number }
                infoHash: { type: [string, 'null'] }
                filePath: { type: [string, 'null'] }
                fileId: { type: [string, 'null'], description: 'A library file: resume with the source `f_<fileId>`' }
                updatedAt: { type: string, format: date-time }
        finished: { type: boolean }
    EpisodeProgress:
      type: object
      required: [season, episode, ratio, finished]
      properties:
        season: { type: integer }
        episode: { type: integer }
        positionS: { type: number }
        durationS: { type: number }
        ratio: { type: number, minimum: 0, maximum: 1 }
        finished: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ContinueWatchingItem:
      type: object
      required: [kind, mediaType, tmdbId, season, episode]
      properties:
        kind: { type: string, enum: [resume, next], description: "next: the episode after a finished one (the client resolves which)" }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        positionS: { type: number }
        durationS: { type: number }
        ratio: { type: number }
        infoHash: { type: [string, 'null'] }
        filePath: { type: [string, 'null'] }
        fileId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    WatchedTitle:
      type: object
      required: [mediaType, tmdbId, season, episode, watchedAt]
      properties:
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        season: { type: integer, description: 'Latest watched episode' }
        episode: { type: integer }
        episodesWatched: { type: integer }
        watchedAt: { type: string, format: date-time }
    Library:
      type: object
      required: [continueWatching, watchlist, watched]
      properties:
        continueWatching: { type: array, items: { $ref: '#/components/schemas/ContinueWatchingItem' } }
        watchlist: { type: array, items: { $ref: '#/components/schemas/WatchlistItem' } }
        watched: { type: array, items: { $ref: '#/components/schemas/WatchedTitle' } }
    HistoryEntry:
      type: object
      required: [id, profileId, mediaType, tmdbId, season, episode, watchedAt]
      properties:
        id: { type: integer }
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        genreIds: { type: array, items: { type: integer } }
        watchedRatio: { type: number }
        watchedAt: { type: string, format: date-time }

    # ── auth, devices, events
    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$', description: 'Names the app, e.g. playpex-tv' }
        scope: { type: string }
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string, description: 'Secret: only for polling' }
        user_code: { type: string, description: 'Show it; 8 characters, no ambiguous ones (e.g. ZETWHGRK; show as ZETW-HGRK)' }
        verification_uri: { type: string, format: uri, description: 'The dashboard page where the admin types the code' }
        verification_uri_complete: { type: string, format: uri, description: 'Same with the code filled in (for a QR code)' }
        expires_in: { type: integer, description: 'Seconds (the server''s security.pairingRequestMinutes)' }
        interval: { type: integer, description: 'Seconds between polls; faster gets slow_down' }
    DeviceTokenRequest:
      type: object
      required: [grant_type, device_code, client_id]
      properties:
        grant_type: { const: 'urn:ietf:params:oauth:grant-type:device_code' }
        device_code: { type: string }
        client_id: { type: string }
    DeviceToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'Keep it secret (OS keychain / encrypted storage)' }
        token_type: { const: Bearer }
        expires_in: { type: integer, description: 'Seconds; renewed while the device is used' }
        scope: { type: string }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, expired_token, access_denied, invalid_grant, invalid_client, invalid_request, invalid_scope, unauthorized_client, server_error]
        error_description: { type: string }
    DeviceDescription:
      type: object
      description: All optional; null clears a field
      properties:
        name: { type: [string, 'null'], maxLength: 64, description: 'e.g. "Living room TV"' }
        platform: { type: [string, 'null'], maxLength: 32, description: 'e.g. windows, linux, android-tv' }
        deviceId: { type: [string, 'null'], maxLength: 64, description: 'The client''s own id for this install' }
        capabilities:
          type: [object, 'null']
          description: What the device decodes (plan §6.5), at most 4 KB of JSON
          properties:
            containers: { type: array, items: { type: string } }
            video: { type: array, items: { type: string } }
            audio: { type: array, items: { type: string } }
            maxHeight: { type: integer }
    Device:
      type: object
      required: [id, clientId, name, platform, client, clientDeviceId, capabilities, address, lastProfileId, createdAt, lastSeenAt, expiresAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        client: { type: [string, 'null'], description: '<name>/<version> from X-Playpex-Client when it paired' }
        clientDeviceId: { type: [string, 'null'] }
        capabilities: { type: [object, 'null'] }
        address: { type: [string, 'null'], description: 'Last address it was seen from' }
        lastProfileId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'When its token expires unless used' }
        online: { type: boolean, description: 'Admin list only: an open events socket or a request in the last 90 s' }
    PairingRequest:
      type: object
      required: [userCode, clientId, client, address, requestedAt, expiresAt]
      properties:
        userCode: { type: string }
        clientId: { type: [string, 'null'] }
        client: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
    AdminCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_.]{3,30}$' }
        password: { type: string, minLength: 8, maxLength: 128 }
    Overview:
      type: object
      required: [server, process, system, network, activity, downloads, disks, ffmpeg, providers]
      properties:
        server:
          type: object
          required: [id, name, version, startedAt, uptimeS, port, host, urls, lanSharing, recovery, discovery]
          properties:
            id: { type: [string, 'null'] }
            name: { type: string }
            version: { type: string }
            startedAt: { type: [string, 'null'], format: date-time }
            uptimeS: { type: integer }
            port: { type: [integer, 'null'] }
            host: { type: [string, 'null'] }
            urls: { type: array, items: { type: string } }
            lanSharing: { type: boolean }
            discovery: { $ref: '#/components/schemas/DiscoveryStatus' }
            recovery:
              type: [object, 'null']
              description: 'Set in recovery mode: the configured port was taken, only the dashboard is served (loopback)'
              properties:
                reason: { type: string, enum: [PORT_IN_USE, PORT_NOT_ALLOWED] }
                port: { type: integer }
                message: { type: string }
                owner:
                  type: [object, 'null']
                  properties:
                    pid: { type: integer }
                    name: { type: [string, 'null'] }
        process:
          type: object
          required: [pid, node, electron, cpuPercent, rssBytes, heapUsedBytes]
          properties:
            pid: { type: integer }
            node: { type: string }
            electron: { type: [string, 'null'] }
            cpuPercent: { type: number, description: 'Of one core, over the last 5 s' }
            rssBytes: { type: number }
            heapUsedBytes: { type: number }
        system:
          type: object
          required: [hostname, platform, arch, release, cpus, loadAverage, totalMemBytes, freeMemBytes]
          properties:
            hostname: { type: string }
            platform: { type: string }
            arch: { type: string }
            release: { type: string }
            cpus: { type: integer }
            loadAverage: { type: array, items: { type: number } }
            totalMemBytes: { type: number }
            freeMemBytes: { type: number }
        network:
          type: object
          description: BitTorrent traffic of every running torrent
          required: [downloadSpeed, uploadSpeed, peers, downloaded, uploaded]
          properties:
            downloadSpeed: { type: number, description: 'Bytes per second' }
            uploadSpeed: { type: number }
            peers: { type: integer }
            downloaded: { type: number, description: 'Bytes since the server started' }
            uploaded: { type: number }
        activity:
          type: object
          required: [torrents, sessions, eventClients]
          properties:
            torrents: { type: integer, description: 'Running torrents' }
            sessions: { type: integer }
            eventClients: { type: integer }
        downloads:
          type: object
          description: The torrent engine and the downloads
          required: [engine, requestedEngine, engineError, total, active, queued, paused]
          properties:
            engine: { type: [string, 'null'], description: 'The engine running (null: none could start)' }
            requestedEngine: { type: [string, 'null'], description: 'downloads.engine; differs from engine when it failed and the default runs' }
            engineError: { type: [string, 'null'] }
            total: { type: integer }
            active: { type: integer }
            queued: { type: integer }
            paused: { type: boolean, description: 'downloads.paused ("Pause all downloads")' }
        disks:
          type: array
          items:
            type: object
            required: [id, path, free, total]
            properties:
              id: { type: string, enum: [downloads, config, logs] }
              path: { type: string }
              free: { type: [number, 'null'] }
              total: { type: [number, 'null'] }
        ffmpeg:
          type: object
          required: [available, version, source, path]
          properties:
            available: { type: boolean }
            version: { type: [string, 'null'] }
            source: { type: [string, 'null'], description: 'env, settings, bundled or path' }
            path: { type: [string, 'null'] }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderHealth' }
    DiscoveryStatus:
      type: object
      description: 'How clients on the LAN find this server (mDNS and the UDP responder)'
      required: [enabled, reason, mdns, udp]
      properties:
        enabled: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [lanSharing, disabled, recovery, null]
          description: 'Why discovery is off: LAN sharing off, `network.discovery` off, or recovery mode'
        mdns:
          type: object
          required: [state, name, error]
          properties:
            state: { type: string, enum: ['off', starting, advertising, error] }
            name: { type: [string, 'null'], description: 'The mDNS instance name advertised' }
            error: { type: [string, 'null'] }
        udp:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
    ProviderHealth:
      type: object
      required: [id, name, ok, lastSuccess, lastFailure, lastError, failures]
      properties:
        id: { type: string }
        name: { type: string }
        ok: { type: [boolean, 'null'], description: 'null = not used since the server started' }
        lastSuccess: { type: [string, 'null'], format: date-time }
        lastFailure: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'], description: 'HTTP status or network error code' }
        failures: { type: integer, description: 'Failures in a row' }
    Settings:
      type: object
      description: Every server setting (plan §5.3); secrets (`providers.*ApiKey`) masked as `••••<last 4>`
      required: [general, network, security, storage, streaming, downloads, dlna, plugins, providers, transcoding]
      properties:
        general:
          type: object
          required: [serverName, port, logLevel]
          properties:
            serverName: { type: string }
            port: { type: integer, minimum: 1024, maximum: 65535 }
            logLevel: { type: string, enum: [debug, info, warn, error] }
        network:
          type: object
          required: [lanSharing, discovery, allowedHosts, corsOrigins]
          properties:
            lanSharing: { type: boolean }
            discovery: { type: boolean, description: 'Advertise on the LAN (mDNS + UDP 28471); only with lanSharing' }
            allowedHosts: { type: array, items: { type: string } }
            corsOrigins: { type: array, items: { type: string } }
        security:
          type: object
          required: [requirePairingOnLoopback, pairingRequestMinutes]
          properties:
            requirePairingOnLoopback: { type: boolean }
            pairingRequestMinutes: { type: integer, minimum: 1 }
        storage:
          type: object
          required: [downloadDir]
          properties:
            downloadDir: { type: string, description: 'Empty = the default (<cache>/torrent_data)' }
        streaming:
          type: object
          required: [maxTorrents, maxTranscodes, idleTimeoutMinutes]
          properties:
            maxTorrents: { type: integer, minimum: 1, description: 'Running torrents at once (streams and downloads)' }
            maxTranscodes: { type: integer, minimum: 1 }
            idleTimeoutMinutes: { type: integer, minimum: 1 }
        downloads:
          type: object
          required: [engine, peerPort, portForwarding, maxActive, seedRatio, seedMinutes, uploadSlots, paused]
          properties:
            engine: { type: string, description: 'The torrent engine (`SettingsView.engines`: torrent-stream, rqbit); applied after a restart' }
            peerPort: { type: integer, minimum: 1024, maximum: 65535, description: 'BitTorrent port (taken → a free one); applied after a restart' }
            portForwarding: { type: boolean, description: 'Ask the router to forward peerPort (UPnP), where the engine can (rqbit); applied after a restart' }
            maxActive: { type: integer, minimum: 1, description: 'Downloads (not streams) running at once; the others are queued' }
            seedRatio: { type: number, minimum: 0, description: 'A finished download seeds until this ratio (0 = no ratio limit)' }
            seedMinutes: { type: integer, minimum: 0, description: '…or this long (0 = no time limit); both 0 = no seeding' }
            uploadSlots: { type: integer, minimum: 0, description: 'Peers uploaded to at once per torrent; 0 = never upload' }
            paused: { type: boolean, description: '"Pause all downloads": downloads wait, streams still play' }
        dlna:
          type: object
          required: [enabled, port]
          properties:
            enabled: { type: boolean, description: 'The DLNA / UPnP AV media server (no authentication: read-only, DLNA folders of audience everyone, LAN addresses only); only with network.lanSharing. Applied at once' }
            port: { type: integer, minimum: 1024, maximum: 65535, description: 'Its own HTTP listener (default 28472); applied at once' }
        plugins:
          type: object
          required: [developerMode, publisherKeys]
          properties:
            developerMode: { type: boolean, description: 'Unsigned plugin packages install (at once), and the folders of <config>/plugins-dev/ load (after a restart)' }
            publisherKeys: { type: array, items: { type: string }, description: 'ed25519:<base64> public keys whose signed packages install without developer mode' }
        providers:
          type: object
          required: [tmdbApiKey, openSubtitlesApiKey, wyzieApiKey, thePornDbApiKey]
          properties:
            tmdbApiKey: { type: string }
            openSubtitlesApiKey: { type: string }
            wyzieApiKey: { type: string }
            thePornDbApiKey: { type: string }
        transcoding:
          type: object
          required: [ffmpegPath, ffprobePath]
          properties:
            ffmpegPath: { type: string }
            ffprobePath: { type: string }
    DlnaStatus:
      type: object
      required: [enabled, reason, name, udn, port, http, ssdp, urls, renderers, folders, shown]
      properties:
        enabled: { type: boolean, description: 'It should run (`dlna.enabled`, LAN sharing, not recovery mode); `http` / `ssdp` tell whether it does' }
        reason: { type: [string, 'null'], enum: [disabled, lanSharing, recovery, null], description: 'Why it is off' }
        name: { type: string, description: 'What TVs show (the server name)' }
        udn: { type: [string, 'null'], description: 'Its UPnP device id, stable (derived from the server id)' }
        port: { type: integer, description: 'dlna.port' }
        http:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
        ssdp:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
            interfaces: { type: integer, description: 'Networks it announces on' }
        urls: { type: array, items: { type: string }, description: 'The device description on each LAN address' }
        renderers:
          type: array
          description: 'Devices that browsed or played in the last day, latest first'
          items:
            type: object
            required: [address, name, userAgent, lastSeenAt, lastPlayedAt]
            properties:
              address: { type: string }
              name: { type: [string, 'null'], description: 'Its own name, when it announced itself as a renderer' }
              userAgent: { type: [string, 'null'] }
              lastSeenAt: { type: string, format: date-time }
              lastPlayedAt: { type: [string, 'null'], format: date-time }
        folders:
          type: array
          items:
            type: object
            required: [id, path, name, kind, audience, builtin, dlna, files]
            properties:
              id: { type: string }
              path: { type: string }
              name: { type: string }
              kind: { $ref: '#/components/schemas/LibraryFolderKind' }
              audience: { $ref: '#/components/schemas/LibraryAudience' }
              builtin: { type: boolean }
              dlna: { type: boolean, description: 'Included in DLNA (served only when its audience is everyone)' }
              files: { type: integer, description: 'Its files in state ok / unmatched' }
        shown:
          type: object
          description: 'What DLNA devices browse now'
          required: [files, movies, shows]
          properties:
            files: { type: integer }
            movies: { type: integer }
            shows: { type: integer }
    SettingsPatch:
      type: object
      description: 'Any subset of `Settings`, same nesting (`{ general: { port: 28480 } }`)'
      additionalProperties: { type: object, additionalProperties: true }
    SettingsView:
      type: object
      required: [settings, sources, env, file, logLevels, engines, engine]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        sources:
          type: object
          description: "'general.port' → env (locked by an environment variable) / file / default"
          additionalProperties: { type: string, enum: [env, file, default] }
        env:
          type: object
          description: "'general.port' → the environment variable that sets it"
          additionalProperties: { type: string }
        file: { type: string, description: 'Path of settings.json' }
        logLevels: { type: array, items: { type: string } }
        engines:
          type: array
          description: 'The torrent engines `downloads.engine` can name, with what each is good at'
          items: { $ref: '#/components/schemas/Engine' }
        engine: { type: [string, 'null'], description: 'The engine running now (it differs from downloads.engine until a restart, or when that one failed to start)' }
    SettingsUpdate:
      type: object
      required: [settings, changed, restartRequired, lockedByEnv]
      properties:
        settings: { $ref: '#/components/schemas/SettingsView' }
        changed: { type: array, items: { type: string }, description: 'Keys saved' }
        restartRequired: { type: array, items: { type: string }, description: 'Changed keys applied on the next start' }
        lockedByEnv: { type: array, items: { type: string }, description: 'Saved, but an environment variable still wins' }
    Engine:
      type: object
      description: 'A torrent engine. Built in (torrent-stream), or an optional program the admin installs (never bundled)'
      required: [id, name, summary, available, detail, installable, installed, version, latest]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string, description: 'What it is good and bad at' }
        available: { type: boolean, description: 'It can run on this server now' }
        detail: { type: [string, 'null'], description: 'Why not, when unavailable' }
        installable: { type: boolean, description: 'An optional download with a build for this platform' }
        installed: { type: [string, 'null'], enum: [builtin, installed, env, path, null], description: 'builtin; installed (by the server); env / path (found elsewhere); null: not installed' }
        version: { type: [string, 'null'], description: 'Installed version' }
        latest: { type: [string, 'null'], description: 'The version this server installs' }
    EngineList:
      type: object
      required: [engines]
      properties:
        engines: { type: array, items: { $ref: '#/components/schemas/Engine' } }
    PortCheck:
      type: object
      required: [port, free, current, owner]
      properties:
        port: { type: integer }
        free: { type: boolean }
        current: { type: boolean, description: 'The port this server listens on now' }
        owner:
          type: [object, 'null']
          description: 'The process holding it, when the OS tells'
          properties:
            pid: { type: integer }
            name: { type: [string, 'null'] }
    LogEntry:
      type: object
      required: [time, level, area, msg]
      properties:
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        area: { type: string }
        msg: { type: string }
      additionalProperties: true
    Storage:
      type: object
      required: [dir, disk, totalBytes, items]
      properties:
        dir: { type: string }
        disk:
          type: [object, 'null']
          required: [free, total]
          properties:
            free: { type: number }
            total: { type: number }
        totalBytes: { type: number }
        items:
          type: array
          items:
            type: object
            required: [name, bytes, modifiedAt, infoHash, torrentName]
            properties:
              name: { type: string }
              bytes: { type: number, description: 'On disk (files are sparse until downloaded)' }
              modifiedAt: { type: [string, 'null'], format: date-time }
              infoHash: { type: [string, 'null'], description: 'The running torrent using it (then it cannot be deleted)' }
              torrentName: { type: [string, 'null'] }
              download:
                type: [object, 'null']
                description: 'The download it belongs to; deleting the entry of a stopped one forgets that download'
                required: [infoHash, name, active]
                properties:
                  infoHash: { type: string }
                  name: { type: string }
                  active: { type: boolean }
    DirCheck:
      type: object
      required: [path, exists, writable, free, total]
      properties:
        path: { type: string }
        exists: { type: boolean }
        writable: { type: boolean, description: 'The directory, or the parent it would be created in' }
        free: { type: [number, 'null'] }
        total: { type: [number, 'null'] }
    HostInfo:
      type: object
      required: [kind, desktop]
      properties:
        kind: { type: string, enum: [headless, desktop] }
        desktop:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DesktopState'
    DesktopState:
      type: object
      description: 'The desktop app (apps/server-desktop): its settings and its updater'
      required: [appVersion, platform, openAtLogin, checkForUpdates, update]
      properties:
        appVersion: { type: string }
        platform: { type: string, description: 'win32, darwin, linux' }
        openAtLogin: { type: boolean, description: 'Starts (hidden, in the tray) when the user logs in' }
        checkForUpdates: { type: boolean, description: 'Looks for updates at start and every 6 hours, downloads them in the background' }
        update:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unsupported, idle, checking, none, available, downloading, downloaded, error]
              description: '`unsupported`: this build can''t update itself (a development run, a Linux .deb without pkexec…)'
            version: { type: [string, 'null'], description: 'The update found or downloaded' }
            percent: { type: [number, 'null'] }
            checkedAt: { type: [string, 'null'], format: date-time }
            error: { type: [string, 'null'] }
    ServerStatusEvent:
      type: object
      description: '`data` of `server.status`'
      properties:
        uptimeS: { type: integer }
        torrents: { type: integer, description: 'Running torrents' }
        sessions: { type: integer }
        eventClients: { type: integer }
    TorrentStatsEvent:
      type: array
      description: '`data` of `torrent.stats`: torrents that have a lease'
      items:
        type: object
        properties:
          infoHash: { type: string }
          peers: { type: integer }
          downloadSpeed: { type: number, description: 'bytes/s' }
          uploadSpeed: { type: number, description: 'bytes/s' }
          downloaded: { type: number, description: 'bytes' }
    SessionEndedEvent:
      type: object
      description: '`data` of `session.ended` (`session.started` / `session.updated` carry a `Session`)'
      properties:
        id: { type: string }
        deviceId: { type: string }
        infoHash: { type: [string, 'null'], description: 'null for a file on disk' }
        ref: { type: [string, 'null'], description: 'Media ref of the file last streamed' }
    Event:
      type: object
      required: [topic, time, data]
      properties:
        topic: { type: string, description: 'server.status, torrent.stats, session.*, download.*, settings.changed, library.changed, library.scan, log, device.*, pairing.*, host.updated' }
        time: { type: string, format: date-time }
        data: {}
