openapi: 3.1.0
info:
  title: Playpex Media Server API
  version: '2'
  summary: The API every Playpex client talks to (TV app, future Android TV / mobile / web clients).
  description: |
    Source of truth for the Playpex protocol (docs/server-separation-plan.md §6). TypeScript types are
    generated from this file (`npm run generate -w packages/protocol` → types/api.d.ts), and the
    server's contract test (`npm test -w apps/server`) checks real answers against it.

    **Base URL**: `http://<server>:<port>/api/v1`. The default port is 28470 (the server's settings
    can change it). The prefix names the URL space, not the API version: API 2 is served there too,
    and a client says which version it speaks in `X-Playpex-Client` (`api=<n>`).

    **API 2** (docs/providers-plan.md §4.1, decision C) removed `GET /movies`, `/movies/{imdbId}` and
    `/shows/{imdbId}/torrents`: the server reads no torrent site of its own. A title's torrents come from
    the server's source plugins through `POST /play/sources`; its runtime and certification from TMDB, its
    rating from `/imdb/{imdbId}`. The removed routes answer `410 GONE`; everything else serves API 1
    clients as before (`minApiVersion` 1).

    **Finding a server** (not HTTP; constants in `@playpex/protocol` `DISCOVERY`; plan §5.7). A server
    sharing on the LAN answers both ways below; use both and merge what you find by `id`. Then confirm
    with `GET /server` on the address found: identify a server by its `id`, never by its address, so a
    paired client finds it again after a DHCP or port change.
    - mDNS / DNS-SD: browse `_playpex._tcp.local`. SRV = the HTTP port in use; TXT `id` (server id),
      `v` (apiVersion), `ver` (server version), `name` (full server name).
    - UDP (for networks that filter multicast): send the datagram `PLAYPEX_DISCOVER 1` to port 28471
      (broadcast `255.255.255.255` and each interface's broadcast address, or unicast). Each server answers
      the sender with one JSON datagram `{ id, name, port, apiVersion, minApiVersion, version }`.
    - Manual entry: an address without a port means 28470.

    **Versioning**: `info.version` is the API version (`apiVersion` in `GET /server`), bumped only on
    breaking changes. Clients may send `X-Playpex-Client: <name>/<version>; api=<n>`; the server
    answers 426 `CLIENT_TOO_OLD` / `SERVER_TOO_OLD` when it can't serve that version.

    **Errors**: every error answer is JSON `{ error, code }` (see `Error`). Some list routes add an
    empty list next to it (`torrents: []`, `subtitles: []`).

    **Auth** (`auth: "pairing"` in `GET /server`; plan §6.3):
    - A client pairs once with the **RFC 8628 device flow**: `POST /auth/device/code` → it shows
      `user_code` (and `verification_uri`, maybe as a QR code of `verification_uri_complete`), then polls
      `POST /auth/device/token` every `interval` seconds until the server's admin approves the code
      (dashboard, tray, or `playpex-server devices approve <code>`). The answer's `access_token` is the
      device's token (valid a year, renewed while used); then `PUT /devices/me` says what the device is.
    - Every other request carries `Authorization: Bearer <token>`; media elements that can't set
      headers add `?access_token=<token>`. Without a valid token: **401 `PAIRING_REQUIRED`** (any route
      but the public ones: `GET /server`, `GET /openapi.yaml`, `GET /docs`, the two device-flow routes,
      `/admin/setup`). A revoked token
      gets the same 401: pair again.
    - Clients on the server machine (loopback) need no token, unless the server's setting
      `security.requirePairingOnLoopback` is on.
    - The dashboard signs in as the admin (`POST /auth/sign-in/username`, an HttpOnly session cookie)
      for `/admin/*` and `/sessions` (else **401 `ADMIN_REQUIRED`**). A device token never grants admin.
    - Device-flow errors follow RFC 8628 / RFC 6749: `{ error, error_description }` with 400
      (`authorization_pending`, `slow_down`, `expired_token`, `access_denied`, `invalid_grant`,
      `invalid_client`). Better Auth's other routes (`/auth/sign-in/…`) answer `{ message, code }`.

    **Events**: `GET /events` upgrades to a WebSocket of JSON messages `{ topic, time, data }`
    (see `Event`); same auth (`?access_token=` for clients that can't set headers).

    **Media refs**: every playable file has a ref (`TorrentFile.ref`; files on disk later from the
    play sources), and `/media/{ref}` streams, probes and transcodes it, wherever it is. Refs are
    opaque: use the ones the server gives. The `/torrents/{infoHash}/files|probe|keyframe|transcode/{path}`
    routes are aliases kept for API v1 clients.

    **Devices and leases**: a torrent stays running while a device holds it. Adding it,
    streaming its files (`/media/{ref}` or the torrent routes) and the keepalives take or refresh the
    calling device's lease; `DELETE /torrents/{infoHash}` (or `DELETE /media/{ref}`) releases it. A
    `stream` torrent pauses 30 s after the last lease is gone (its data is kept: only the admin
    deletes downloads). A file on disk has leases too (Activity), with nothing to stop. A lease with no request for the
    server's idle timeout (10 min by default) is dropped, so players send a keepalive every minute
    while open, paused or not. A paired device is the one its token names; a local client (no token)
    names its device with the `X-Playpex-Device` header or the `device` query parameter (media URLs),
    else the server uses its address. Past the server's limits (torrents, transcodes) answers are 503
    `BUSY`.

    Playpex is an educational project; streaming copyrighted content via torrents may be illegal
    where you live.
  license:
    name: See licence.md
servers:
  - url: http://localhost:28470/api/v1

security:
  - deviceToken: []
  - accessTokenParam: []
  - adminSession: []
  - {}   # loopback clients, unless the server requires pairing there too

tags:
  - name: server
  - name: auth
    description: Pairing (RFC 8628 device flow) and the admin's sign-in
  - name: devices
    description: A paired device's own record
  - name: admin
    description: The dashboard's routes (admin session)
  - name: events
    description: Real-time events (WebSocket)
  - name: media
    description: Any playable file by its media ref (a torrent's file or a file on disk), byte-range streaming, probe, transcode
  - name: torrents
    description: The player's torrents (and their media routes, aliases of /media)
  - name: downloads
    description: Every torrent the server keeps (running or not), managed like a torrent client
  - name: sessions
    description: What every device is playing (leases on torrents)
  - name: catalog
    description: 'Movies, shows, seasons and people from the server''s metadata provider (TMDB, behind the server: clients need no key), in Playpex''s own shapes; IMDb ratings'
  - name: play
    description: 'What can play a title: files on this server, downloads, torrents, ranked (the play pipeline)'
  - name: releases
    description: Release lists from the server's source plugins (`releases.providers`)
  - name: search
    description: Streams and files found by keywords in plugins (`sources.search`), and links read by the server (docs/search-plan.md)
  - name: subtitles
  - name: profiles
  - name: library
    description: One profile's watch list, playback progress and history
  - name: media-library
    description: 'The server''s media library: what is on this server (clients), and its folders, scans and matches to TMDB (admin)'
  - name: settings
    description: User settings (per device and per profile), keys in @playpex/protocol settings.js
  - name: trailers
  - name: plugins
    description: 'What clients render of plugins (docs/plugins-plan.md §4.9): their screens and contributions, the answers of their data handlers, their assets. Setup is the dashboard''s'
  - name: live
    description: 'Live TV from plugins (docs/providers-plan.md §8): channels, their programme guide, a channel''s stream'

paths:
  /server:
    get:
      tags: [server]
      operationId: getServer
      summary: Who this server is (no auth). Probe it after discovery and before pairing.
      security: []
      responses:
        '200':
          description: Server identity and features
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }
  /openapi.yaml:
    get:
      tags: [server]
      operationId: getOpenApi
      summary: This API's OpenAPI document (no auth)
      security: []
      responses:
        '200':
          description: The spec this server implements (packages/protocol/openapi.yaml)
          content:
            application/yaml:
              schema: { type: string }
  /docs:
    get:
      tags: [server]
      operationId: getDocs
      summary: The client author guide (redirects to /docs, served by the dashboard; no auth)
      security: []
      responses:
        '302':
          description: Location `/docs`

  # ── auth ────────────────────────────────────────────────────────────────────
  /auth/device/code:
    post:
      tags: [auth]
      operationId: requestDeviceCode
      summary: Start pairing (RFC 8628 §3.1). Show the user_code; poll /auth/device/token.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
      responses:
        '200':
          description: A pairing request, pending until the admin approves it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAuthorization' }
        '400': { $ref: '#/components/responses/OAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/device/token:
    post:
      tags: [auth]
      operationId: requestDeviceToken
      summary: Poll for the device's token (RFC 8628 §3.4); once per `interval` seconds
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
      responses:
        '200':
          description: Approved; the token is given once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceToken' }
        '400': { $ref: '#/components/responses/OAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sign-in/username:
    post:
      tags: [auth]
      operationId: adminSignIn
      summary: The admin signs in (dashboard). Sets the session cookie. 5 attempts a minute per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                rememberMe: { type: boolean }
      responses:
        '200':
          description: Signed in (Better Auth's answer; the cookie is what matters)
          content:
            application/json:
              schema: { type: object, required: [user], properties: { user: { type: object } } }
        '400': { $ref: '#/components/responses/BetterAuthError' }
        '401': { $ref: '#/components/responses/BetterAuthError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sign-out:
    post:
      tags: [auth]
      operationId: adminSignOut
      summary: Ends the admin's session (needs the page's Origin header, like any cookie POST)
      security:
        - adminSession: []
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
        '403': { $ref: '#/components/responses/BetterAuthError' }
  /auth/get-session:
    get:
      tags: [auth]
      operationId: adminSession
      summary: The admin's session and user, or null (device tokens get null)
      security:
        - adminSession: []
      responses:
        '200':
          description: Session, or null when not signed in
          content:
            application/json:
              schema:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [session, user]
                    properties:
                      session: { type: object }
                      user: { type: object }

  # ── devices ─────────────────────────────────────────────────────────────────
  /devices/me:
    get:
      tags: [devices]
      operationId: getMyDevice
      summary: The calling paired device's record (404 for local clients, which aren't paired)
      responses:
        '200':
          description: This device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [devices]
      operationId: describeMyDevice
      summary: Say what this device is, right after pairing (and whenever it changes)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceDescription' }
      responses:
        '200':
          description: This device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── admin (dashboard) ───────────────────────────────────────────────────────
  /admin/setup:
    get:
      tags: [admin]
      operationId: getSetup
      summary: Whether the first-run setup is still needed (the admin has no password yet)
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [needed, local]
                properties:
                  needed: { type: boolean }
                  local: { type: boolean, description: 'The request comes from the server machine (where the setup is allowed)' }
    post:
      tags: [admin]
      operationId: setup
      summary: Create the admin account. From the server machine only, and only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCredentials' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/password:
    put:
      tags: [admin]
      operationId: changeAdminPassword
      summary: Change the admin's password; every admin session is signed out, devices stay paired
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/pairing:
    get:
      tags: [admin]
      operationId: listPairingRequests
      summary: Pending pairing requests, oldest first
      security:
        - adminSession: []
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/PairingRequest' } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/pairing/{code}/approve:
    parameters:
      - $ref: '#/components/parameters/UserCode'
    post:
      tags: [admin]
      operationId: approvePairing
      summary: Approve a pairing request; the device gets its token on its next poll
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/pairing/{code}/deny:
    parameters:
      - $ref: '#/components/parameters/UserCode'
    post:
      tags: [admin]
      operationId: denyPairing
      summary: Deny a pairing request (the device gets access_denied)
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/devices:
    get:
      tags: [admin]
      operationId: listDevices
      summary: Paired devices, most recently seen first
      security:
        - adminSession: []
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/devices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      operationId: renameDevice
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 64 } } }
      responses:
        '200':
          description: The device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: revokeDevice
      summary: Revoke a device; its token stops working at once and its streams are closed
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/overview:
    get:
      tags: [admin]
      operationId: getOverview
      summary: The dashboard's Overview (server, process, machine, traffic, disks, ffmpeg, providers)
      security:
        - adminSession: []
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/restart:
    post:
      tags: [admin]
      operationId: restartServer
      summary: Restart the server (applies port, LAN sharing, download dir). Answers first, restarts 200 ms later.
      description: |
        `port` is the configured port the server will try; when another program holds it, the server starts
        in recovery mode on a free loopback port instead (see `Overview.server.recovery`).
      security:
        - adminSession: []
      responses:
        '200':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                required: [ok, port, currentPort]
                properties:
                  ok: { const: true }
                  port: { type: integer }
                  currentPort: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/host:
    get:
      tags: [admin]
      operationId: getHost
      summary: The program the server runs in, and the desktop app's own settings and updater state
      description: |
        `kind` is `desktop` when Playpex Media Server's desktop app (tray icon) runs the server, `headless`
        on its own (systemd, Docker, `playpex-server`). `desktop` is null
        unless `kind` is `desktop`. Changes arrive on the events socket as `host.updated` (admin).
      security:
        - adminSession: []
      responses:
        '200':
          description: Host
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '401': { $ref: '#/components/responses/AdminRequired' }
    put:
      tags: [admin]
      operationId: updateHost
      summary: Change the desktop app's settings (start at login, automatic update checks)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openAtLogin: { type: boolean }
                checkForUpdates: { type: boolean }
      responses:
        '200':
          description: Host after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/host/update/check:
    post:
      tags: [admin]
      operationId: checkForUpdate
      summary: Ask the desktop app to look for an update now (downloaded in the background when found)
      security:
        - adminSession: []
      responses:
        '200':
          description: Host, with the updater's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostInfo' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/host/update/install:
    post:
      tags: [admin]
      operationId: installUpdate
      summary: Restart the desktop app into the downloaded update
      description: '409 `CONFLICT` while streams are playing, unless `force` is true. 409 too when no update is downloaded.'
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /admin/settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: Effective settings (secrets masked), where each comes from
      security:
        - adminSession: []
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
        '401': { $ref: '#/components/responses/AdminRequired' }
    put:
      tags: [admin]
      operationId: updateSettings
      summary: Change settings (a partial object). Masked secrets sent back unchanged are kept.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsUpdate' }
        '400':
          description: Invalid values (`INVALID`); nothing saved
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    properties:
                      errors: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/settings/check-port:
    post:
      tags: [admin]
      operationId: checkPort
      summary: Whether the server could listen on a port right now
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [port], properties: { port: { type: integer } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortCheck' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/dlna:
    get:
      tags: [admin]
      operationId: getDlna
      summary: 'The DLNA media server: its state, the folders it may serve, the renderers that used it in the last day'
      description: 'On / off and its port are settings (`dlna.enabled`, `dlna.port`); a folder is served with `PATCH /admin/library/folders/{id}` `{dlna: true}` (never an adults-only one).'
      security:
        - adminSession: []
      responses:
        '200':
          description: DLNA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DlnaStatus' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/Error' }
  /admin/engines/{id}/install:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      operationId: installEngine
      summary: Download and install an optional torrent engine (its pinned release, SHA-256 checked)
      security:
        - adminSession: []
      responses:
        '200':
          description: The engines after the install
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Upstream' }
  /admin/engines/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: uninstallEngine
      summary: Remove an installed optional engine (409 while it runs)
      security:
        - adminSession: []
      responses:
        '200':
          description: The engines after the removal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineList' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/logs:
    get:
      tags: [admin]
      operationId: getLogs
      summary: Recent log entries (ring buffer of 2 000), oldest first; live ones come as `log` events
      security:
        - adminSession: []
      parameters:
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] }, description: 'Minimum level' }
        - { name: area, in: query, schema: { type: string } }
        - { name: plugin, in: query, schema: { type: string }, description: 'Only the lines of this plugin (area plugins)' }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: 'Only entries after this time' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 }, description: 'The newest N' }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, levels, file]
                properties:
                  entries: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
                  levels: { type: array, items: { type: string } }
                  file: { type: [string, 'null'], description: 'Current log file' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/logs/download:
    get:
      tags: [admin]
      operationId: downloadLogs
      summary: Every log file (current and rotated) as a zip
      security:
        - adminSession: []
      responses:
        '200':
          description: Zip archive
          content:
            application/zip: {}
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage:
    get:
      tags: [admin]
      operationId: getStorage
      summary: What the download directory holds (one entry per torrent), largest first
      security:
        - adminSession: []
      responses:
        '200':
          description: Storage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storage' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage/clear:
    post:
      tags: [admin]
      operationId: clearStorage
      summary: Delete every entry of the download directory that no running torrent uses (their downloads are forgotten)
      security:
        - adminSession: []
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [removed, freedBytes]
                properties:
                  removed: { type: integer }
                  freedBytes: { type: number }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage/items/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string }, description: 'Top-level entry name (URL-encoded)' }
    delete:
      tags: [admin]
      operationId: deleteStorageItem
      summary: Delete one entry of the download directory (409 while a running torrent uses it)
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/storage/places:
    get:
      tags: [admin]
      operationId: storagePlaces
      summary: Every place Playpex keeps media (the library's folders, the download folder), with its size and disk
      security:
        - adminSession: []
      responses:
        '200':
          description: The places
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoragePlaces' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/storage/browse:
    get:
      tags: [admin]
      operationId: storageBrowse
      summary: One level of a place (folders first), or the names matching `q` anywhere in it (≤ 200)
      security:
        - adminSession: []
      parameters:
        - { name: place, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string }, description: 'Inside the place, / separated; empty = its root' }
        - { name: sort, in: query, schema: { type: string, enum: [name, size, date] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageListing' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/storage/entries:
    delete:
      tags: [admin]
      operationId: storageDelete
      summary: Delete a file or folder of a place (refused while a running torrent writes there; its library rows go too)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place, path]
              properties:
                place: { type: string }
                path: { type: string, minLength: 1 }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, freedBytes]
                properties:
                  ok: { const: true }
                  freedBytes: { type: number }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/storage/largest:
    get:
      tags: [admin]
      operationId: storageLargest
      summary: The 10 biggest title folders of a place (folders whose own files hold most of their size)
      security:
        - adminSession: []
      parameters:
        - { name: place, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The folders, biggest first (none while the place is measured)
          content:
            application/json:
              schema:
                type: object
                required: [measuring, folders]
                properties:
                  measuring: { type: boolean }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [path, bytes]
                      properties:
                        path: { type: string }
                        bytes: { type: number }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/storage/subtitle:
    get:
      tags: [admin]
      operationId: storageSubtitle
      summary: A subtitle file of a place (SRT, ASS, SSA, WebVTT; ≤ 10 MB) as WebVTT, for a player's `<track>`
      security:
        - adminSession: []
      parameters:
        - { name: place, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string }, description: 'Inside the place, / separated' }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501':
          description: '`NOT_SUPPORTED`: a picture subtitle (VobSub, PGS)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/storage/check:
    post:
      tags: [admin]
      operationId: checkDirectory
      summary: Whether a directory can be the download directory (absolute, writable, free space)
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [dir], properties: { dir: { type: string } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirCheck' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }

  # ── plugins (admin; docs/plugins-plan.md §6.3) ──────────────────────────────
  /admin/plugins:
    get:
      tags: [plugins]
      operationId: listAdminPlugins
      summary: Installed plugins and the developer copies that run, with the install settings
      security:
        - adminSession: []
      responses:
        '200':
          description: The plugins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugins' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/packages:
    post:
      tags: [plugins]
      operationId: stagePluginPackage
      summary: Read a package (an upload, or a URL) and show what it is before installing it
      description: |
        A `.ppx` / `.zip` (≤ 20 MB, ≤ 64 MB unpacked, ≤ 2000 files) holding `playpex-plugin.json` at its root or in
        one folder (a GitHub source zip). A URL is a direct link, or a GitHub repository / release page
        (`https://github.com/<owner>/<repo>[/releases[/latest|/tag/<tag>]]`: the release's `.ppx` / `.zip` asset, else
        its source zip; a repository without releases: its default branch). The manifest is checked like the
        loader does. Nothing runs yet: the answer is kept 15 min; install it by its `token`. `installable` false:
        unsigned (or signed by a key not in `plugins.publisherKeys`) outside developer mode, or a developer copy
        of the same id runs (`reason`).
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/zip }
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 'http(s): a package, or a GitHub repository / release page' }
      responses:
        '200':
          description: What it is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackagePreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/packages/{token}/install:
    post:
      tags: [plugins]
      operationId: installPluginPackage
      summary: Install a previewed package
      description: |
        Into `<config>/plugins/<id>/`; the version it replaces is kept (`.previous/<id>/`) and comes back when the
        new one doesn't start (400). 403 when it isn't installable any more (trust settings changed), 404 for an
        unknown or expired token, 409 when a developer copy of that id runs, or when the package asks for more than
        the installed version (the preview's `added`) without `accept: true`. A personal permission it adds stays off
        for every profile until granted.
      security:
        - adminSession: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accept: { type: boolean, description: 'The admin accepted the permissions the preview lists in `added`, and its `moves`' }
                optional: { type: array, items: { type: string }, description: 'Optional dependencies (the preview''s `dependencies`) to install with it' }
      responses:
        '200':
          description: The installed plugin (its dependencies installed first), or the repository a repository package added
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/AdminPlugin' }
                  - type: object
                    required: [repository]
                    properties: { repository: { $ref: '#/components/schemas/PluginRepository' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/plugins/packages/{token}:
    delete:
      tags: [plugins]
      operationId: discardPluginPackage
      summary: Forget a previewed package
      security:
        - adminSession: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/repositories:
    get:
      tags: [plugins]
      operationId: listPluginRepositories
      summary: The plugin repositories (the official one first)
      description: |
        `official`: the built-in repository this server ships with (null while it isn't published). It never offers an
        `audience: adults` plugin: such entries are left out (`refused`) and a package from it whose manifest says adults
        is refused at install. `updates`: the server's update policy (setting `plugins.updates`).
      security:
        - adminSession: []
      responses:
        '200':
          description: The repositories
          content:
            application/json:
              schema:
                type: object
                required: [repositories, official, updates]
                properties:
                  repositories: { type: array, items: { $ref: '#/components/schemas/PluginRepository' } }
                  official: { type: ['object', 'null'], properties: { id: { type: string }, name: { type: string }, url: { type: string } } }
                  updates: { type: string, enum: [auto, notify, never] }
        '401': { $ref: '#/components/responses/AdminRequired' }
    post:
      tags: [plugins]
      operationId: addPluginRepository
      summary: Trust a repository (its key pinned)
      description: '`key` must be the one the preview showed (409 otherwise, or when its id or URL is known). Its plugins are browsable at once.'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url, key], properties: { url: { type: string }, key: { type: string } } }
      responses:
        '200':
          description: The repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRepository' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/repositories/preview:
    post:
      tags: [plugins]
      operationId: previewPluginRepository
      summary: What adding a repository would trust, before the admin says yes
      description: Fetches its index (HTTPS, public addresses, ≤ 4 MB) and checks it's signed by the key it names; nothing is saved.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string } } }
      responses:
        '200':
          description: The repository it names
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRepositoryPreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/repositories/refresh:
    post:
      tags: [plugins]
      operationId: refreshPluginRepositories
      summary: '"Check now": fetch the indexes (one, or every enabled), then check the installed plugins'' updates'
      description: |
        A failure keeps the last good index (`error`, `stale`). An index signed by another key than the pinned one is
        refused and the key waits (`pendingKey`). Then versions marked broken switch their plugins off (`held`), and under
        `auto` updates asking for nothing new install.
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string } } }
      responses:
        '200':
          description: The repositories after it
          content:
            application/json:
              schema: { type: object, required: [repositories], properties: { repositories: { type: array, items: { $ref: '#/components/schemas/PluginRepository' } } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/repositories/{repositoryId}:
    parameters:
      - { name: repositoryId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [plugins]
      operationId: updatePluginRepository
      summary: 'Turn a repository on or off (off: not browsed, no updates from it)'
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200':
          description: The repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRepository' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [plugins]
      operationId: removePluginRepository
      summary: Forget a repository (its plugins stay installed and stop updating); 409 for the official one
      security:
        - adminSession: []
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/plugins/repositories/{repositoryId}/key:
    post:
      tags: [plugins]
      operationId: acceptPluginRepositoryKey
      summary: Accept the new key a repository's index is signed with (its `pendingKey`)
      security:
        - adminSession: []
      parameters:
        - { name: repositoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key], properties: { key: { type: string } } }
      responses:
        '200':
          description: The repository, fetched again with that key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRepository' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/plugins/catalog:
    get:
      tags: [plugins]
      operationId: getPluginCatalog
      summary: Browse every plugin of the enabled repositories
      security:
        - adminSession: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginCatalog' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/catalog/install:
    post:
      tags: [plugins]
      operationId: stageCatalogPlugin
      summary: Download a version of a repository's plugin (the newest that runs here by default) and preview it
      description: |
        Its sha256 and size checked against the signed index; the preview lists its `dependencies` (what `requires` needs:
        installed already, from this repository first, else another enabled one, or `missing`) and `moves` when the
        plugin is installed from elsewhere. Installed with `POST /admin/plugins/packages/{token}/install`. 403 for an
        adults plugin from the official repository.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository, id]
              properties:
                repository: { type: string }
                id: { type: string }
                version: { type: string }
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackagePreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/updates:
    get:
      tags: [plugins]
      operationId: getPluginUpdates
      summary: Updates of the plugins installed from repositories, from their origin only
      security:
        - adminSession: []
      responses:
        '200':
          description: The updates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginUpdates' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/updates/apply:
    post:
      tags: [plugins]
      operationId: applyPluginUpdates
      summary: '"Update all": install every update asking for no new permissions (whatever the policy)'
      security:
        - adminSession: []
      responses:
        '200':
          description: What happened to each
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, version, installed]
                      properties: { id: { type: string }, version: { type: string }, installed: { type: boolean }, reason: { type: string } }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/plugins/kept/{keptId}:
    delete:
      tags: [plugins]
      operationId: forgetKeptPluginData
      summary: Forget what is kept for a plugin that isn't installed
      security:
        - adminSession: []
      parameters:
        - { name: keptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}:
    parameters:
      - { name: pluginId, in: path, required: true, schema: { type: string } }
    get:
      tags: [plugins]
      operationId: getAdminPlugin
      summary: One plugin, with what its page shows (listing, requires, exports, changelog)
      security:
        - adminSession: []
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [plugins]
      operationId: updateAdminPlugin
      summary: Switch an installed plugin on or off, or set its update policy
      description: |
        Off stops it and hides it from clients (its data stays); plugins requiring it go off too, held for it, and come back
        when it's on again. On is refused (409) for a version its repository marked broken, or while a plugin it requires
        is off or missing. `updatePolicy` null = the server's `plugins.updates`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                updatePolicy: { type: [string, 'null'], enum: [auto, notify, never, null] }
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [plugins]
      operationId: removeAdminPlugin
      summary: Remove an installed plugin
      description: |
        Its files, and (unless `data=keep`) its store, secrets and linked accounts, settings, grants and notifications.
        What it wrote to the user's data (watch list, progress, downloads) stays. Library folders it recognised go back to TMDB.
      security:
        - adminSession: []
      parameters:
        - { name: data, in: query, required: false, schema: { type: string, enum: [keep, delete] } }
        - { name: force, in: query, required: false, schema: { type: string, enum: ['1', 'true'] }, description: 'Plugins requiring it go off (held) instead of refusing' }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Installed plugins require it (`dependents`)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Error' }
                  - type: object
                    properties:
                      dependents: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, enabled: { type: boolean } } } }
  /admin/plugins/{pluginId}/rollback:
    post:
      tags: [plugins]
      operationId: rollbackAdminPlugin
      summary: Stage the version the last update replaced, to put it back
      description: |
        A preview like an uploaded package's (`rollback: true`, its permissions against the running version's),
        installed with `POST /admin/plugins/packages/{token}/install`; the version it replaces is kept in turn.
        404 when no earlier version is kept.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPackagePreview' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/clear:
    post:
      tags: [plugins]
      operationId: clearAdminPluginData
      summary: Forget everything a plugin kept, as if just installed
      description: Its store, secrets and linked accounts, settings, grants, hidden profiles and notifications; a running plugin starts again.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/reload:
    post:
      tags: [plugins]
      operationId: reloadDeveloperPlugin
      summary: Load a developer copy again from its folder (after its author changed it)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The plugin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPlugin' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/plugins/{pluginId}/channels:
    get:
      tags: [plugins]
      operationId: getAdminPluginChannels
      summary: A live plugin's channels as the server keeps them (Plugins › <name> › Channels)
      description: Asks the plugin when the server has none yet. A plugin that fails answers its error, no channels.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Its channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLiveChannels' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/channels/refresh:
    post:
      tags: [plugins]
      operationId: refreshAdminPluginChannels
      summary: Asks a live plugin for its channels again now (`live.channels` with `refresh`)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Its channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLiveChannels' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/{pluginId}/settings:
    get:
      tags: [plugins]
      operationId: getAdminPluginSettings
      summary: A plugin's options (its manifest's `contributes.settings`), as the dashboard edits them
      description: |
        Definitions with their labels translated (`Accept-Language`), the server-scope values (the manifest's defaults
        for the ones never set), which secrets are set (never their values), and the values of each profile for its
        profile-scope settings (kids profiles absent for an `adults` plugin). Also for a disabled installed plugin.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Its settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [plugins]
      operationId: updateAdminPluginSettings
      summary: Set some of a plugin's options
      description: |
        Server-scope values (no `profile`) or one profile's. All or nothing: an unknown key, a key of the other scope or a
        bad value refuses the change (400 with `errors`). `null` puts a setting back to its default; a secret's `null` or
        `""` removes it. Publishes `plugin.changed` with `reason: settings`.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                profile: { type: string, description: 'A profile id: its profile-scope values' }
                values: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Its settings after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/settings/{key}/run:
    post:
      tags: [plugins]
      operationId: runAdminPluginAction
      summary: Press an `action` setting (Test connection, Clear cache, Sync now)
      description: Calls its data handler without a profile; the dashboard shows the toasts among the effects. 409 while the plugin is off.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The handler's answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginDataAnswer' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /admin/plugins/{pluginId}/grants:
    put:
      tags: [plugins]
      operationId: grantAdminPluginPermission
      summary: Grant (or take back) one of a plugin's personal permissions for a profile
      description: |
        Personal permissions (`events.playback`, `write.watchlist`, `write.watched`, `write.ratings`) are off for every
        profile until the admin switches them on here (decision G). Answers the plugin's settings view (its `profiles[].grants`).
        Publishes `plugin.changed` with `reason: grants`.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, permission, granted]
              properties:
                profile: { type: string }
                permission: { type: string }
                granted: { type: boolean }
      responses:
        '200':
          description: Its settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/profiles:
    put:
      tags: [plugins]
      operationId: showAdminPluginToProfile
      summary: Show a plugin to a profile, or hide it from that profile
      description: |
        A hidden plugin gets nothing of that profile: no screens or slots in `GET /plugins?profile=`, no data calls
        (403), no hooks, events or notifications. Answers the plugin's settings view (`profiles[].shown`).
        Publishes `plugin.changed` with `reason: profiles`.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, shown]
              properties:
                profile: { type: string }
                shown: { type: boolean }
      responses:
        '200':
          description: Its settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/links:
    get:
      tags: [plugins]
      operationId: getAdminPluginLinks
      summary: A plugin's account links and their accounts (one per profile, or the server's)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Its links
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links: { type: array, items: { $ref: '#/components/schemas/PluginLink' } }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/links/{name}/start:
    post:
      tags: [plugins]
      operationId: startAdminPluginLink
      summary: Start linking an account
      description: |
        A device-code link: the host asks the service for a code (the client id from the plugin's secret) and polls for the
        token; show `code` and `url` to the person whose account it is. A custom link: the plugin's handler answers a code
        to show, or a form to fill (`submit`). 400 when the client id isn't entered yet, 409 while the plugin is off.
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { profile: { type: string, description: 'For a link of scope profile' } } }
      responses:
        '200':
          description: What to show
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginLinkStart' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /admin/plugins/{pluginId}/links/{name}/progress:
    get:
      tags: [plugins]
      operationId: getAdminPluginLinkProgress
      summary: How a started link is going (poll every few seconds)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: profile, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Its state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginLinkProgress' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/plugins/{pluginId}/links/{name}/submit:
    post:
      tags: [plugins]
      operationId: submitAdminPluginLink
      summary: A custom link's form, filled
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                profile: { type: string }
                values: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Its state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginLinkProgress' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/plugins/{pluginId}/links/{name}:
    delete:
      tags: [plugins]
      operationId: unlinkAdminPluginLink
      summary: Unlink an account (its tokens deleted)
      security:
        - adminSession: []
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: profile, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── media library (admin; docs/media-server-plan.md §5) ────────────────────
  /admin/library:
    get:
      tags: [media-library]
      operationId: getMediaLibrary
      summary: The library's folders (with file counts and scan state) and the scanner's queue
      security:
        - adminSession: []
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryView' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/library/folders:
    post:
      tags: [media-library]
      operationId: addLibraryFolder
      summary: Add a folder of video files (its realpath is kept) and scan it
      description: |
        400 when it isn't a readable folder, 409 when it is in the library already, inside one of its folders or
        around one. Nothing on disk is ever written or deleted.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddLibraryFolderRequest' }
      responses:
        '201':
          description: The folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/library/folders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [media-library]
      operationId: updateLibraryFolder
      summary: Change a folder's kind, audience, DLNA flag or information provider
      description: |
        A new kind rescans it, matching unmatched files again. A new `matcher` (a plugin of `matchers` with
        `library.match`, or null for Playpex's own TMDB matching) rescans it matching every file again but
        those the admin matched; the plugin answering nothing for a file leaves it to Playpex's rules.
        400 for a matcher that isn't a running plugin with `library.match`.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { $ref: '#/components/schemas/LibraryFolderKind' }
                audience: { $ref: '#/components/schemas/LibraryAudience' }
                dlna: { type: boolean }
                matcher: { type: [string, 'null'], description: 'A plugin id from `matchers`, or null (TMDB)' }
      responses:
        '200':
          description: The folder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [media-library]
      operationId: removeLibraryFolder
      summary: Forget a folder and its files (nothing on disk is deleted); 409 for the built-in download folder
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
  /admin/library/scan:
    post:
      tags: [media-library]
      operationId: scanLibrary
      summary: Queue a scan of one folder, or of all
      description: |
        Unchanged files (same size and modification time) are not probed or matched again. `force` also matches
        unmatched files again and probes files that couldn't be probed. Progress arrives as `library.scan` events.
      security:
        - adminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folderId: { type: string, description: 'Omitted: every folder' }
                force: { type: boolean }
      responses:
        '200':
          description: The scanner's state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryScanStatus' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files:
    get:
      tags: [media-library]
      operationId: listLibraryFiles
      summary: The library's files, newest first, with what each is
      security:
        - adminSession: []
      parameters:
        - { name: folder, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/LibraryFileState' } }
        - { name: item, in: query, required: false, schema: { type: string }, description: 'Files of one item' }
        - { name: title, in: query, required: false, schema: { type: string, pattern: '^(movie|tv):\d{1,10}$' }, description: 'Files of one title: `movie:<tmdbId>` (the movie''s), `tv:<tmdbId>` (every episode''s of the show)' }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Part of the path or of the matched title' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Files
          content:
            application/json:
              schema:
                type: object
                required: [files, total]
                properties:
                  files: { type: array, items: { $ref: '#/components/schemas/LibraryFile' } }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
  /admin/library/files/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [media-library]
      operationId: getLibraryFile
      summary: One file
      security:
        - adminSession: []
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files/{id}/match:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [media-library]
      operationId: matchLibraryFile
      summary: Say what a file is (kept by rescans); 400 when TMDB has no such movie or episode
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryMatch' }
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      tags: [media-library]
      operationId: unmatchLibraryFile
      summary: Forget a file's match (the next scan matches it again)
      security:
        - adminSession: []
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/files/{id}/ignored:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [media-library]
      operationId: ignoreLibraryFile
      summary: Ignore a file (never matched nor listed to clients) or bring it back
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ignored]
              properties:
                ignored: { type: boolean }
      responses:
        '200':
          description: The file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/library/search:
    get:
      tags: [media-library]
      operationId: searchLibraryCatalog
      summary: Search TMDB for a movie or a show (to fix a match)
      security:
        - adminSession: []
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Up to 20 results, TMDB's order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [tmdbId, title, year, overview, posterPath]
                      properties:
                        tmdbId: { type: integer }
                        title: { type: string }
                        year: { type: [integer, 'null'] }
                        overview: { type: [string, 'null'] }
                        posterPath: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Error' }
  /admin/fs:
    get:
      tags: [media-library]
      operationId: browseFolders
      summary: The server's folders, to pick a library folder (directories only, no hidden ones, no file names)
      security:
        - adminSession: []
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: 'Absolute; omitted: only `places`' }
      responses:
        '200':
          description: A folder's subfolders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListing' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── events ──────────────────────────────────────────────────────────────────
  /events:
    get:
      tags: [events]
      operationId: events
      summary: WebSocket of server events (an `Upgrade` to websocket)
      description: |
        Text messages, each an `Event`. Topics for everyone: `server.status` (on connect, then every 30 s),
        `torrent.stats` (every 2 s while torrents with a lease run), `session.started` / `session.updated` /
        `session.ended`, `download.added` / `download.updated` (a `Download`; state changes at once, progress
        at most every 2 s) / `download.removed`, `settings.changed`, `library.changed` (`LibraryChangedEvent`). Admin session only: `log`, `device.paired`, `device.revoked`,
        `pairing.requested`, `pairing.approved`, `pairing.denied`, `host.updated`, `library.scan` (`LibraryScanEvent`). `?topics=session,torrent.stats` keeps
        topics starting with one of those prefixes. Messages sent to the server are ignored. A web page
        from another origin is refused (403 `ORIGIN_NOT_ALLOWED`).
      parameters:
        - { name: topics, in: query, required: false, schema: { type: string }, description: 'Comma-separated topic prefixes' }
        - { name: access_token, in: query, required: false, schema: { type: string } }
      responses:
        '101': { description: Switching protocols; then `Event` messages }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  # ── torrents ────────────────────────────────────────────────────────────────
  /torrents:
    get:
      tags: [torrents]
      operationId: listTorrents
      summary: The torrents running now (streams and downloads); GET /downloads lists every one the server keeps
      responses:
        '200':
          description: Running torrents
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Torrent' } }
    post:
      tags: [torrents]
      operationId: addTorrent
      summary: Add a torrent to play (idempotent per info hash) and hold it for the calling device. Its metadata arrives later; poll GET /torrents/{infoHash}.
      description: |
        The torrent becomes a download with intent `stream`. A torrent the server already keeps is
        reused: a paused one starts again, a completed one plays from disk. Past `streaming.maxTorrents`
        running torrents, room is made (streams nobody holds stop, downloads nobody watches go back to
        the queue), else 503 `BUSY`. `link`: a magnet, a bare info hash or an http(s) .torrent URL.
      parameters:
        - $ref: '#/components/parameters/Device'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTorrentRequest' }
      responses:
        '200':
          description: The torrent's info hash (lowercase)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoHash' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /upload:
    post:
      tags: [torrents]
      operationId: uploadTorrent
      summary: Add a torrent to play from an uploaded .torrent file (like POST /torrents)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/x-bittorrent }
      responses:
        '200':
          description: The torrent's info hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfoHash' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /torrents/{infoHash}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: getTorrent
      summary: A torrent the server keeps (running or not); only `infoHash` until its metadata has arrived
      description: |
        With its files, `chosen` is the file the server would play: the plugin's (`fileIndex` /
        `fileName`, a source's `file`), an episode's (`season` + `episode`: its `SxxEyy` file, also
        inside a season pack; a torrent with one video: that one), else the largest video that isn't
        an extra or a sample. Clients play it instead of guessing from names.
      parameters:
        - { name: season, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: episode, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: fileIndex, in: query, required: false, description: "A plugin's file hint (PlaySource.file.index)", schema: { type: integer, minimum: 0 } }
        - { name: fileName, in: query, required: false, description: "A plugin's file hint (PlaySource.file.name)", schema: { type: string, maxLength: 500 } }
      responses:
        '200':
          description: The torrent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Torrent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [torrents]
      operationId: deleteTorrent
      summary: Release the calling device's lease (never deletes anything)
      description: |
        30 s after its last lease is released (another device may still be watching it, or come
        back), a `stream` download pauses (no traffic, data kept; `completed` when its files are done)
        and a `download` keeps going. Only DELETE /downloads/{infoHash} deletes data.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/keepalive:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/Device'
    post:
      tags: [torrents]
      operationId: keepTorrent
      summary: Refresh the calling device's lease (every minute while a player is open), with what it plays
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeepaliveRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/stats:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [torrents]
      operationId: getTorrentStats
      summary: Swarm statistics; safe before the metadata has arrived (zeros while the torrent is stopped)
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TorrentStats' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/start/{index}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - { name: index, in: path, required: true, description: 'File index; out of range = every file', schema: { type: integer } }
    post:
      tags: [torrents]
      operationId: startTorrentFile
      summary: Download this file (or every file)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/stop/{index}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - { name: index, in: path, required: true, description: 'File index; out of range = every file', schema: { type: integer } }
    post:
      tags: [torrents]
      operationId: stopTorrentFile
      summary: Stop downloading this file (or every file)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/deselect:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: deselectTorrent
      summary: Stop downloading every file
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/pause:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: pauseTorrent
      summary: Stop the torrent's traffic (state `paused`, kept across restarts; data kept)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/resume:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [torrents]
      operationId: resumeTorrent
      summary: Run a paused torrent again (its intent unchanged)
      responses:
        '503': { $ref: '#/components/responses/Busy' }
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: streamFile
      summary: Stream a file (HTTP byte ranges). Only this file of a `stream` torrent is downloaded from then on.
      description: |
        Alias of `GET /media/{ref}` (the file's `ref`) for API v1 clients. Use the `link` of a `TorrentFile`. Supports `Range` (answers 206); the end of the file is
        fetched early, where MKV keeps its index. Media elements can use the URL directly. A stopped
        torrent starts again (503 `BUSY` past the limit), unless the file is finished on disk: then it
        is read from disk.
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Busy' }
    head:
      tags: [torrents]
      operationId: headFile
      responses:
        '200': { description: 'Length and type of the file' }
        '206': { description: 'Length of the range' }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/probe/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: probeFile
      summary: Codecs and duration of a file (ffprobe); alias of /media/{ref}/probe
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /torrents/{infoHash}/keyframe/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: getKeyframe
      summary: Where a transcoded stream asked to start at `t` really starts (the keyframe at or before it); alias of /media/{ref}/keyframe
      parameters:
        - { name: t, in: query, required: true, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: Time in seconds
          content:
            application/json:
              schema:
                type: object
                required: [time]
                properties:
                  time: { type: number }
        '404': { $ref: '#/components/responses/NotFound' }
  /torrents/{infoHash}/transcode/{path}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
      - $ref: '#/components/parameters/FilePath'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [torrents]
      operationId: transcodeFile
      summary: The file with its audio re-encoded to AAC stereo (video copied), as live Matroska from `t`; alias of /media/{ref}/transcode
      description: Not byte-seekable; to seek, request again with a new `t` (from /keyframe).
      parameters:
        - { name: t, in: query, required: false, schema: { type: number, minimum: 0, default: 0 } }
        - { name: audio, in: query, required: false, description: 'Audio track index (ProbeResult.audio[].index)', schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Matroska stream
          content:
            video/x-matroska: {}
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: '`BUSY` (the server runs its maximum of transcodes; a new one from the same device and file replaces the previous) or `TRANSCODER_UNAVAILABLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── media (any file by its media ref) ───────────────────────────────────────
  /media/{ref}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: streamMedia
      summary: Stream a file by its media ref (HTTP byte ranges)
      description: |
        A torrent's file (`TorrentFile.ref`) or a file on disk. Supports `Range` (answers 206); media
        elements can use the URL directly. Takes or refreshes the calling device's lease (on the
        torrent, or on the disk file). A torrent's file: as `GET /torrents/{infoHash}/files/{path}` (a
        stopped torrent starts again, 503 `BUSY` past the limit, unless the file is finished on disk).
        A disk file of an adults-only library folder answers 403 `FORBIDDEN` to a kids profile
        (`profile`, else the profile of the device's last keepalive).

        A plugin's live stream (`l_`, format `live`): one continuous Matroska stream remuxed by the
        server's ffmpeg (video copied, audio AAC), no size and no ranges; past `streaming.maxLive` live
        streams 503 `BUSY`, without ffmpeg 503 `TRANSCODER_UNAVAILABLE`. An HLS ref (`h_`, format `hls`):
        302 to its `index.m3u8`.
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '302': { description: 'An `h_` ref: its playlist (`index.m3u8`)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Busy' }
    head:
      tags: [media]
      operationId: headMedia
      responses:
        '200': { description: 'Length and type of the file' }
        '206': { description: 'Length of the range' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [media]
      operationId: releaseMedia
      summary: Release the calling device's lease (leaving the player)
      description: For a torrent's file, the same as `DELETE /torrents/{infoHash}`. Never deletes anything.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/index.m3u8:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
    get:
      tags: [media]
      operationId: mediaPlaylist
      summary: The HLS playlist of an `h_` ref (format hls)
      description: |
        The plugin's playlist fetched by the server as the plugin (its headers, its hosts, the address
        rules on every hop), every URI in it (variant playlists, segments, `#EXT-X-KEY`, `#EXT-X-MAP`,
        `#EXT-X-MEDIA`, …) rewritten to `r/{token}/{name}` beside it. Live playlists are fetched again on every
        request. Takes or refreshes the device's lease; a live one past `streaming.maxLive` → 503 `BUSY`.
        Other refs: 404.
      responses:
        '200': { description: 'The playlist', content: { application/vnd.apple.mpegurl: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
        '503': { $ref: '#/components/responses/Busy' }
  /media/{ref}/r/{token}/{name}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - { name: token, in: path, required: true, description: 'From a playlist the server rewrote (signed: no other URL can be asked)', schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,4096}$' } }
      - { name: name, in: path, required: true, description: 'The part''s file name (`seg1.ts`), for players that judge parts by their extension; not read', schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' } }
    get:
      tags: [media]
      operationId: mediaPlaylistPart
      summary: A playlist's variant playlist, segment, key or map, through the server
      description: 'A playlist is rewritten like `index.m3u8`; anything else streams through (`Range` passed on). 404 for a token of another ref.'
      parameters:
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: 'The bytes' }
        '206': { description: 'A range of them' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /media/{ref}/playback:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
      - { name: t, in: query, schema: { type: number, minimum: 0 }, description: 'hls: start there (the keyframe at or before it)' }
      - { name: audio, in: query, schema: { type: integer, minimum: 0 }, description: 'The sound track (its index among the audio streams)' }
      - { name: mkv, in: query, schema: { type: string, enum: ['0', '1'] }, description: 'The client plays Matroska files' }
      - { name: hevc, in: query, schema: { type: string, enum: ['0', '1'] }, description: 'The client decodes HEVC' }
      - { name: ac3, in: query, schema: { type: string, enum: ['0', '1'] } }
      - { name: eac3, in: query, schema: { type: string, enum: ['0', '1'] } }
      - { name: dts, in: query, schema: { type: string, enum: ['0', '1'] } }
      - { name: truehd, in: query, schema: { type: string, enum: ['0', '1'] } }
    get:
      tags: [media]
      operationId: mediaPlayback
      summary: How this client plays the file (direct, an HLS stream the server makes, or not here)
      description: |
        The client says what its player decodes beyond MP4 / WebM, H.264 / VP9 / AV1 and AAC / MP3 / Opus (every
        browser's); the server probes the file. `hls`: a stream started now (video copied, audio to AAC, fMP4
        segments), played from `start` seconds of the file: to seek outside it, ask again with `t`. One per device
        and file (asking again replaces it), counted in `streaming.maxTranscodes`; `DELETE /media/{ref}` ends it.
      responses:
        '200':
          description: The way to play it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaPlayback' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Busy' }
  /media/{ref}/hls/{session}/{file}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - { name: session, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{24}$' } }
      - { name: file, in: path, required: true, schema: { type: string }, description: '`index.m3u8`, `init.mp4`, `s00000.m4s`…' }
    get:
      tags: [media]
      operationId: mediaPlaybackPart
      summary: A playback HLS stream's playlist and segments (the device's own; they wait for ffmpeg)
      responses:
        '200':
          description: The playlist (an event playlist until ffmpeg reaches the end) or a segment
          content:
            application/vnd.apple.mpegurl: { schema: { type: string } }
            video/mp4: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /media/{ref}/probe:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: probeMedia
      summary: Codecs and duration of a file (ffprobe)
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /media/{ref}/keyframe:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: getMediaKeyframe
      summary: Where a transcoded stream asked to start at `t` really starts (the keyframe at or before it)
      parameters:
        - { name: t, in: query, required: true, schema: { type: number, minimum: 0 } }
      responses:
        '200':
          description: Time in seconds
          content:
            application/json:
              schema:
                type: object
                required: [time]
                properties:
                  time: { type: number }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/transcode:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: transcodeMedia
      summary: The file with its audio re-encoded to AAC stereo (video copied), as live Matroska from `t`
      description: |
        Not byte-seekable; to seek, request again with a new `t` (from /keyframe). The audio is the
        file's own track `audio`, or a separate audio file of the same torrent (`audioRef`: the `ref`
        of a `file` track of GET /media/{ref}/tracks), read while it downloads.
      parameters:
        - { name: t, in: query, required: false, schema: { type: number, minimum: 0, default: 0 } }
        - { name: audio, in: query, required: false, description: 'Audio track index (ProbeResult.audio[].index)', schema: { type: integer, minimum: 0, default: 0 } }
        - { name: audioRef, in: query, required: false, description: "A separate audio file's media ref (MediaTrack.ref, source file); 400 when it isn't one of this video's", schema: { type: string } }
      responses:
        '200':
          description: Matroska stream
          content:
            video/x-matroska: {}
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: '`BUSY` (the server runs its maximum of transcodes; a new one from the same device and file replaces the previous) or `TRANSCODER_UNAVAILABLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /media/{ref}/subtitles:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: listMediaSubtitles
      summary: Subtitle files next to a file on disk (`Movie.en.srt`, `Subs/…`); empty for a torrent's file
      responses:
        '200':
          description: Sidecar subtitles
          content:
            application/json:
              schema:
                type: object
                required: [subtitles]
                properties:
                  subtitles: { type: array, items: { $ref: '#/components/schemas/MediaSubtitle' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/subtitles/{index}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Profile'
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [media]
      operationId: getMediaSubtitle
      summary: One sidecar subtitle as WebVTT (for `<track>`)
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/tracks:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [media]
      operationId: listMediaTracks
      summary: Everything the player can switch for this file (docs/providers-plan.md §6)
      description: |
        `video`: the file itself (`current`) and a torrent's other videos (an episode of the pack,
        an extra). `audio`: the file's own streams (ffprobe; none listed without ffmpeg) and a
        torrent's audio files that go with the video; `play` `direct` (the client switches it
        natively), `convert` (GET …/transcode with `audio` or `audioRef`), `none`. `subtitles`: the
        file's own streams (GET …/subtitles/embedded/{index}: a file on disk only, `available: false`
        while a torrent's file downloads), a torrent's subtitle files or a disk file's sidecars (GET
        …/subtitles/file/{track}); `play` `text`, `image` (PGS / VobSub: listed, can't be shown yet),
        `none`. Takes the device's lease like the other media routes.
      responses:
        '200':
          description: The tracks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaTracks' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/{ref}/subtitles/embedded/{index}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
      - { name: index, in: path, required: true, description: 'MediaTrack.index of a subtitle track with source embedded', schema: { type: integer, minimum: 0 } }
    get:
      tags: [media]
      operationId: getEmbeddedSubtitle
      summary: One of the file's own text subtitle streams as WebVTT (ffmpeg reads the whole file)
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`CONFLICT`: a torrent's file still downloading (ready when it finishes)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501':
          description: '`NOT_SUPPORTED`: a picture subtitle (PGS, VobSub)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: '`PROBE_FAILED`: ffmpeg could not read it'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: '`TRANSCODER_UNAVAILABLE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /media/{ref}/subtitles/file/{track}:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
      - { name: track, in: path, required: true, description: 'The track id without its `s:` (`f3` for `s:f3`)', schema: { type: string, pattern: '^f\d+$' } }
    get:
      tags: [media]
      operationId: getMediaSubtitleFile
      summary: "A subtitle file of the track list as WebVTT: a disk file's sidecar, or a torrent's file (fetched now, ≤ 10 MB)"
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501':
          description: '`NOT_SUPPORTED`: a VobSub (picture) file'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /media/{ref}/keepalive:
    parameters:
      - $ref: '#/components/parameters/MediaRef'
      - $ref: '#/components/parameters/Device'
      - $ref: '#/components/parameters/Profile'
    post:
      tags: [media]
      operationId: keepMedia
      summary: Refresh the calling device's lease (every minute while a player is open), with what it plays
      description: For a torrent's file, the same as `POST /torrents/{infoHash}/keepalive`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeepaliveRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── downloads ───────────────────────────────────────────────────────────────
  /downloads:
    get:
      tags: [downloads]
      operationId: listDownloads
      summary: Every torrent the server keeps, running or not (oldest first)
      responses:
        '200':
          description: Downloads
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Download' } }
    post:
      tags: [downloads]
      operationId: addDownload
      summary: Add a torrent to download to the end without a client (intent `download`)
      description: |
        Queued past `downloads.maxActive` running downloads. A torrent the server already keeps becomes a
        download (a paused one is queued again). JSON `{ link, files?, label?, paused? }`, or a .torrent as
        multipart `file` (with `files` as a JSON list, `label`, `paused`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDownloadRequest' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/x-bittorrent }
                files: { type: string, description: 'A JSON list of paths' }
                label: { type: string }
                paused: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Busy' }
  /downloads/preview:
    post:
      tags: [downloads]
      operationId: previewDownload
      summary: What a link or a .torrent is, before adding it (its name and files when known without the swarm)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: application/x-bittorrent }
      responses:
        '200':
          description: The torrent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadPreview' }
        '400': { $ref: '#/components/responses/Invalid' }
  /downloads/{infoHash}:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: getDownload
      summary: A download with its files (`files` null until the metadata has arrived)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [downloads]
      operationId: updateDownload
      summary: Its rules and label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                removeWhenWatched: { type: boolean, description: 'Delete it and its data once a player watched it to the end (90 %)' }
                label: { type: [string, 'null'], maxLength: 40, description: 'null or empty: no label' }
                queuePosition: { type: integer, minimum: 1, description: 'Move it to this place in the queue (a queued download; past the end = last)' }
                force:
                  type: boolean
                  description: 'true: force start (a download, started past downloads.maxActive); false: back under the queue''s rules. Pausing it ends a force start.'
                seedRatio: { type: [number, 'null'], minimum: 0, description: 'Its seeding goal (0 = stop once done); null: the server''s' }
                seedMinutes: { type: [integer, 'null'], minimum: 0, description: 'Its seeding goal in minutes; null: the server''s' }
                downLimitKBps: { type: [integer, 'null'], minimum: 0, description: 'Its download limit in KB/s (0 / null: none; engines with `torrentLimits`, else 501)' }
                upLimitKBps: { type: [integer, 'null'], minimum: 0, description: 'Its upload limit in KB/s (0 / null: none)' }
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [downloads]
      operationId: removeDownload
      summary: Forget a download, keeping or deleting its data (the only way data is deleted). Admin only.
      description: Its sessions end (open streams are closed).
      security:
        - adminSession: []
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, enum: [keep, delete] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/start:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: startDownload
      summary: Download it to the end without a client (intent `download`; queued when downloads.maxActive run)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/pause:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: pauseDownload
      summary: Stop its traffic (state `paused` until started again; data kept)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/files:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    put:
      tags: [downloads]
      operationId: selectDownloadFiles
      summary: Which files to download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: [array, 'null']
                  items: { type: string }
                  description: 'Paths inside the torrent; null = every file'
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /downloads/{infoHash}/peers:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: downloadPeers
      summary: The connected peers and the availability (admin; engines with `peerList`)
      security:
        - adminSession: []
      responses:
        '200':
          description: Its peers (none while it is stopped)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadPeers' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotSupported' }
  /downloads/{infoHash}/trackers:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: downloadTrackers
      summary: Its trackers, with their status where the engine knows it (admin; engines with `trackerList`)
      security:
        - adminSession: []
      responses:
        '200':
          description: Its trackers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTrackers' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotSupported' }
    post:
      tags: [downloads]
      operationId: editDownloadTrackers
      summary: Add or remove announce URLs (admin; adding needs `trackerEdit`, removing `trackerRemove`). Kept with the download.
      description: >-
        Added trackers are announced to now where the engine can, else from the torrent's next start; a removed one
        (its own, one the admin added, or one of the server's) is left out from its next start (torrent-stream and
        torrentd may still announce to it until then).
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                add: { type: array, minItems: 1, items: { type: string, pattern: '^(https?|udp)://' } }
                remove: { type: array, minItems: 1, items: { type: string } }
      responses:
        '200':
          description: Its trackers now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadTrackers' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotSupported' }
  /downloads/{infoHash}/recheck:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: recheckDownload
      summary: Verify every piece again (admin; a running torrent; engines with `recheck`)
      security:
        - adminSession: []
      responses:
        '200':
          description: The download (state `checking` while the engine verifies)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotSupported' }
  /downloads/{infoHash}/reannounce:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    post:
      tags: [downloads]
      operationId: reannounceDownload
      summary: Announce to its trackers now (admin; a running torrent no player reads; engines with `reannounce`)
      description: The engines that can do it restart the torrent's traffic for it, which would cut a player's stream (409 then).
      security:
        - adminSession: []
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Download' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotSupported' }
  /downloads/{infoHash}/torrent:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: exportDownloadTorrent
      summary: Its .torrent file, with its trackers (admin; once its metadata arrived)
      security:
        - adminSession: []
      responses:
        '200':
          description: The metainfo (attachment `<name>.torrent`)
          content:
            application/x-bittorrent:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /downloads/{infoHash}/pieces:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: downloadPieces
      summary: Its verified pieces, the selected files' piece ranges, and where players read now (admin)
      security:
        - adminSession: []
      responses:
        '200':
          description: Its pieces
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadPieces' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/{infoHash}/speed:
    parameters:
      - $ref: '#/components/parameters/InfoHash'
    get:
      tags: [downloads]
      operationId: downloadSpeed
      summary: The last 10 minutes of its speeds and connected peers, a sample every 2 s (admin)
      security:
        - adminSession: []
      responses:
        '200':
          description: Samples, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadSpeed' }
        '401': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── sessions ────────────────────────────────────────────────────────────────
  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: Every device's lease on a torrent, with what it plays (oldest first). Admin only.
      security:
        - adminSession: []
      responses:
        '401': { $ref: '#/components/responses/AdminRequired' }
        '200':
          description: Sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Session' } }
  /sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [sessions]
      operationId: stopSession
      summary: Stop a session (its streams are closed and its lease released). Admin only.
      security:
        - adminSession: []
      responses:
        '401': { $ref: '#/components/responses/AdminRequired' }
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── catalog ─────────────────────────────────────────────────────────────────
  /movies:
    get:
      tags: [catalog]
      operationId: listYtsMovies
      deprecated: true
      summary: Removed in API 2 (was YTS's movie list); answers 410
      responses:
        '410': { $ref: '#/components/responses/Gone' }
  /movies/{imdbId}:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getYtsMovie
      deprecated: true
      summary: Removed in API 2 (was YTS's movie details); answers 410. Torrents are `POST /play/sources`, the rating `/imdb/{imdbId}`
      responses:
        '410': { $ref: '#/components/responses/Gone' }
  # ── catalog (docs/providers-plan.md §7.1) ───────────────────────────────────
  /catalog:
    get:
      tags: [catalog]
      operationId: getCatalogInfo
      summary: Where the catalog comes from, its image base and language
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogInfo' }
  /catalog/genres/{mediaType}:
    parameters:
      - $ref: '#/components/parameters/MediaType'
    get:
      tags: [catalog]
      operationId: getCatalogGenres
      summary: The genres of movies or shows (ids for `discover`)
      responses:
        '200':
          description: Genres
          content:
            application/json:
              schema:
                type: object
                required: [genres]
                properties:
                  genres: { type: array, items: { $ref: '#/components/schemas/CatalogGenre' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/lists/{mediaType}/{list}:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - name: list
        in: path
        required: true
        description: 'Movies: popular, top_rated, now_playing, upcoming, trending. Shows: popular, top_rated, airing_today, on_the_air, trending (of the week)'
        schema: { type: string, enum: [popular, top_rated, now_playing, upcoming, airing_today, on_the_air, trending] }
      - $ref: '#/components/parameters/CatalogPage'
    get:
      tags: [catalog]
      operationId: getCatalogList
      summary: One of the provider's lists, a page at a time (cached 1 h)
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/discover/{mediaType}:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/CatalogPage'
      - { name: sort, in: query, schema: { type: string, enum: [popularity, rating, newest], default: popularity } }
      - { name: genres, in: query, description: 'Genre ids: `,` = all of them, `|` = any', schema: { type: string, pattern: '^\d+([,|]\d+)*$' } }
      - { name: withoutGenres, in: query, schema: { type: string, pattern: '^\d+([,|]\d+)*$' } }
      - { name: language, in: query, description: Original language (ISO 639-1), schema: { type: string, pattern: '^[a-z]{2}$' } }
      - { name: minVotes, in: query, schema: { type: integer, minimum: 0 } }
      - { name: minRating, in: query, description: 'Minimum score, 0–10', schema: { type: number, minimum: 0 } }
      - { name: from, in: query, description: 'Released (movies) / first aired (shows) on or after', schema: { type: string, format: date } }
      - { name: to, in: query, description: '…on or before', schema: { type: string, format: date } }
    get:
      tags: [catalog]
      operationId: discoverCatalog
      summary: Titles by filters (cached 1 h); never adult titles  # plugins-check: allow (titles left out of the catalog)
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/search/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        description: '`multi`: movies, shows and people together'
        schema: { type: string, enum: [multi, movie, tv, person] }
      - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      - $ref: '#/components/parameters/CatalogPage'
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Search (cached 1 h); never adult titles  # plugins-check: allow (titles left out of the catalog)
      responses:
        '200':
          description: A page of results (people only for `multi` and `person`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/titles/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [catalog]
      operationId: getCatalogTitle
      summary: A movie's / a show's page (cached 6 h)
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogDetails' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/titles/{mediaType}/{tmdbId}/credits:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [catalog]
      operationId: getCatalogCredits
      summary: Cast and crew of a title
      responses:
        '200':
          description: Credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCredits' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/titles/{mediaType}/{tmdbId}/similar:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
      - $ref: '#/components/parameters/CatalogPage'
    get:
      tags: [catalog]
      operationId: getCatalogSimilar
      summary: Titles like this one
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/titles/{mediaType}/{tmdbId}/extras:
    parameters:
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
      - $ref: '#/components/parameters/Profile'
    get:
      tags: [catalog]
      operationId: getCatalogExtras
      summary: What the server's metadata providers (plugins) add to a title's page, for a profile
      description: |
        Ratings, tags, links and meta-line items from plugins with `metadata.details` (or the older
        `metadata.title`, whose items come as `lines`), in the admin's order (Settings › Metadata),
        switched-off providers left out. Additions only: never the catalog's own fields. A provider
        that failed or was late is only left out (`errors`). Not cached: ask once per title and profile,
        again on `plugin.changed`.
      responses:
        '200':
          description: Additions, by provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogExtras' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/titles/tv/{tmdbId}/seasons/{season}:
    parameters:
      - $ref: '#/components/parameters/TmdbId'
      - { name: season, in: path, required: true, description: 0 = specials, schema: { type: integer, minimum: 0 } }
    get:
      tags: [catalog]
      operationId: getCatalogSeason
      summary: A season of a show and its episodes
      responses:
        '200':
          description: Season
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogSeason' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /catalog/people/{personId}/credits:
    parameters:
      - { name: personId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [catalog]
      operationId: getCatalogPersonCredits
      summary: A person's movies and shows, as cast (`character`) and crew (`job`)
      responses:
        '200':
          description: Credits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPersonCredits' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /imdb/{imdbId}:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getImdbRating
      summary: IMDb rating of a title (cached 6 h)
      responses:
        '200':
          description: Rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImdbRating' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /imdb/{imdbId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [catalog]
      operationId: getImdbEpisodes
      summary: IMDb ratings of a series, its seasons (mean of the rated episodes) and episodes
      responses:
        '200':
          description: Ratings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImdbSeries' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }

  # ── releases ────────────────────────────────────────────────────────────────
  /shows/{imdbId}/torrents:
    parameters:
      - $ref: '#/components/parameters/ImdbId'
    get:
      tags: [releases]
      operationId: findEpisodeTorrents
      deprecated: true
      summary: Removed in API 2 (was EZTV + TheRARBG); answers 410. An episode's torrents are `POST /play/sources`
      responses:
        '410': { $ref: '#/components/responses/Gone' }
  /play/sources:
    post:
      tags: [play]
      operationId: playSources
      summary: Every way to play a movie or an episode, best first
      description: |
        The play pipeline (docs/media-server-plan.md §6): library files of the title, the server's
        downloads of it, and torrents from the server's source plugins (their `play.collect`, ranked
        together; the server reads no torrent site of its own, so with none installed there are only files
        on this server), the same file found twice kept once. With the profile's `player.preferLocalFiles` (default on),
        files on this server that play come first, and `policy.autoplay` names the source to start
        without asking when it is the only one (or, with `player.autoplayKind` `server` / `stream`, the best
        of that group when it plays). `groups` sorts the sources into ways to play (server, stream,
        torrent: docs/providers-plan.md §5), each with its best source and how soon it plays: a client's
        Play shows those groups, not a flat list. A provider that fails or takes longer than its timeout
        (10 s) only drops its sources, named in `errors`. A kids profile gets no files of adults-only folders.
        Plugins (docs/plugins-plan.md §4.3) add sources (`plugin` HTTPS sources the server proxies, and
        torrents), mark torrents a service serves at once (badge `cached`, ranked before other torrents),
        reorder and hide sources (`hidden`, with the reason to show). Before playing the chosen source, ask
        `POST /play/start` with this answer's `request`; then play a source with a `ref` through
        `/media/{ref}` (no `POST /torrents`), a torrent through its `magnet`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaySourcesRequest' }
      responses:
        '200':
          description: Ranked sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaySources' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /play/start:
    post:
      tags: [play]
      operationId: playStart
      summary: What to play of the source the user chose (or the autoplay one)
      description: |
        Runs the plugins' `play.before` (one may ask a question first, or refuse) and, for a `cached`
        torrent, its service's `play.resolve` (the torrent becomes a `plugin` source with a `ref`; if the
        service fails, the torrent itself comes back with a note). `ask`: show the question with `yes` /
        `no`, and on yes ask again with `confirmed: true`. `refuse`: show the reason, play nothing. Without
        plugins the answer is always `play` with the source as listed. 404 when the sources answer is
        older than 30 min or the server restarted (ask `/play/sources` again).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request, source]
              properties:
                request: { type: string, description: 'The sources answer''s `request`' }
                source: { type: string, description: 'The chosen source''s `id`' }
                confirmed: { type: boolean, description: 'The user said yes to the question of an `ask` answer' }
      responses:
        '200':
          description: Play it, ask first, or refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayStart' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /play/markers:
    post:
      tags: [play]
      operationId: playMarkers
      summary: Intros, recaps, credits and chapters of what plays (plugins' `player.markers`)
      description: |
        Ask once the video's duration is known. Intro / recap: show "Skip intro" / "Skip recap" between
        `start` and `end` (seek to `end`); credits: start Up next at `start` instead of the last 40 s;
        chapters: marks on the timeline. Empty without plugins. Seconds of the file that plays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PlaySourcesRequest'
                - type: object
                  required: [duration]
                  properties:
                    duration: { type: number, exclusiveMinimum: 0, description: 'Seconds' }
                    fileName: { type: string, description: 'The file''s name, when known' }
                    size: { type: integer, minimum: 0, description: 'The file''s size in bytes, when known' }
      responses:
        '200':
          description: The markers, by start
          content:
            application/json:
              schema:
                type: object
                required: [markers]
                properties:
                  markers:
                    type: array
                    items:
                      type: object
                      required: [plugin, kind, start]
                      properties:
                        plugin: { type: string }
                        kind: { type: string, enum: [intro, recap, credits, chapter] }
                        start: { type: number }
                        end: { type: number, description: 'Credits may leave it out (until the end)' }
                        label: { type: string }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/notifications:
    get:
      tags: [plugins]
      operationId: takePluginNotifications
      summary: The profile's plugin notifications this device hasn't had yet
      description: |
        What plugins sent the profile with `notify.send` (kept 24 h, one per plugin and key), each answered once per device:
        show them as toasts. Ask when the app opens for a profile and on the event `plugin.notification` with its `profileId`.
      parameters:
        - { name: profile, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Its notifications, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications: { type: array, items: { $ref: '#/components/schemas/PluginNotification' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/meta:
    post:
      tags: [plugins]
      operationId: pluginTitleMeta
      deprecated: true
      summary: What plugins add to a title page (`metadata.title`); kept through API 2, use `GET /catalog/titles/{mediaType}/{tmdbId}/extras`
      description: |
        Up to 3 items per plugin: `text`, `chip`, `score` (0–10, `votes`, `label`), `seal`
        (`$defs/metaItem` of `@playpex/protocol/plugin-api.schema.json`). Plugins that fail or take longer
        than 3 s are left out. A kids profile gets nothing from `audience: adults` plugins.
      parameters:
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: object
                  description: '`$defs/titleRef`: kind movie / show / episode (tmdbId = the show''s) / video'
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [movie, show, episode, video] }
                    tmdbId: { type: integer, minimum: 1 }
                    imdbId: { type: string }
                    season: { type: integer, minimum: 0 }
                    episode: { type: integer, minimum: 1 }
                    title: { type: string }
                    year: { type: integer }
                profile: { type: string }
      responses:
        '200':
          description: Each plugin's items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginTitleMeta' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /live:
    get:
      tags: [live]
      operationId: listLiveProviders
      summary: The plugins with TV channels for a profile
      description: |
        Plugins with `live.channels` and `live.stream` the profile may use (a kids profile gets no `audience: adults`
        plugin). `channels` is how many the server holds (null until something asked for them).
      parameters:
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The live plugins
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/LiveProvider' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /live/{pluginId}/channels:
    get:
      tags: [live]
      operationId: listLiveChannels
      summary: A live plugin's channels
      description: |
        As the server keeps them (6 h, then refreshed in the background; at once after a change of the plugin's
        settings): numbered (channels without a number after the highest), one per id. `group` and `q` (words of the
        name, number or group) filter them; `groups` counts them all. A kids profile gets no channel with
        `audience: adults`. Logos: an https URL, or a path under the API prefix (the server fetches it).
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Profile'
        - { name: group, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Its channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveChannels' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
  /live/{pluginId}/guide:
    get:
      tags: [live]
      operationId: getLiveGuide
      summary: The programmes of some of a live plugin's channels
      description: |
        Up to 200 channels and 48 h. Programmes overlapping `from`…`to`, by channel then start. A plugin without
        `live.guide` answers none. Kept 15 min.
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Profile'
        - { name: channels, in: query, required: true, description: 'Channel ids, comma separated', schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: The programmes
          content:
            application/json:
              schema:
                type: object
                required: [from, to, programmes]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  programmes: { type: array, items: { $ref: '#/components/schemas/LiveProgramme' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
  /live/{pluginId}/channels/{channelId}/play:
    post:
      tags: [live]
      operationId: playLiveChannel
      summary: A channel's stream, now
      description: |
        Asks the plugin for the channel's stream (`live.stream`: IPTV addresses carry tokens that expire) and answers
        it as a media ref: `format` hls (play `<api>/media/{ref}/index.m3u8` with an HLS player) or live (a continuous
        Matroska stream at `<api>/media/{ref}`, remuxed by the server's ffmpeg). Live viewers count against
        `streaming.maxLive` (503 `BUSY` from the media routes); `DELETE /media/{ref}` frees the slot. Nothing is
        remembered: no resume point, history or progress.
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: channelId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: What to play
          content:
            application/json:
              schema:
                type: object
                required: [channel, source]
                properties:
                  channel: { $ref: '#/components/schemas/LiveChannel' }
                  source:
                    type: object
                    required: [kind, ref, format, label, live]
                    properties:
                      kind: { type: string, enum: [media] }
                      ref: { type: string }
                      format: { type: string, enum: [hls, live] }
                      label: { type: string }
                      live: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
  /live/{pluginId}/logos/{token}:
    get:
      tags: [live]
      operationId: getLiveLogo
      summary: A channel's logo, fetched by the server as the plugin (the path a channel's `logo` names)
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The image (PNG, JPEG, GIF, WebP or SVG; ≤ 1 MB)
          content:
            image/*: {}
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Error' }
  /plugins:
    get:
      tags: [plugins]
      operationId: listPlugins
      summary: The plugins a client renders for a profile
      description: |
        Enabled plugins and what they add (docs/plugins-plan.md §4.9, author guide docs/plugins/): menu sections,
        screens (core templates), slot contributions, accent. Never permissions, settings, links or states: setup
        is the dashboard's. A kids profile (`?profile=`) gets no `audience: adults` plugin. Refetch on the
        `plugin.changed` event. Asset paths in a plugin (`assets/…`) are served at `<api>{assets}<path under assets/>`.
      parameters:
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The plugins
          content:
            application/json:
              schema:
                type: object
                required: [plugins]
                properties:
                  plugins:
                    type: array
                    items: { $ref: '#/components/schemas/ClientPlugin' }
                  capabilities:
                    type: object
                    description: 'What the profile''s plugins provide (docs/providers-plan.md §5.3): hide Find releases without `releases`'
                    required: [releases, sources]
                    properties:
                      releases: { type: boolean, description: 'Some plugin lists releases (`releases.providers`)' }
                      sources: { type: boolean, description: 'Some plugin finds a title''s sources (`play.collect`)' }
                      live: { type: boolean, description: 'Some plugin has TV channels (`live.channels`): GET /live lists them' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/{pluginId}/data/{name}:
    post:
      tags: [plugins]
      operationId: callPluginData
      summary: A plugin's data handler, for a screen, a slot, a card or an action
      description: |
        Runs the plugin's handler in its sandbox with the caller's context (profile, device, locale). The answer's
        `data` is the model its template or slot expects (`$defs/templates`, `$defs/slots` of
        `@playpex/protocol/plugin-api.schema.json`); `effects` are what the client performs (open, play,
        toast, refresh, confirm, download), already checked against the plugin's permissions. A handler that
        fails, takes longer than 10 s or answers out of schema → 502 `PLUGIN_FAILED`. Rate limited per device
        and plugin (429 `TOO_MANY_ATTEMPTS`).
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' } }
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z][A-Za-z0-9]{0,39}$' } }
        - $ref: '#/components/parameters/Profile'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                args: { type: object, description: 'The handler''s arguments (a screen''s params, a call''s args, a page number)' }
                profile: { type: string, description: 'The profile (or ?profile=)' }
      responses:
        '200':
          description: The handler's answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginDataAnswer' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /plugins/{pluginId}/assets/{path}:
    get:
      tags: [plugins]
      operationId: getPluginAsset
      summary: A file of a plugin's assets/ (an icon, an image)
      description: SVG, PNG, JPEG or WebP only, `X-Content-Type-Options nosniff`, a CSP that runs no script.
      parameters:
        - { name: pluginId, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, description: 'Path under assets/ (may contain /)', schema: { type: string } }
      responses:
        '200':
          description: The file
          content:
            image/svg+xml: {}
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '404': { $ref: '#/components/responses/NotFound' }
  /library/home:
    get:
      tags: [media-library]
      operationId: getServerLibrary
      summary: What is on this server, for a profile
      description: |
        The server's media library as a client browses it (docs/media-server-plan.md §5.5): the movies and
        shows matched to TMDB (one entry per title, by title), the titles added last (20, newest first),
        and the folders that hold other videos (files not matched to a title, and every file of an `other`
        folder). Files missing or ignored never show. A kids profile (`?profile=`) never sees files of
        adults-only folders. Refetch on the `library.changed` event.
      parameters:
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibrary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/titles/{mediaType}/{tmdbId}:
    get:
      tags: [media-library]
      operationId: getServerLibraryTitle
      summary: Whether a movie, or which episodes of a show, are on this server
      description: |
        For "On this server" marks: the title's files that play (state ok), and for a show (`tv`) its
        episodes on this server. `fileCount` 0 = not on this server. Same audience rule as `/library/home`.
      parameters:
        - { name: mediaType, in: path, required: true, schema: { type: string, enum: [movie, tv] } }
        - { name: tmdbId, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The title's files on this server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibraryTitle' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /library/folders/{folderId}:
    get:
      tags: [media-library]
      operationId: browseServerLibraryFolder
      summary: One level of a folder's other videos
      description: |
        The subfolders that hold other videos (with how many, at any depth) and the videos right in it,
        in natural name order. `path` is a folder inside it from a previous answer (`folders[].path`,
        `parent`); none = the folder itself. Play a video by its `ref` (`/media/{ref}`). 404 for an
        unknown folder, one a kids profile doesn't see, or a path with no videos.
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: false, schema: { type: string }, description: 'A folder inside it, / separated' }
        - $ref: '#/components/parameters/Profile'
      responses:
        '200':
          description: The folder's level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLibraryFolder' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /releases/providers:
    get:
      tags: [releases]
      operationId: listReleaseProviders
      parameters:
        - $ref: '#/components/parameters/ReleaseKind'
      responses:
        '200':
          description: Sources for this kind, the default first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReleaseProvider' } }
        '400': { $ref: '#/components/responses/Invalid' }
  /releases/browse:
    get:
      tags: [releases]
      operationId: browseReleases
      summary: One source's releases, most seeded first
      parameters:
        - $ref: '#/components/parameters/ReleaseKind'
        - { name: provider, in: query, description: 'Source id (unknown → the kind''s default)', schema: { type: string } }
        - { name: q, in: query, description: 'Keywords, sent to the source as plain words ("Breaking.Bad" → "Breaking Bad")', schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Quality'
        - $ref: '#/components/parameters/Playable'
        - $ref: '#/components/parameters/Page'
        - { name: imdb, in: query, description: 'Optional IMDb id (a source may list that show''s torrents)', schema: { type: string } }
      responses:
        '200':
          description: A page of releases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }

  # ── search (docs/search-plan.md) ────────────────────────────────────────────
  /search/providers:
    get:
      tags: [search]
      operationId: listSearchProviders
      summary: The plugins that find streams and files by keywords (`sources.search`)
      responses:
        '200':
          description: Providers, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SearchProvider' } }
  /search/sources:
    get:
      tags: [search]
      operationId: searchSources
      summary: One provider's streams and files for keywords
      description: |
        Its sources get media refs (`r_…` files, `h_…` HLS) the server proxies, and torrents the server's trackers; `matches`
        says whether a result's name holds every keyword. Refs live an hour after their last use.
      parameters:
        - { name: provider, in: query, required: true, description: 'A provider id (`plugin:<id>`)', schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: kind, in: query, schema: { type: string, enum: [movie, show, any], default: any } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSourcePage' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/Upstream' }
  /admin/links/inspect:
    post:
      tags: [search]
      operationId: inspectLink
      summary: What a URL is, and what it links to (the server reads it)
      description: |
        A magnet isn't fetched. Anything else is, by the server, at public addresses only (every redirect checked again):
        a .torrent, a video file, an HLS playlist, or a web page whose magnets, .torrent links, video files and HLS playlists
        are listed. Videos and playlists get media refs to play or download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: What it is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkInspection' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /downloads/direct:
    get:
      tags: [downloads]
      operationId: listDirectDownloads
      summary: Files downloaded over HTTP (not torrents), newest first
      responses:
        '200':
          description: Direct downloads
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DirectDownload' } }
    post:
      tags: [downloads]
      operationId: addDirectDownload
      summary: Download a stream or a file the server proxies (a media ref from search, a link or Play)
      description: |
        `ref`: an `r_…` (a file: HTTP with ranges, resumed after a pause or a restart) or an `h_…` (an HLS stream, saved by
        ffmpeg). Into the download folder (`<name>.part` until complete). Two run at a time, the rest wait.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ref]
              properties:
                ref: { type: string }
                name: { type: string, maxLength: 200, description: 'The file name (else the source''s)' }
                paused: { type: boolean }
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectDownload' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/direct/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [downloads]
      operationId: removeDirectDownload
      summary: Stop and forget it; `files=1` also deletes its file
      parameters:
        - { name: files, in: query, schema: { type: string, enum: ['0', '1'] } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/direct/{id}/start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [downloads]
      operationId: startDirectDownload
      summary: Start (or queue) a paused or failed one
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectDownload' }
        '404': { $ref: '#/components/responses/NotFound' }
  /downloads/direct/{id}/pause:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [downloads]
      operationId: pauseDirectDownload
      summary: Pause it (a file resumes where it stopped; an HLS stream starts again)
      responses:
        '200':
          description: The download
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectDownload' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── subtitles ───────────────────────────────────────────────────────────────
  /subtitles/providers:
    get:
      tags: [subtitles]
      operationId: listSubtitleProviders
      responses:
        '200':
          description: Providers, in the player's tab order (first enabled = default)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SubtitleProvider' } }
  /subtitles/search:
    get:
      tags: [subtitles]
      operationId: searchSubtitles
      parameters:
        - { name: provider, in: query, description: 'Provider id (default first enabled)', schema: { type: string } }
        - { name: imdb_id, in: query, required: true, schema: { type: string, pattern: '^tt\d+$' } }
        - { name: season, in: query, schema: { type: integer } }
        - { name: episode, in: query, schema: { type: integer } }
        - { name: languages, in: query, description: 'Comma-separated ISO 639-1 codes, e.g. en,ar', schema: { type: string } }
      responses:
        '200':
          description: Subtitles found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubtitleSearch' }
        '400': { $ref: '#/components/responses/Invalid' }
        '502': { $ref: '#/components/responses/Upstream' }
  /subtitles/file:
    get:
      tags: [subtitles]
      operationId: getSubtitleFile
      summary: A subtitle as WebVTT (for `<track>`)
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: ref, in: query, required: true, description: '`ref` from the search; validated by the provider', schema: { type: string } }
        - { name: lang, in: query, schema: { type: string } }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt: { schema: { type: string } }
        '502': { $ref: '#/components/responses/Upstream' }

  /subtitles/convert:
    post:
      tags: [subtitles]
      operationId: convertSubtitle
      summary: A subtitle file the client has (SRT, ASS / SSA, WebVTT; ≤ 10 MB) as WebVTT
      description: The file's bytes as the body (any content type); old SRTs in a Windows code page are read with `lang`'s.
      parameters:
        - { name: lang, in: query, schema: { type: string }, description: 'Its language (ISO 639-1), for old code pages' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: WebVTT
          content:
            text/vtt: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Invalid' }
        '501':
          description: '`NOT_SUPPORTED`: not a text subtitle'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── profiles ────────────────────────────────────────────────────────────────
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      responses:
        '200':
          description: Profiles of this server ("Who's watching?")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileList' }
    post:
      tags: [profiles]
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileCreate' }
      responses:
        '201':
          description: The new profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Error' }
  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [profiles]
      operationId: getProfile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [profiles]
      operationId: updateProfile
      summary: Update (`preferences`, deprecated, is ignored)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [profiles]
      operationId: deleteProfile
      summary: Delete the profile and all its data
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/unlock:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [profiles]
      operationId: unlockProfile
      summary: Pick the profile (PIN if it has one); records it as last used
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, pattern: '^\d{4,6}$' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
  /profiles/{profileId}/pin:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [profiles]
      operationId: setProfilePin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: [string, 'null'], pattern: '^\d{4,6}$', description: 'null removes the lock' }
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }

  /profiles/{profileId}/settings:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      tags: [settings]
      operationId: updateProfileSettings
      summary: Change some of the profile's settings
      description: |
        Profile-scoped keys only (`subtitles.provider`, `player.autoplayNext`, `player.preferLocalFiles`, `player.autoplayKind`, `player.audioLanguage`, `player.subtitleLanguage`, `player.subtitleForcedOnly`, or
        `client.<clientId>.<name>`). `null` resets a key to its default. All or nothing: one bad key
        refuses the whole patch (`INVALID`, with `errors`). Publishes `settings.changed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: The profile's effective settings, after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── settings ────────────────────────────────────────────────────────────────
  /settings:
    get:
      tags: [settings]
      operationId: getUserSettings
      summary: The calling device's settings, and a profile's
      description: |
        Every registered key with its effective value (stored, else the default), so clients
        never hard-code defaults. Plus the `client.*` values stored for this device / profile.
        The device is the one the token names (paired clients), else `X-Playpex-Device` /
        `?device=` (clients on the server machine); without one → `DEVICE_REQUIRED`.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
        - name: profile
          in: query
          required: false
          description: A profile id; without it `profile` is null
          schema: { type: string }
        - name: definitions
          in: query
          required: false
          description: '`1` adds the registry (`definitions`), for clients that don''t bundle @playpex/protocol'
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettings' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings/device:
    patch:
      tags: [settings]
      operationId: updateDeviceSettings
      summary: Change some of the calling device's settings
      description: |
        Device-scoped keys only (`display.*`, `player.volume`, `subtitles.size`, or
        `client.<clientId>.<name>`). `null` resets a key. All or nothing. Publishes `settings.changed`.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSettingsPatch' }
      responses:
        '200':
          description: The device's effective settings, after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [settings]
      operationId: resetDeviceSettings
      summary: Reset every setting of the calling device (its rows are deleted)
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
        - $ref: '#/components/parameters/Device'
      responses:
        '200':
          description: The device's effective settings (the defaults)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSettingValues' }
        '400': { $ref: '#/components/responses/Invalid' }

  # ── library ─────────────────────────────────────────────────────────────────
  /profiles/{profileId}/library:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: getLibrary
      summary: Everything the Watch list page shows, in one call
      responses:
        '200':
          description: Library
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watchlist:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: listWatchlist
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Watch list, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/WatchlistItem' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watchlist/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: inWatchlist
      responses:
        '200':
          description: Whether the title is on the watch list
          content:
            application/json:
              schema:
                type: object
                required: [inWatchlist]
                properties:
                  inWatchlist: { type: boolean }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [library]
      operationId: addToWatchlist
      summary: Add (idempotent)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Artwork' }
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItem' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [library]
      operationId: removeFromWatchlist
      responses:
        '200': { $ref: '#/components/responses/Removed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/progress/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: getProgress
      summary: Where to resume (null under 5 % or once finished)
      parameters:
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/Episode'
      responses:
        '200':
          description: Resume point
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressState' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [library]
      operationId: saveProgress
      summary: Save the playback position (finished at ≥ 90 %; the first finish is added to the history)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProgressRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveProgressResult' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/progress/{mediaType}/{tmdbId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    get:
      tags: [library]
      operationId: getEpisodesProgress
      summary: Progress of every episode of a show (or of the movie)
      responses:
        '200':
          description: Per-episode progress
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EpisodeProgress' } }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/watched/{mediaType}/{tmdbId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/MediaType'
      - $ref: '#/components/parameters/TmdbId'
    put:
      tags: [library]
      operationId: markWatched
      summary: Mark as watched without playing (logged in the history)
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Artwork'
                - type: object
                  properties:
                    season: { type: integer }
                    episode: { type: integer }
                    durationS: { type: number }
      responses:
        '200':
          description: The progress row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressRow' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [library]
      operationId: markUnwatched
      summary: Forget the progress (the history is kept)
      parameters:
        - $ref: '#/components/parameters/Season'
        - $ref: '#/components/parameters/Episode'
      responses:
        '200': { $ref: '#/components/responses/Removed' }
        '400': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/NotFound' }
  /profiles/{profileId}/history:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [library]
      operationId: getHistory
      parameters:
        - { name: mediaType, in: query, schema: { $ref: '#/components/schemas/MediaType' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Finished views, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── trailers ────────────────────────────────────────────────────────────────
  /youtube/{videoId}:
    parameters:
      - { name: videoId, in: path, required: true, schema: { type: string, pattern: '^[\w-]{11}$' } }
    get:
      tags: [trailers]
      operationId: streamTrailer
      summary: A YouTube trailer, proxied with byte ranges. Currently stops after ~1 MB (YouTube attestation).
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [video, audio] } }
        - { name: quality, in: query, description: 'YouTube itag', schema: { type: string } }
        - { name: Range, in: header, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Media' }
        '206': { $ref: '#/components/responses/Media' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416': { description: 'Range not satisfiable' }

components:
  parameters:
    InfoHash:
      name: infoHash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{40}$' }
    Device:
      name: device
      in: query
      required: false
      description: |
        The calling device, for local clients (no token) and media URLs that can't carry the
        `X-Playpex-Device` header. Letters, digits and `._:-`, up to 64. Without either, the server
        uses the client's address. Ignored for paired devices (their token names them).
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    DeviceHeader:
      name: X-Playpex-Device
      in: header
      required: false
      description: The calling device's own id (`deviceId` of the client), for clients that aren't paired
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
    UserCode:
      name: code
      in: path
      required: true
      description: The code the device shows; case and dashes don't matter
      schema: { type: string }
    ClientHeader:
      name: X-Playpex-Client
      in: header
      required: false
      description: '`<name>/<version>; api=<n>` — shown to the admin next to the pairing request'
      schema: { type: string }
    MediaRef:
      name: ref
      in: path
      required: true
      description: A media ref from the server (`TorrentFile.ref`, …); opaque (`@playpex/protocol` MEDIA_REF_PATTERN)
      schema: { type: string, pattern: '^(t_[0-9a-f]{40}_[0-9a-f]{16}|f_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|r_[0-9a-f]{32}|h_[0-9a-f]{32}|l_[0-9a-f]{32})$' }
    Profile:
      name: profile
      in: query
      required: false
      description: The profile watching (files of adults-only library folders are refused to kids profiles)
      schema: { type: string }
    FilePath:
      name: path
      in: path
      required: true
      description: The file's `path`, URL-encoded (it may contain slashes)
      schema: { type: string }
    ImdbId:
      name: imdbId
      in: path
      required: true
      schema: { type: string, pattern: '^tt\d+$' }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string }
    MediaType:
      name: mediaType
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MediaType' }
    TmdbId:
      name: tmdbId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Season:
      name: season
      in: query
      description: Episodes only
      schema: { type: integer, minimum: 0 }
    Episode:
      name: episode
      in: query
      description: Episodes only
      schema: { type: integer, minimum: 0 }
    ReleaseKind:
      name: kind
      in: query
      required: true
      schema: { type: string, enum: [movie, tv] }
    Quality:
      name: quality
      in: query
      description: SD also keeps 480p
      schema: { type: string, enum: ['2160p', '1080p', '720p', SD] }
    Playable:
      name: playable
      in: query
      description: '1 / true: only releases the TV app can play (video and audio)'
      schema: { type: string, enum: ['1', 'true', '0', 'false'] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    CatalogPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 1 }

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: A paired device's token (from POST /auth/device/token)
    accessTokenParam:
      type: apiKey
      in: query
      name: access_token
      description: The same token, for media elements that can't set headers
    adminSession:
      type: apiKey
      in: cookie
      name: playpex.session_token
      description: The admin's session (POST /auth/sign-in/username), HttpOnly

  responses:
    AdminRequired:
      description: Not signed in as the admin (`ADMIN_REQUIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthError:
      description: RFC 8628 / RFC 6749 error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
    BetterAuthError:
      description: Better Auth's error shape
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              code: { type: string }
    RateLimited:
      description: Too many requests from this address; wait (see `X-Retry-After`)
      content:
        application/json:
          schema: { type: object }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Bad parameters or body (`INVALID`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: Removed in a newer API version (`GONE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Upstream:
      description: A provider failed (`UPSTREAM`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not in a state that allows it (`CONFLICT`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotSupported:
      description: This server can't (`NOT_SUPPORTED`), e.g. the running torrent engine doesn't report it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Busy:
      description: A server limit is reached (`BUSY`); try again later
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { const: true }
    Removed:
      description: Whether something was removed
      content:
        application/json:
          schema:
            type: object
            required: [removed]
            properties:
              removed: { type: boolean }
    Media:
      description: Media bytes (the whole file, or the requested range with 206)
      content:
        video/*: {}
        audio/*: {}
        application/octet-stream: {}

  schemas:
    ClientPlugin:
      type: object
      description: A plugin as clients render it (its manifest's `contributes`, docs/plugins/manifest.md)
      required: [id, name, version, audience, icon, assets, sections, screens, slots, chrome]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        audience: { type: string, enum: [everyone, adults] }
        icon: { type: [string, 'null'], description: 'assets/… of the package' }
        assets: { type: string, description: 'Where its assets are, under the API prefix: /plugins/<id>/assets/' }
        play: { type: boolean, description: 'It may hand play requests to the core (permissions.play): its releases screens play what is selected' }
        sections:
          type: array
          items:
            type: object
            required: [screen, menu]
            properties:
              screen: { type: string }
              menu: { type: object, required: [label, icon], properties: { label: { type: string }, icon: { type: string }, order: { type: integer } } }
        screens:
          type: array
          items:
            type: object
            required: [name, template]
            properties:
              name: { type: string }
              template: { type: string, enum: [catalog, title, releases, list, guide], description: 'guide: the plugin''s channels (GET /live/{pluginId}/channels) and programmes, drawn by the client' }
              data: { type: string }
              title: { type: string }
              params: { type: array, items: { type: string } }
        slots:
          type: array
          items:
            type: object
            required: [slot, data]
            properties:
              slot: { type: string }
              data: { type: string }
              order: { type: integer }
        chrome:
          oneOf:
            - { type: 'null' }
            - { type: object, properties: { accent: { type: string, enum: [adult] } } }   # plugins-check: allow (the accent token's name)
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: 'Message for people (may change)' }
        errors: { type: array, items: { type: string }, description: 'Some INVALID answers (settings): one message per bad field' }
        code:
          type: string
          description: Stable code (HTTP status in parentheses)
          enum:
            - INVALID                  # 400
            - DEVICE_REQUIRED          # 400
            - PAIRING_REQUIRED         # 401
            - ADMIN_REQUIRED           # 401
            - FORBIDDEN                # 403
            - HOST_NOT_ALLOWED         # 403
            - ORIGIN_NOT_ALLOWED       # 403
            - NOT_FOUND                # 404
            - CONFLICT                 # 409
            - GONE                     # 410
            - CLIENT_TOO_OLD           # 426
            - SERVER_TOO_OLD           # 426
            - TOO_MANY_ATTEMPTS        # 429
            - INTERNAL                 # 500
            - NOT_SUPPORTED            # 501
            - BUSY                     # 503
            - UPSTREAM                 # 502
            - PROBE_FAILED             # 502
            - PLUGIN_FAILED            # 502
            - PROVIDER_NOT_CONFIGURED  # 503
            - TRANSCODER_UNAVAILABLE   # 503

    ServerInfo:
      type: object
      required: [id, name, version, apiVersion, minApiVersion, auth, features]
      properties:
        id: { type: string, description: 'Stable server id (UUID); identify servers by it, not by address' }
        name: { type: string }
        version: { type: string, description: 'Server software version' }
        apiVersion: { type: integer }
        minApiVersion: { type: integer }
        auth: { type: string, enum: [none, pairing] }
        features:
          type: object
          required: [transcode, subtitles]
          properties:
            transcode: { type: boolean, description: 'ffmpeg available (audio transcoding)' }
            subtitles: { type: array, items: { type: string }, description: 'Enabled subtitle provider ids' }

    # ── torrents
    AddTorrentRequest:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 'Magnet link, .torrent URL, or a bare 32/40-character info hash' }
    InfoHash:
      type: object
      required: [infoHash]
      properties:
        infoHash: { type: string }
    Torrent:
      type: object
      required: [infoHash]
      description: Everything but `infoHash` is missing until the metadata has arrived
      properties:
        infoHash: { type: string }
        name: { type: string }
        length: { type: number, description: 'Bytes' }
        state: { $ref: '#/components/schemas/DownloadState' }
        interested: { type: boolean, description: 'Running and still downloading' }
        ready: { type: boolean, description: 'Files can be streamed now (running and checked, or completed on disk)' }
        files: { type: array, items: { $ref: '#/components/schemas/TorrentFile' } }
        chosen: { type: [string, 'null'], description: "The path of the file to play (GET /torrents/{infoHash}'s query: an episode, a plugin's hint); null: no video fits" }
        progress: { type: array, items: { type: number }, description: 'Piece runs in percent, alternating downloaded / missing, starting with downloaded' }
    MediaTrack:
      type: object
      required: [id]
      description: 'One track of GET /media/{ref}/tracks (video, audio or subtitles: the fields that apply)'
      properties:
        id: { type: string, description: "'v:0' this file, 'v:f<i>' another video of the torrent, 'a:<n>' / 's:<n>' the file's own n-th audio / subtitle stream, 'a:f<i>' / 's:f<i>' a separate file (the i-th of the torrent, or of a disk file's sidecars)" }
        source: { type: string, enum: [embedded, file] }
        ref: { type: string, description: "A video's, or a separate file's in a torrent: its media ref" }
        name: { type: string, description: 'Its path in the torrent / folder' }
        size: { type: [number, 'null'] }
        current: { type: boolean, description: 'Video: the file this list is for' }
        kind: { type: string, enum: [episode, extra, video], description: "Another video: an episode of the pack, an extra or sample, another film" }
        index: { type: integer, description: 'Embedded: the stream index among its kind (transcode ?audio=, subtitles/embedded/{index})' }
        language: { type: [string, 'null'], description: 'ISO 639-1 when known' }
        languageName: { type: [string, 'null'] }
        codec: { type: [string, 'null'] }
        channels: { type: [integer, 'null'] }
        title: { type: [string, 'null'] }
        default: { type: boolean }
        forced: { type: boolean }
        sdh: { type: boolean }
        play: { type: string, enum: [direct, convert, text, image, none] }
        available: { type: boolean, description: 'Subtitles: can be fetched now' }
        note: { type: string }
    MediaTracks:
      type: object
      required: [video, audio, subtitles, probed]
      properties:
        video: { type: array, items: { $ref: '#/components/schemas/MediaTrack' } }
        audio: { type: array, items: { $ref: '#/components/schemas/MediaTrack' } }
        subtitles: { type: array, items: { $ref: '#/components/schemas/MediaTrack' } }
        probed: { type: boolean, description: "false: the file's own streams aren't known (no ffmpeg, or ffprobe failed)" }
    KeepaliveRequest:
      type: object
      description: What the player plays, all optional (shown in the server's Activity)
      properties:
        positionS: { type: number, description: 'Playback position, seconds' }
        durationS: { type: number }
        paused: { type: boolean }
        title: { type: string, maxLength: 300, description: 'For people, e.g. "Breaking Bad · S02E05"' }
        profileId: { type: string }
        file: { type: string, description: 'Path of the file in the torrent' }
        media:
          type: object
          description: 'Which title it is (TMDB): kept with the download, so the server knows what it holds'
          required: [mediaType, tmdbId]
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 0 }
    Session:
      type: object
      required: [id, deviceId, deviceName, paired, client, address, infoHash, ref, torrentName, file, method, streaming, since, lastActivity, playback, torrent]
      properties:
        id: { type: string }
        deviceId: { type: string, description: 'A paired device''s id, else what a local client named itself (or addr:<ip>)' }
        deviceName: { type: [string, 'null'], description: 'Paired devices: the name it gave itself / the admin gave it' }
        paired: { type: boolean }
        client: { type: [string, 'null'], description: '<name>/<version> from X-Playpex-Client' }
        address: { type: string }
        infoHash: { type: [string, 'null'], description: 'The torrent held; null for a file on disk' }
        ref: { type: [string, 'null'], description: 'Media ref of the file last streamed (null before the first stream)' }
        torrentName: { type: [string, 'null'], description: 'null until the metadata has arrived, and for a file on disk' }
        file: { type: [string, 'null'], description: 'Path of the file being played (in the torrent, or in its library folder)' }
        method: { type: [string, 'null'], enum: [direct, audio-transcode, hls, hls-transcode, live, null], description: 'hls: a plugin''s HLS stream through the server''s proxy; hls-transcode: an HLS stream the server makes from the file (GET /media/{ref}/playback); live: a continuous stream remuxed by ffmpeg' }
        streaming: { type: boolean, description: 'A media response is open right now' }
        since: { type: string, format: date-time }
        lastActivity: { type: string, format: date-time }
        playback:
          type: [object, 'null']
          description: The player's last keepalive
          properties:
            positionS: { type: number }
            durationS: { type: number }
            paused: { type: boolean }
            title: { type: string }
            profileId: { type: string }
            file: { type: string }
            updatedAt: { type: string, format: date-time }
        torrent:
          type: [object, 'null']
          description: The swarm; null once the torrent has stopped
          required: [peers, downloadSpeed, uploadSpeed, downloaded, length]
          properties:
            peers: { type: integer }
            downloadSpeed: { type: number, description: 'Bytes per second' }
            uploadSpeed: { type: number }
            downloaded: { type: number, description: 'Bytes' }
            length: { type: [number, 'null'], description: 'Bytes; null until the metadata has arrived' }
    DownloadState:
      type: string
      enum: [queued, downloading, seeding, checking, paused, completed, error]
      description: |
        Running: `downloading`, `seeding`, `checking` (the engine verifies data already on disk). Stopped
        (no traffic, data kept): `queued` (waits for room), `paused`, `completed` (every selected file is
        done), `error`.
    Download:
      type: object
      description: A torrent the server keeps (docs/media-server-plan.md §4)
      required: [infoHash, name, state, intent, error, sizeBytes, doneBytes, progress, uploadedBytes, ratio,
        downloadSpeed, uploadSpeed, peers, seeds, eta, checking, fileCount, selectedFiles, title, addedBy,
        profileId, removeWhenWatched, label, queuePosition, forced, seedRatio, seedMinutes, downLimitKBps, upLimitKBps,
        swarm, pieceMap, savePath, addedAt, completedAt, lastActiveAt]
      properties:
        infoHash: { type: string }
        name: { type: [string, 'null'], description: 'null until the metadata has arrived' }
        state: { $ref: '#/components/schemas/DownloadState' }
        intent:
          type: string
          enum: [stream, download]
          description: '`stream`: a client plays it, it pauses when the last one leaves; `download`: it runs to the end without clients'
        error: { type: [string, 'null'] }
        sizeBytes: { type: [number, 'null'], description: 'Of the selected files; null until the metadata has arrived' }
        doneBytes: { type: number }
        progress: { type: [number, 'null'], description: '0 to 1' }
        uploadedBytes: { type: number, description: 'Since it was added' }
        ratio: { type: [number, 'null'], description: 'uploadedBytes / sizeBytes' }
        downloadSpeed: { type: number, description: 'Bytes per second' }
        uploadSpeed: { type: number }
        peers: { type: integer }
        seeds: { type: integer }
        eta: { type: [integer, 'null'], description: 'Seconds' }
        checking: { type: [number, 'null'], description: 'Progress (0 to 1) of the check of the data on disk' }
        fileCount: { type: [integer, 'null'] }
        selectedFiles: { type: [array, 'null'], items: { type: string }, description: 'null = every file' }
        title:
          type: [object, 'null']
          description: 'The title a player said it is (keepalive `media`)'
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer }
            season: { type: integer }
            episode: { type: integer }
            title: { type: string }
        addedBy: { type: [string, 'null'], description: 'A device id, or `admin`' }
        profileId: { type: [string, 'null'] }
        removeWhenWatched: { type: boolean }
        label: { type: [string, 'null'], description: 'The admin''s label (free text)' }
        queuePosition: { type: [integer, 'null'], minimum: 1, description: 'Its place in the download queue (state `queued`)' }
        forced: { type: boolean, description: 'Force started: runs past downloads.maxActive (not past streaming.maxTorrents or Pause all)' }
        seedRatio: { type: [number, 'null'], description: 'Its own seeding goal (ratio); null: the server''s downloads.seedRatio' }
        seedMinutes: { type: [integer, 'null'], description: 'Its own seeding goal (minutes); null: the server''s downloads.seedMinutes' }
        downLimitKBps: { type: [integer, 'null'], description: 'Its own download speed limit (engines with `torrentLimits`); null: none' }
        upLimitKBps: { type: [integer, 'null'], description: 'Its own upload speed limit; null: none' }
        swarm:
          type: [object, 'null']
          description: 'The whole swarm as its trackers count it (a scrape: the most any tracker answered); null before one answered'
          required: [seeds, peers, at]
          properties:
            seeds: { type: integer }
            peers: { type: integer, description: 'Leechers' }
            at: { type: string, format: date-time }
        pieceMap:
          type: [string, 'null']
          description: >-
            The torrent's pieces in up to 100 slices, each byte the share of its pieces verified (0–255), base64
            (the last ones the engine reported while it is stopped); null when not known
        savePath: { type: string, description: 'Where its files are on the server' }
        addedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        lastActiveAt: { type: [string, 'null'], format: date-time }
    DownloadDetail:
      allOf:
        - $ref: '#/components/schemas/Download'
        - type: object
          required: [files]
          properties:
            files:
              type: [array, 'null']
              items:
                type: object
                required: [name, path, ref, size, offset, selected, doneBytes]
                properties:
                  name: { type: string }
                  path: { type: string }
                  ref: { type: string, description: 'Media ref (GET /media/{ref})' }
                  size: { type: number }
                  offset: { type: number }
                  selected: { type: boolean }
                  doneBytes: { type: [number, 'null'], description: 'Verified bytes of this file; null when unknown (stopped and not completed)' }
    AddDownloadRequest:
      type: object
      required: [link]
      properties:
        link: { type: string, description: 'Magnet link, a bare 40-character info hash, or an http(s) .torrent URL' }
        files: { type: array, items: { type: string }, description: 'Paths to download (default: every file)' }
        media:
          type: object
          description: 'Which title it is (TMDB): the download''s `title`, so a client finds it again from that title''s page'
          required: [mediaType, tmdbId]
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 0 }
        title: { type: string, maxLength: 300, description: 'For people, e.g. "Breaking Bad · S02E05"' }
        profileId: { type: string }
        label: { type: string, maxLength: 40, description: 'The download''s label' }
        paused: { type: boolean, description: 'Add it paused (it waits until started)' }
    StoragePlaces:
      type: object
      required: [places]
      properties:
        places:
          type: array
          items:
            type: object
            required: [id, name, kind, root, bytes, measuring, disk, status]
            properties:
              id: { type: string, description: '`downloads`, or `folder:<library folder id>`' }
              name: { type: string }
              kind: { type: string, enum: [downloads, movies, shows, mixed, other] }
              root: { type: string, description: 'Its real path on the server' }
              bytes: { type: [number, 'null'], description: 'On disk; null until it is measured' }
              measuring: { type: boolean }
              disk:
                type: [object, 'null']
                required: [free, total]
                properties:
                  free: { type: number }
                  total: { type: number }
              status: { type: string, enum: [online, offline], description: 'offline: its folder isn''t there (an unplugged drive, a share)' }
    StorageEntry:
      type: object
      required: [type, name, path, bytes, items, modifiedAt, what, ref, fileId, media, titles, quality, duration, download]
      properties:
        type: { type: string, enum: [folder, file] }
        name: { type: string }
        path: { type: string, description: 'Inside the place' }
        bytes: { type: [number, 'null'], description: 'A file''s size; a folder''s total on disk (null while measuring)' }
        onDisk: { type: [number, 'null'], description: 'A file''s allocated bytes (a sparse download holds less)' }
        items: { type: [integer, 'null'], description: 'A folder''s files and folders' }
        modifiedAt: { type: [string, 'null'], format: date-time }
        what:
          type: [object, 'null']
          description: What the file is to Playpex
          required: [kind, text]
          properties:
            kind: { type: string, enum: [matched, unmatched, ignored, missing, downloading, subtitles, video, other] }
            text: { type: string }
        ref: { type: [string, 'null'], description: 'A media ref to play it (a library file, a download''s video)' }
        fileId: { type: [string, 'null'], description: 'Its library file (the Library page''s ?file=)' }
        media:
          description: |
            What it is: a matched file's title (an episode: its show, season and episode), or a folder's
            when every matched file under it is one title (a movie's folder, a show's, a season's; `episodes`:
            how many episode files). null otherwise
          oneOf:
            - type: 'null'
            - type: object
              required: [mediaType, tmdbId, title, year, season, episode, episodeTitle, posterPath, stillPath]
              properties:
                mediaType: { $ref: '#/components/schemas/MediaType' }
                tmdbId: { type: integer, description: 'The movie''s, or the show''s' }
                title: { type: [string, 'null'] }
                year: { type: [integer, 'null'] }
                season: { type: [integer, 'null'] }
                episode: { type: [integer, 'null'] }
                episodeTitle: { type: [string, 'null'] }
                posterPath: { type: [string, 'null'], description: 'TMDB image path (the show''s for an episode)' }
                stillPath: { type: [string, 'null'], description: 'An episode''s still' }
                episodes: { type: [integer, 'null'], description: 'A folder''s: episode files under it' }
        titles: { type: [integer, 'null'], description: 'A folder''s: how many titles its matched files are' }
        quality: { type: [string, 'null'], description: 'A library file''s: 2160p, 1080p, 720p… (ffprobe, else its name)' }
        duration: { type: [number, 'null'], description: 'A library file''s, in seconds (ffprobe)' }
        download:
          type: [object, 'null']
          description: The download whose data it is
          required: [infoHash, active]
          properties:
            infoHash: { type: string }
            active: { type: boolean }
    StorageListing:
      type: object
      required: [place, path, parent, bytes, measuring, search, entries]
      properties:
        place: { type: string }
        path: { type: string }
        parent: { type: [string, 'null'] }
        bytes: { type: [number, 'null'] }
        measuring: { type: boolean }
        search: { type: [string, 'null'] }
        entries: { type: array, items: { $ref: '#/components/schemas/StorageEntry' } }
    MediaPlayback:
      type: object
      required: [method, url, start, duration, audio, notes, title, download]
      properties:
        method: { type: string, enum: [direct, hls, none] }
        title:
          type: [object, 'null']
          description: 'What it is (a library file''s match, the title a download was played as): where a player saves progress for a profile'
          required: [mediaType, tmdbId, season, episode, title, posterPath]
          properties:
            mediaType: { $ref: '#/components/schemas/MediaType' }
            tmdbId: { type: integer, description: 'The movie''s, or the show''s' }
            season: { type: [integer, 'null'] }
            episode: { type: [integer, 'null'] }
            title: { type: [string, 'null'] }
            posterPath: { type: [string, 'null'] }
        download:
          type: [object, 'null']
          description: 'A torrent''s file: which (GET /downloads/{infoHash}/pieces draws what is downloaded); null for a file on disk'
          required: [infoHash, path]
          properties:
            infoHash: { type: string }
            path: { type: string }
        fileId: { type: [string, 'null'], description: 'A library file''s id' }
        url: { type: [string, 'null'], description: 'Under the API prefix: GET /media/{ref} (direct), or the HLS playlist (hls); null for none' }
        start: { type: number, description: 'hls: the time of the file the stream starts at (seconds)' }
        duration: { type: [number, 'null'] }
        audio: { type: integer, description: 'The sound track played' }
        notes: { type: array, items: { type: string }, description: 'What the server does, or why it can''t play here, in words' }
    DownloadPeers:
      type: object
      required: [running, peers, availability]
      properties:
        running: { type: boolean }
        availability: { type: [number, 'null'], description: 'Distributed copies among the connected peers' }
        peers:
          type: array
          items:
            type: object
            required: [address, client, flags, progress, downloadSpeed, uploadSpeed, downloaded, uploaded]
            properties:
              address: { type: string, description: 'ip:port' }
              client: { type: [string, 'null'], description: 'From its handshake or its peer id' }
              flags:
                type: string
                description: >-
                  µTorrent's letters the engine knows: D downloading from it, d interested but choked, U uploading
                  to it, u it is interested but choked, I incoming, X from peer exchange, H from the DHT, P µTP
              progress: { type: [number, 'null'], description: '0 to 1 of the torrent it has' }
              downloadSpeed: { type: number }
              uploadSpeed: { type: number }
              downloaded: { type: number }
              uploaded: { type: number }
    DownloadTrackers:
      type: object
      required: [running, scraping, trackers]
      properties:
        running: { type: boolean }
        scraping: { type: boolean, description: 'A scrape of its trackers is under way (the counts follow)' }
        trackers:
          type: array
          items:
            type: object
            required: [url, status, seeds, peers, message, ours, added, swarm]
            properties:
              url: { type: string }
              status:
                type: string
                enum: [working, updating, error, not-contacted, unknown, stopped]
                description: '`unknown`: the engine does not report it; `stopped`: the torrent is not running'
              seeds: { type: [integer, 'null'] }
              peers: { type: [integer, 'null'] }
              message: { type: [string, 'null'] }
              ours: { type: boolean, description: 'One of the trackers the server adds to every torrent' }
              added: { type: boolean, description: 'One the admin added' }
              swarm:
                type: [object, 'null']
                description: 'What it answered to the server''s last scrape (every engine); null before it was asked'
                required: [seeds, peers, downloaded, at, error]
                properties:
                  seeds: { type: [integer, 'null'] }
                  peers: { type: [integer, 'null'], description: 'Leechers' }
                  downloaded: { type: [integer, 'null'], description: 'Completed downloads it counted' }
                  at: { type: string, format: date-time }
                  error: { type: [string, 'null'] }
    DownloadPieces:
      type: object
      required: [pieceLength, count, have, files, reads]
      properties:
        pieceLength: { type: [integer, 'null'] }
        count: { type: integer }
        have: { type: [string, 'null'], description: 'Verified pieces as a bitfield (base64; piece 0 = the first byte''s high bit)' }
        files:
          type: array
          description: The selected files' piece ranges (inclusive)
          items:
            type: object
            required: [path, first, last]
            properties:
              path: { type: string }
              first: { type: integer }
              last: { type: integer }
        reads:
          type: array
          description: Where players read now (open streams)
          items:
            type: object
            required: [path, from, position, ahead, at, devices]
            properties:
              path: { type: string }
              from: { type: integer, description: 'The piece the stream started at' }
              position: { type: integer, description: 'The piece it reads now' }
              ahead: { type: integer, description: 'The last piece of its read-ahead (16 MB)' }
              at: { type: string, format: date-time, description: 'Its last read' }
              devices: { type: array, items: { type: string }, description: 'Devices playing that file' }
    DownloadSpeed:
      type: object
      required: [intervalMs, samples]
      properties:
        intervalMs: { type: integer }
        samples:
          type: array
          items:
            type: object
            required: [at, down, up, peers]
            properties:
              at: { type: string, format: date-time }
              down: { type: number }
              up: { type: number }
              peers: { type: integer }
    DownloadPreview:
      type: object
      description: What a link or a .torrent is, before adding it
      required: [infoHash, name, sizeBytes, files, known]
      properties:
        infoHash: { type: string }
        name: { type: [string, 'null'] }
        sizeBytes: { type: [number, 'null'], description: 'Of every file; null when the files are not known yet' }
        files:
          type: [array, 'null']
          description: 'null for a magnet link the server does not keep: its files arrive with its metadata, from the swarm'
          items:
            type: object
            required: [path, size]
            properties:
              path: { type: string }
              size: { type: number }
        known:
          oneOf:
            - $ref: '#/components/schemas/Download'
            - type: 'null'
          description: 'The download the server already keeps for this torrent'
    # ── media library
    LibraryFolderKind: { type: string, enum: [movies, shows, mixed, other], description: 'What to match its files as (other: never matched)' }
    LibraryAudience: { type: string, enum: [everyone, adults], description: 'adults: never for kids profiles or over DLNA' }
    LibraryFileState: { type: string, enum: [ok, missing, unmatched, ignored] }
    AddLibraryFolderRequest:
      type: object
      required: [path, kind]
      properties:
        path: { type: string, description: 'Absolute path on the server' }
        kind: { $ref: '#/components/schemas/LibraryFolderKind' }
        audience: { $ref: '#/components/schemas/LibraryAudience' }
        dlna: { type: boolean }
    LibraryFolder:
      type: object
      required: [id, path, kind, audience, dlna, matcher, builtin, status, addedAt, lastScanAt, counts, scanning, queued]
      properties:
        id: { type: string }
        path: { type: string }
        kind: { $ref: '#/components/schemas/LibraryFolderKind' }
        audience: { $ref: '#/components/schemas/LibraryAudience' }
        dlna: { type: boolean }
        matcher: { type: [string, 'null'], description: 'Its information provider: a plugin''s id (`library.match`), null = Playpex (TMDB)' }
        builtin: { type: boolean, description: 'The download directory: added by the server, not removable' }
        status: { type: string, description: 'ok · scanning · missing (unreachable: its files are kept 7 days) · error: <message>' }
        addedAt: { type: string, format: date-time }
        lastScanAt: { type: [string, 'null'], format: date-time }
        counts:
          type: object
          required: [ok, missing, unmatched, ignored]
          properties:
            ok: { type: integer }
            missing: { type: integer }
            unmatched: { type: integer }
            ignored: { type: integer }
        scanning: { type: boolean }
        queued: { type: boolean }
    LibraryScanStatus:
      type: object
      required: [current, queued]
      properties:
        current:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LibraryScanProgress'
        queued: { type: array, items: { type: string }, description: 'Folder ids waiting' }
    LibraryScanProgress:
      type: object
      required: [folderId]
      properties:
        folderId: { type: string }
        total: { type: integer, description: 'New or changed files to probe and match' }
        processed: { type: integer }
        added: { type: integer }
        changed: { type: integer }
        missing: { type: integer }
        matched: { type: integer }
        unmatched: { type: integer }
    LibraryScanEvent:
      description: '`data` of `library.scan` (admin): a scan started, progressed (every 25 files), ended'
      allOf:
        - $ref: '#/components/schemas/LibraryScanProgress'
        - type: object
          required: [state]
          properties:
            state: { type: string, enum: [scanning, done, missing, error] }
            error: { type: string }
    LibraryView:
      type: object
      required: [folders, scan, matchers]
      properties:
        folders: { type: array, items: { $ref: '#/components/schemas/LibraryFolder' } }
        scan: { $ref: '#/components/schemas/LibraryScanStatus' }
        matchers:
          type: array
          description: Running plugins that recognise library files (`library.match`), for a folder's `matcher`
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
    LibraryItem:
      type: object
      description: What a file is. For an episode, `tmdbId` is the episode's, `imdbId` the show's.
      required: [id, kind, tmdbId, showTmdbId, season, episode, imdbId, title, episodeTitle, year, artwork]
      properties:
        id: { type: string }
        kind: { type: string, enum: [movie, episode] }
        tmdbId: { type: [integer, 'null'] }
        showTmdbId: { type: [integer, 'null'] }
        season: { type: [integer, 'null'] }
        episode: { type: [integer, 'null'] }
        imdbId: { type: [string, 'null'] }
        title: { type: [string, 'null'], description: "The movie's, or the show's" }
        episodeTitle: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        artwork:
          type: [object, 'null']
          properties:
            posterPath: { type: [string, 'null'] }
            backdropPath: { type: [string, 'null'] }
            stillPath: { type: [string, 'null'] }
    LibraryFile:
      type: object
      required: [id, ref, folderId, relPath, size, mtime, state, matchedBy, addedAt, missingSince, parse, probe, subtitles, item]
      properties:
        id: { type: string }
        ref: { type: string, description: 'Media ref: GET /media/{ref} streams it' }
        folderId: { type: string }
        relPath: { type: string, description: 'Inside its folder, / separated' }
        size: { type: number }
        mtime: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/LibraryFileState' }
        matchedBy: { type: [string, 'null'], enum: [auto, nfo, admin, null], description: 'admin: kept by rescans' }
        addedAt: { type: string, format: date-time }
        missingSince: { type: [string, 'null'], format: date-time }
        parse:
          type: [object, 'null']
          description: What the path says (kind, title, year, season, episode, episodeEnd, resolution, source, codec, tmdbId, imdbId)
        probe:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ProbeResult'
        subtitles:
          type: array
          items:
            type: object
            required: [index, language, forced, sdh, relPath]
            properties:
              index: { type: integer }
              language: { type: [string, 'null'] }
              forced: { type: boolean }
              sdh: { type: boolean }
              relPath: { type: string }
        item:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/LibraryItem'
    LibraryMatch:
      oneOf:
        - type: object
          required: [kind, tmdbId]
          properties:
            kind: { const: movie }
            tmdbId: { type: integer, minimum: 1 }
        - type: object
          required: [kind, showTmdbId, season, episode]
          properties:
            kind: { const: episode }
            showTmdbId: { type: integer, minimum: 1 }
            season: { type: integer, minimum: 0 }
            episode: { type: integer, minimum: 1 }
    FolderListing:
      type: object
      required: [path, parent, dirs, places]
      properties:
        path: { type: [string, 'null'], description: 'The folder listed (its realpath); null without ?path=' }
        parent: { type: [string, 'null'] }
        dirs:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
        places:
          type: array
          description: Where to start (home, the download directory, the file system's roots or drives)
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }
    MediaSubtitle:
      type: object
      required: [index, language, languageName, forced, sdh]
      properties:
        index: { type: integer, description: 'GET /media/{ref}/subtitles/{index}' }
        language: { type: [string, 'null'], description: 'ISO 639-1 when known' }
        languageName: { type: [string, 'null'] }
        forced: { type: boolean }
        sdh: { type: boolean }
    DownloadRemovedEvent:
      type: object
      description: '`data` of `download.removed`'
      properties:
        infoHash: { type: string }
    TorrentFile:
      type: object
      required: [name, path, ref, link, length, offset, selected]
      properties:
        name: { type: string }
        path: { type: string }
        ref: { type: string, description: 'Media ref: GET /media/{ref} streams it (also probe / keyframe / transcode)' }
        link: { type: string, description: 'Stream URL path (append to the server origin): /api/v1/torrents/{infoHash}/files/{path} (an alias of /media/{ref})' }
        length: { type: number }
        offset: { type: number }
        selected: { type: boolean }
    TorrentStats:
      type: object
      required: [metadata, peers, traffic, speed, eta]
      properties:
        metadata: { type: boolean }
        peers:
          type: object
          properties:
            total: { type: integer }
            unchocked: { type: integer }
        traffic:
          type: object
          properties:
            down: { type: number, description: 'Bytes' }
            up: { type: number }
        speed:
          type: object
          properties:
            down: { type: number, description: 'Bytes per second' }
            up: { type: number }
        eta: { type: [integer, 'null'], description: 'Seconds; null until known' }
        queue: { type: number }
        paused: { type: boolean, description: 'Not running (paused, queued, completed or error)' }
        state: { $ref: '#/components/schemas/DownloadState' }
    ProbeResult:
      type: object
      required: [duration, video, audio, transcode]
      properties:
        duration: { type: [number, 'null'], description: 'Seconds' }
        video: { type: [string, 'null'], description: 'Codec, e.g. h264, hevc' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        hdr: { type: boolean, description: 'PQ (HDR10, Dolby Vision) or HLG transfer' }
        audio:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              codec: { type: string }
              language: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
              channels: { type: integer }
              default: { type: boolean }
        subtitles:
          type: array
          description: Subtitle streams inside the file (not played by the server yet)
          items:
            type: object
            properties:
              index: { type: integer }
              codec: { type: [string, 'null'] }
              language: { type: [string, 'null'] }
              title: { type: [string, 'null'] }
              forced: { type: boolean }
        transcode: { type: boolean, description: 'The default audio track needs /transcode to be heard in Chromium' }

    # ── catalog
    ImdbRating:
      type: object
      required: [id, rating, votes]
      properties:
        id: { type: string }
        rating: { type: [number, 'null'] }
        votes: { type: [integer, 'null'] }
    ImdbSeries:
      allOf:
        - $ref: '#/components/schemas/ImdbRating'
        - type: object
          required: [seasons]
          properties:
            seasons:
              type: array
              items:
                type: object
                required: [season, rating, rated, episodes]
                properties:
                  season: { type: integer }
                  rating: { type: [number, 'null'], description: 'Mean of the rated episodes' }
                  rated: { type: integer, description: 'Number of rated episodes' }
                  episodes:
                    type: array
                    items:
                      type: object
                      required: [episode, id, rating, votes]
                      properties:
                        episode: { type: integer }
                        id: { type: string }
                        rating: { type: [number, 'null'] }
                        votes: { type: [integer, 'null'] }

    # ── releases
    ReleaseDescription:
      type: object
      description: What the release name says about playability in the TV app (Chromium)
      properties:
        quality: { type: [string, 'null'], description: '2160p, 1080p, 720p, 480p, SD or null' }
        codec: { type: [string, 'null'] }
        audio: { type: [string, 'null'], description: '"unsupported" for Dolby / DTS' }
        playable: { type: boolean, description: 'Video codec playable (no HEVC / 10-bit / XviD / 4K)' }
    PlaySourcesRequest:
      type: object
      required: [kind, tmdbId, title]
      properties:
        kind: { type: string, enum: [movie, episode] }
        tmdbId: { type: integer, minimum: 1, description: 'The movie''s, or the episode''s show''s' }
        imdbId: { type: [string, 'null'], pattern: '^tt\\d{5,10}$', description: 'The movie''s / the show''s (source plugins search by it)' }
        title: { type: string, maxLength: 200, description: 'The movie''s / the show''s, to match release names' }
        year: { type: [integer, 'null'] }
        season: { type: integer, minimum: 0, description: 'Episodes' }
        episode: { type: integer, minimum: 1, description: 'Episodes' }
        profileId: { type: [string, 'null'], description: 'Who is watching: their settings and kids rules apply' }
    PlaySource:
      type: object
      required: [id, type, provider, label, playable, badges, notes]
      properties:
        id: { type: string, description: 'Stable for a source: the media ref of a file, a download''s file or a plugin''s source, `torrent:<infoHash>` of a torrent' }
        type: { type: string, enum: [file, download, torrent, plugin], description: 'file: in the library; download: a file of the server''s download of this title; torrent: from a provider or a plugin; plugin: a plugin''s HTTPS source, proxied by the server (play its `ref` as its `format` says)' }
        format: { $ref: '#/components/schemas/MediaFormat' }
        provider: { type: string, description: 'library, downloads, or the plugin that found it (its id)' }
        handler: { type: string, description: 'The collect handler that found it' }
        label: { type: string, description: 'A file''s or a release''s name' }
        ref: { type: string, description: 'file, download, plugin: the media ref to play (GET /media/{ref})' }
        plugin: { type: string, description: 'The plugin that found it' }
        resolver:
          type: object
          description: 'torrent: a plugin''s service has it and plays it at once (POST /play/start resolves it)'
          required: [plugin, label]
          properties:
            plugin: { type: string }
            label: { type: string, description: 'Real-Debrid…: "Cached on <label>"' }
        infoHash: { type: string, description: 'download, torrent' }
        path: { type: string, description: 'download: the file''s path in its torrent' }
        magnet: { type: string, description: 'torrent: with the server''s tracker list' }
        size: { type: [number, 'null'], description: 'Bytes' }
        quality: { type: [string, 'null'], description: '2160p, 1080p, 720p, 480p, SD' }
        codec: { type: [string, 'null'] }
        audio: { type: [string, 'null'] }
        duration: { type: [number, 'null'], description: 'file: seconds (ffprobe)' }
        seeds: { type: [integer, 'null'] }
        peers: { type: [integer, 'null'] }
        progress: { type: number, minimum: 0, maximum: 1, description: 'download: how much of the file is there (1 = on disk)' }
        state: { $ref: '#/components/schemas/DownloadState' }
        playable:
          type: string
          enum: [yes, audio-converted, maybe, no]
          description: 'yes; audio-converted (Dolby / DTS sound re-encoded by the server''s ffmpeg); maybe (HEVC / 10-bit / 4K: depends on the hardware); no'
        badges:
          type: array
          items: { type: string }
          description: 'Flags clients may show: best (the first), on-server, downloading, pack, hdr, plugin (from a plugin), cached (a service plays it at once). Ignore those you don''t know'
        notes: { type: array, items: { type: string }, description: 'Why it may not play, in words (English)' }
        group: { $ref: '#/components/schemas/PlayGroupName' }
        readiness: { $ref: '#/components/schemas/PlayReadiness' }
        file:
          type: object
          description: 'torrent: the file of the torrent the plugin that found it named (its name and / or index in the torrent''s file list); play that one when the torrent''s files are known'
          properties:
            name: { type: [string, 'null'] }
            index: { type: [integer, 'null'], minimum: 0 }
    MediaFormat:
      type: string
      enum: [file, hls, live]
      description: 'How a ref plays (absent = file). file: `GET /media/{ref}` with byte ranges; hls: an HLS playlist, `GET /media/{ref}/index.m3u8` with an HLS player (hls.js: Chromium plays no HLS); live: `GET /media/{ref}` is one continuous Matroska stream (no size, no ranges, no seeking). hls may be live too: the playlist has no `#EXT-X-ENDLIST`'
    PlayGroupName:
      type: string
      enum: [server, stream, torrent]
      description: 'The way to play: server (a file of the library or of a download: on this server), stream (a plugin''s stream, or a torrent a plugin''s service plays at once), torrent'
    PlayReadiness:
      type: string
      enum: [instant, seconds, slow, unknown]
      description: 'How soon it plays: instant (on disk, a stream), seconds (a torrent with a healthy swarm, a download running), slow (few people sharing), unknown'
    PlayGroup:
      type: object
      required: [group, best, count, readiness]
      properties:
        group: { $ref: '#/components/schemas/PlayGroupName' }
        best: { type: string, description: 'The id of its best source (its first in `sources`)' }
        count: { type: integer, minimum: 1 }
        readiness: { $ref: '#/components/schemas/PlayReadiness' }
    PlaySources:
      type: object
      required: [request, sources, groups, hidden, policy, errors]
      properties:
        request: { type: string, description: 'For POST /play/start (kept 30 min)' }
        sources: { type: array, items: { $ref: '#/components/schemas/PlaySource' } }
        groups:
          type: array
          description: 'The ways to play, in this order when present: server, stream, torrent (a group with no source is left out). Show each group''s best first'
          items: { $ref: '#/components/schemas/PlayGroup' }
        hidden:
          type: array
          description: 'Sources a plugin''s `play.rank` hid: show "Hidden by <by>: <reason>" (they can''t be played from here)'
          items:
            type: object
            required: [id, label, plugin, by, reason]
            properties:
              id: { type: string }
              label: { type: string }
              plugin: { type: string }
              by: { type: string, description: 'The plugin''s name' }
              reason: { type: string }
        policy:
          type: object
          required: [autoplay]
          properties:
            autoplay: { type: [string, 'null'], description: 'The id of the source to play without asking, else null: show the sources' }
        errors:
          type: array
          items:
            type: object
            required: [handler, message]
            properties:
              handler: { type: string }
              message: { type: string }
    PluginTitleMeta:
      type: object
      required: [meta]
      properties:
        meta:
          type: array
          items:
            type: object
            required: [plugin, name, items]
            properties:
              plugin: { type: string }
              name: { type: string }
              items:
                type: array
                description: '`$defs/metaItem`: text (`text`, `small`), chip (`text`, `icon`: a core icon name or a path under its assets/), score (`value` 0–10, `votes`, `label`), seal (`text`)'
                items: { type: object, required: [kind], properties: { kind: { type: string, enum: [text, chip, score, seal] } } }
    PluginPermission:
      type: object
      required: [key, text, personal]
      properties:
        key: { type: string }
        text: { type: string, description: 'In words, for the admin' }
        personal: { type: boolean, description: 'Granted per profile on the plugin''s Profiles (events.playback, write.*)' }
    AdminPlugin:
      type: object
      required: [id, name, version, origin, enabled, state, error, permissions, hooks, previous, repository, updatePolicy, held, lifecycle, update, requiredBy]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: [string, 'null'] }
        publisher: { type: ['object', 'null'], properties: { name: { type: string }, url: { type: string } } }
        audience: { type: [string, 'null'], enum: [everyone, adults, null] }
        icon: { type: [string, 'null'], description: 'Under the API prefix: /plugins/<id>/assets/…' }
        origin: { type: string, enum: [upload, url, repository, dev], description: 'dev: a developer copy from <config>/plugins-dev/' }
        source: { type: [string, 'null'], description: 'The uploaded file''s name, the URL, or the developer folder' }
        signer: { type: [string, 'null'], description: 'The trusted publisher key''s fingerprint; null = unsigned' }
        enabled: { type: boolean }
        state: { type: string, enum: [loading, enabled, failed, disabled, removed] }
        error: { type: [string, 'null'] }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
        hooks: { type: array, items: { type: string } }
        registered: { type: ['object', 'null'] }
        stats: { type: ['object', 'null'] }
        repository: { type: ['object', 'null'], required: [id, name], properties: { id: { type: string }, name: { type: string } }, description: 'Origin repository: its updates come only from there' }
        updatePolicy: { type: ['string', 'null'], enum: [auto, notify, never, null], description: 'null: the server''s plugins.updates' }
        held: { type: ['string', 'null'], description: 'Why the server switched it off (a broken version, something it requires is off)' }
        lifecycle:
          type: ['object', 'null']
          description: Its version's flags in its origin repository (null when not from one)
          required: [state, reason, replacedBy, listed]
          properties:
            state: { type: string, enum: [stable, deprecated, broken] }
            reason: { type: [string, 'null'] }
            replacedBy: { type: [string, 'null'] }
            listed: { type: boolean, description: 'false: no longer in its repository' }
        update:
          type: ['object', 'null']
          description: What the last update check left waiting
          required: [version, needsConsent, reason, at]
          properties:
            version: { type: string }
            needsConsent: { type: boolean }
            reason: { type: [string, 'null'] }
            at: { type: string, format: date-time }
        requiredBy: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } }
        previous: { type: boolean, description: 'The version it replaced is kept' }
        previousVersion: { type: [string, 'null'], description: 'That version' }
        settings: { type: [integer, 'null'], description: 'How many options it declares (null: its manifest can''t be read)' }
        personal: { type: [integer, 'null'], description: 'How many personal permissions it asks for (granted per profile)' }
        links: { type: [integer, 'null'], description: 'How many account links it declares' }
        jobs:
          type: array
          description: Its scheduled jobs
          items:
            type: object
            required: [name, intervalMs, runs, errors, skipped, running, lastRunAt, lastDurationMs, lastError, nextRunAt]
            properties:
              name: { type: string }
              intervalMs: { type: integer }
              runs: { type: integer }
              errors: { type: integer }
              skipped: { type: integer, description: 'Runs skipped: the last one was still going' }
              running: { type: boolean }
              lastRunAt: { type: [string, 'null'], format: date-time }
              lastDurationMs: { type: [integer, 'null'] }
              lastError: { type: [string, 'null'] }
              nextRunAt: { type: [string, 'null'], format: date-time }
        installedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        listing: { type: ['object', 'null'], description: 'GET /admin/plugins/{id} only: the manifest''s listing' }
        requires:
          type: array
          description: 'GET /admin/plugins/{id} only: the plugins it needs'
          items: { type: object, required: [id, version], properties: { id: { type: string }, version: { type: string }, optional: { type: boolean } } }
        exports: { type: array, items: { type: string }, description: 'GET /admin/plugins/{id} only' }
        changelog: { type: [string, 'null'], description: 'GET /admin/plugins/{id} only: its CHANGELOG.md' }
    PluginDataAnswer:
      type: object
      description: A data handler's answer (`dataAnswer` of plugin-api.schema.json, effects checked by the server)
      required: [data, effects]
      properties:
        data: { description: 'The model of the template / slot / call' }
        effects:
          type: array
          items: { type: object, required: [type], properties: { type: { type: string, enum: [open, play, toast, refresh, confirm, download] } } }
    PluginSettingDefinition:
      type: object
      description: One of a plugin's options as declared in its manifest (docs/plugins/manifest.md), labels translated
      required: [key, scope, type, label, level]
      properties:
        key: { type: string }
        scope: { type: string, enum: [server, profile] }
        type: { type: string, enum: [switch, choice, slider, number, text, url, secret, action] }
        label: { type: string }
        description: { type: string }
        group: { type: string }
        level: { type: string, enum: [basic, advanced] }
        visibleIf: { type: object, properties: { key: { type: string }, equals: {} } }
        enabledIf: { type: object, properties: { key: { type: string }, equals: {} } }
        options: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } } }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        unit: { type: string }
        integer: { type: boolean }
        maxLength: { type: integer }
        placeholder: { type: string }
        pattern: { type: string }
        schemes: { type: array, items: { type: string, enum: [https, http] }, description: 'A url: the schemes it accepts (default both)' }
        grantsHost: { type: boolean, description: 'A url: saving it lets the plugin reach its host (shown in its permissions)' }
        streamHosts: { type: boolean, description: 'A url: and the stream hosts the document there lists' }
        confirm: { type: string, description: 'An action: asked before it runs' }
        default: {}
    PluginSettings:
      type: object
      required: [plugin, state, definitions, server, secrets, personal, profiles]
      properties:
        plugin: { type: string }
        state: { type: string }
        definitions: { type: array, items: { $ref: '#/components/schemas/PluginSettingDefinition' } }
        server: { type: object, additionalProperties: true, description: 'Server-scope values (secrets and actions left out)' }
        secrets: { type: object, additionalProperties: { type: boolean }, description: 'Secret key → set or not' }
        personal:
          type: array
          description: Its personal permissions, granted per profile (`profiles[].grants`)
          items: { type: object, required: [key, text], properties: { key: { type: string }, text: { type: string } } }
        profiles:
          type: array
          description: Every profile it may serve (no kids profiles for an `adults` plugin)
          items:
            type: object
            required: [id, name, kids, shown, values]
            properties:
              id: { type: string }
              name: { type: string }
              kids: { type: boolean }
              shown: { type: boolean, description: 'false: the admin hid the plugin from this profile' }
              values: { type: object, additionalProperties: true }
              grants: { type: array, items: { type: string }, description: 'The personal permissions granted for this profile' }
    PluginLink:
      type: object
      required: [name, label, scope, kind, accounts]
      properties:
        name: { type: string }
        label: { type: string }
        scope: { type: string, enum: [profile, server] }
        kind: { type: string, enum: [deviceCode, custom] }
        accounts:
          type: array
          items:
            type: object
            required: [profileId, profileName, linked, linkedAt, expiresAt, pending]
            properties:
              profileId: { type: [string, 'null'], description: 'null: the server''s account' }
              profileName: { type: [string, 'null'] }
              linked: { type: boolean }
              linkedAt: { type: [string, 'null'], format: date-time }
              expiresAt: { type: [string, 'null'], format: date-time }
              pending: { type: boolean, description: 'A link started and not finished' }
    PluginLinkStart:
      oneOf:
        - type: object
          required: [kind, code, url, expiresAt]
          properties:
            kind: { const: code }
            code: { type: string }
            url: { type: string }
            urlComplete: { type: [string, 'null'] }
            qr: { type: boolean }
            expiresAt: { type: string, format: date-time }
        - type: object
          required: [kind, form]
          properties:
            kind: { const: form }
            form:
              type: array
              items:
                type: object
                required: [key, label]
                properties: { key: { type: string }, label: { type: string }, secret: { type: boolean }, help: { type: string } }
            help: { type: [string, 'null'] }
    PluginLinkProgress:
      type: object
      required: [state, message]
      properties:
        state: { type: string, enum: [none, pending, done, failed] }
        message: { type: [string, 'null'] }
    LiveProvider:
      type: object
      required: [plugin, name, guide, channels, updatedAt, error]
      properties:
        plugin: { type: string }
        name: { type: string }
        guide: { type: boolean, description: 'It has a programme guide (`live.guide`)' }
        channels: { type: [integer, 'null'], description: 'How many the server holds; null: not asked yet' }
        updatedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'], description: 'Why the last refresh failed (the channels before it are kept)' }
    LiveChannel:
      type: object
      description: A TV channel (`$defs/channel` of plugin-api.schema.json, numbered by the server)
      required: [id, number, name]
      properties:
        id: { type: string }
        number: { type: integer }
        name: { type: string }
        logo: { type: string, description: 'An https URL, or a path under the API prefix (/live/{plugin}/logos/… , /plugins/{plugin}/assets/…)' }
        group: { type: string }
        country: { type: string }
        languages: { type: array, items: { type: string } }
        audience: { type: string, enum: [everyone, adults] }
    LiveChannels:
      type: object
      required: [plugin, name, guide, channels, groups, updatedAt, error]
      properties:
        plugin: { type: string }
        name: { type: string }
        guide: { type: boolean }
        channels: { type: array, items: { $ref: '#/components/schemas/LiveChannel' } }
        groups:
          type: array
          description: Its groups in the order they first appear, with how many channels each holds
          items: { type: object, required: [name, count], properties: { name: { type: string }, count: { type: integer } } }
        updatedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
    LiveProgramme:
      type: object
      required: [channel, start, end, title]
      properties:
        channel: { type: string, description: 'The channel''s id' }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        title: { type: string }
        subtitle: { type: string }
        description: { type: string }
        category: { type: string }
        episode: { type: string, description: 'As it reads: S2 E5' }
        image: { type: string }
    AdminLiveChannels:
      type: object
      required: [channels, groups, updatedAt, durationMs, error, refreshing, guide, list]
      properties:
        channels: { type: [integer, 'null'] }
        groups: { type: array, items: { type: object, required: [name, count], properties: { name: { type: string }, count: { type: integer } } } }
        updatedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], description: 'How long its last live.channels took' }
        error: { type: [string, 'null'] }
        refreshing: { type: boolean }
        guide: { type: boolean }
        list: { type: array, items: { $ref: '#/components/schemas/LiveChannel' } }
    PluginNotification:
      type: object
      required: [id, plugin, name, text, tone, key, at]
      properties:
        id: { type: string }
        plugin: { type: string }
        name: { type: string, description: 'The plugin''s name' }
        text: { type: string }
        tone: { type: string, enum: [info, success, error] }
        key: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    AdminPlugins:
      type: object
      required: [plugins, kept, developerMode, publisherKeys, devDir, pluginsDir]
      properties:
        plugins: { type: array, items: { $ref: '#/components/schemas/AdminPlugin' } }
        kept:
          type: array
          description: |
            Data kept for plugins that aren't installed (a removal that kept its data, or settings a migration moved out of
            the core for a plugin to come): installing the plugin uses it; DELETE /admin/plugins/kept/{id} forgets it
          items:
            type: object
            required: [id, settings, store, secrets, grants]
            properties:
              id: { type: string }
              settings: { type: integer }
              store: { type: integer }
              secrets: { type: integer }
              grants: { type: integer }
        developerMode: { type: boolean, description: 'Setting plugins.developerMode: unsigned packages install; plugins-dev folders load (restart)' }
        publisherKeys:
          type: array
          description: Setting plugins.publisherKeys
          items: { type: object, required: [key, fingerprint], properties: { key: { type: string }, fingerprint: { type: string } } }
        devDir: { type: string }
        pluginsDir: { type: string }
    PluginPackagePreview:
      type: object
      required: [token, id, name, version, permissions, hooks, origin, source, size, fileCount, change, current, added, removed, signer, installable, reason, expiresAt]
      properties:
        token: { type: string }
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: [string, 'null'] }
        publisher: { type: ['object', 'null'], properties: { name: { type: string }, url: { type: string } } }
        audience: { type: string }
        icon: { type: [string, 'null'], description: 'A data: URL of its icon (≤ 256 KB)' }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
        hooks: { type: array, items: { type: string } }
        origin: { type: string, enum: [upload, url, repository] }
        source: { type: string }
        resolved: { type: [string, 'null'], description: 'What a URL led to (a GitHub release asset, a source zip)' }
        root: { type: [string, 'null'], description: 'The folder of the zip the plugin was found in' }
        size: { type: integer }
        fileCount: { type: integer }
        changelog: { type: [string, 'null'] }
        current: { type: [string, 'null'], description: 'The installed version, if any' }
        added: { type: array, items: { $ref: '#/components/schemas/PluginPermission' }, description: 'Permissions the installed version doesn''t have: to accept (`accept: true`)' }
        removed: { type: array, items: { $ref: '#/components/schemas/PluginPermission' }, description: 'Permissions it gives up' }
        rollback: { type: boolean, description: 'The version kept by the last update (POST …/rollback)' }
        kind: { type: string, enum: [plugin, repository], description: 'repository: a repository package; installing it adds `adds`' }
        adds: { $ref: '#/components/schemas/PluginRepositoryPreview' }
        repository: { type: ['object', 'null'], required: [id, name], properties: { id: { type: string }, name: { type: string } }, description: 'From a repository (trusted by its signed index)' }
        lifecycle: { type: ['object', 'null'], required: [state, reason], properties: { state: { type: string, enum: [stable, deprecated, broken] }, reason: { type: [string, 'null'] } } }
        moves: { type: ['object', 'null'], required: [from, to], properties: { from: { type: string }, to: { type: string } }, description: 'Installed from elsewhere: its updates would now come from here (accept)' }
        dependencies: { type: array, items: { $ref: '#/components/schemas/PluginDependency' } }
        change: { type: string, enum: [install, update, downgrade, reinstall] }
        conflict: { type: [string, 'null'] }
        signer:
          oneOf:
            - type: 'null'
            - type: object
              required: [key, fingerprint, trusted]
              properties:
                key: { type: string }
                fingerprint: { type: string }
                trusted: { type: boolean }
        installable: { type: boolean }
        reason: { type: [string, 'null'], description: 'Why it can''t be installed now' }
        expiresAt: { type: string, format: date-time }
    PluginDependency:
      type: object
      required: [id, name, version, range, optional, installed, missing, repository, permissions]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: [string, 'null'], description: 'The version it would get (installed already: that one)' }
        range: { type: string }
        optional: { type: boolean }
        installed: { type: boolean }
        missing: { type: boolean, description: 'No enabled repository offers a fitting version' }
        update: { type: boolean, description: 'Installed in a version that doesn''t fit: updated' }
        repository: { type: [string, 'null'] }
        repositoryName: { type: string }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
    PluginRepository:
      type: object
      required: [id, name, url, builtin, enabled, key, fingerprint, pendingKey, fetchedAt, checkedAt, error, stale, plugins, refused]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        homepage: { type: [string, 'null'] }
        builtin: { type: boolean, description: 'The official repository (never offers adults plugins)' }
        enabled: { type: boolean }
        key: { type: string, description: 'The pinned key' }
        fingerprint: { type: string }
        pendingKey: { type: ['object', 'null'], required: [key, fingerprint], properties: { key: { type: string }, fingerprint: { type: string } }, description: 'Its index is now signed by this key: waits for the admin' }
        fetchedAt: { type: [string, 'null'], format: date-time }
        checkedAt: { type: [string, 'null'], format: date-time }
        generatedAt: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        stale: { type: boolean, description: 'The last fetch failed: its last good index is used' }
        plugins: { type: integer }
        refused:
          type: array
          description: Entries left out (the official repository's adults plugins)
          items: { type: object, required: [id, name, reason], properties: { id: { type: string }, name: { type: string }, reason: { type: string } } }
        addedAt: { type: [string, 'null'], format: date-time }
    PluginRepositoryPreview:
      type: object
      required: [url, id, name, key, fingerprint, plugins, known, problem]
      properties:
        url: { type: string }
        id: { type: string }
        name: { type: string }
        homepage: { type: [string, 'null'] }
        key: { type: string }
        fingerprint: { type: string }
        plugins: { type: integer }
        generatedAt: { type: string }
        known: { type: [string, 'null'], description: 'Already added: its id' }
        problem: { type: [string, 'null'], description: 'Why it can''t be added' }
    PluginIndexVersion:
      type: object
      required: [version, releasedAt, size, lifecycle, compatible, permissions, requires]
      properties:
        version: { type: string }
        releasedAt: { type: string }
        size: { type: integer }
        lifecycle: { type: string, enum: [stable, deprecated, broken] }
        reason: { type: [string, 'null'] }
        replacedBy: { type: [string, 'null'] }
        changelog: { type: [string, 'null'] }
        audience: { type: [string, 'null'] }
        compatible: { type: boolean, description: 'Runs on this server''s plugin API' }
        permissions: { type: array, items: { $ref: '#/components/schemas/PluginPermission' } }
        requires: { type: array, items: { type: object, required: [id, version], properties: { id: { type: string }, version: { type: string }, optional: { type: boolean } } } }
    PluginCatalog:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            type: object
            required: [id, name, repository, latest, versions, incompatible, installed, update]
            properties:
              id: { type: string }
              name: { type: string }
              publisher: { type: object, properties: { name: { type: string }, url: { type: string } } }
              icon: { type: [string, 'null'] }
              listing: { type: object, additionalProperties: true }
              repository: { type: object, required: [id, name, builtin], properties: { id: { type: string }, name: { type: string }, builtin: { type: boolean } } }
              latest: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/PluginIndexVersion' }] }
              versions: { type: array, items: { $ref: '#/components/schemas/PluginIndexVersion' } }
              incompatible: { type: [string, 'null'] }
              installed: { type: ['object', 'null'], required: [version, repository, origin], properties: { version: { type: string }, repository: { type: [string, 'null'] }, origin: { type: string } } }
              update: { type: boolean, description: 'Installed from this repository in an older version' }
    PluginUpdates:
      type: object
      required: [updates, policy]
      properties:
        policy: { type: string, enum: [auto, notify, never] }
        updates:
          type: array
          items:
            type: object
            required: [id, name, repository, installed, version, changelog, added, policy, fixes, state]
            properties:
              id: { type: string }
              name: { type: string }
              repository: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: [string, 'null'] } } }
              installed: { type: string }
              version: { type: string }
              changelog: { type: [string, 'null'] }
              added: { type: array, items: { $ref: '#/components/schemas/PluginPermission' }, description: 'From the index: confirmed by the package at install' }
              policy: { type: string, enum: [auto, notify, never] }
              fixes: { type: boolean, description: 'The installed version is marked broken' }
              state: { type: ['object', 'null'], description: 'What the last automatic attempt left (needsConsent, reason)' }
    PlayStart:
      oneOf:
        - type: object
          required: [action, source]
          properties:
            action: { const: play }
            source: { $ref: '#/components/schemas/PlaySource' }
        - type: object
          required: [action, question, yes, no, by]
          properties:
            action: { const: ask }
            question: { type: string }
            yes: { type: string }
            no: { type: string }
            by: { type: string, description: 'The plugin''s name' }
        - type: object
          required: [action, reason, by]
          properties:
            action: { const: refuse }
            reason: { type: string }
            by: { type: string }
    ServerLibraryEntry:
      type: object
      description: A movie or a show on this server, from its files' matches
      required: [mediaType, tmdbId, imdbId, title, year, posterPath, backdropPath, addedAt, fileCount, quality, episodeCount, seasonCount, latest]
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        imdbId: { type: [string, 'null'] }
        title: { type: string }
        year: { type: [integer, 'null'] }
        posterPath: { type: [string, 'null'], description: 'TMDB image path' }
        backdropPath: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time, description: 'When its newest file was found' }
        fileCount: { type: integer }
        quality: { type: [string, 'null'], description: 'The best of its files: 2160p, 1080p, 720p, 480p' }
        episodeCount: { type: [integer, 'null'], description: 'Shows: episodes on this server (null for a movie)' }
        seasonCount: { type: [integer, 'null'] }
        latest:
          description: 'Shows: the episode added last (null for a movie)'
          oneOf:
            - type: 'null'
            - type: object
              required: [season, episode, episodeTitle]
              properties:
                season: { type: integer }
                episode: { type: integer }
                episodeTitle: { type: [string, 'null'] }
    ServerLibrary:
      type: object
      required: [movies, shows, recent, other]
      properties:
        movies: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'By title' }
        shows: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'By title' }
        recent: { type: array, items: { $ref: '#/components/schemas/ServerLibraryEntry' }, description: 'Movies and shows, newest file first (20)' }
        other:
          type: object
          required: [count, folders]
          properties:
            count: { type: integer, description: 'Other videos in all' }
            folders:
              type: array
              description: 'Library folders holding other videos, by name'
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: string }
                  name: { type: string, description: 'The folder''s own name (the download folder: Downloads)' }
                  count: { type: integer }
    ServerLibraryTitle:
      type: object
      required: [mediaType, tmdbId, fileCount, episodes]
      properties:
        mediaType: { type: string, enum: [movie, tv] }
        tmdbId: { type: integer }
        fileCount: { type: integer, description: '0: not on this server' }
        episodes:
          type: array
          description: 'A show''s episodes on this server, in order ([] for a movie)'
          items:
            type: object
            required: [season, episode, fileCount]
            properties:
              season: { type: integer }
              episode: { type: integer }
              fileCount: { type: integer }
    ServerLibraryFolder:
      type: object
      required: [folder, path, parent, folders, videos]
      properties:
        folder:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        path: { type: string, description: 'This level inside the folder ('''' = the folder itself)' }
        parent: { type: [string, 'null'], description: 'The level above (null at the folder itself)' }
        folders:
          type: array
          items:
            type: object
            required: [name, path, count]
            properties:
              name: { type: string }
              path: { type: string }
              count: { type: integer, description: 'Videos inside, at any depth' }
        videos:
          type: array
          items:
            type: object
            required: [id, ref, name, size, duration, quality, addedAt]
            properties:
              id: { type: string }
              ref: { type: string, description: 'Its media ref (/media/{ref})' }
              name: { type: string, description: 'The file name' }
              size: { type: integer }
              duration: { type: [number, 'null'], description: 'Seconds (ffprobe), null when unknown' }
              quality: { type: [string, 'null'] }
              addedAt: { type: string, format: date-time }
    LibraryChangedEvent:
      description: '`data` of `library.changed` (everyone): what clients see of the library changed (a scan found, changed or lost files, the admin fixed a match or edited a folder); refetch'
      type: object
      required: [folderId]
      properties:
        folderId: { type: [string, 'null'] }
    ReleaseProvider:
      type: object
      required: [id, name, paged, default]
      properties:
        id: { type: string }
        name: { type: string }
        paged: { type: boolean, description: 'Has more than one page' }
        default: { type: boolean }
    ReleaseTorrent:
      allOf:
        - $ref: '#/components/schemas/ReleaseDescription'
        - type: object
          required: [provider, name, hash, magnet, seeds]
          properties:
            provider: { type: string }
            name: { type: string }
            hash: { type: string }
            magnet: { type: string }
            seeds: { type: integer }
            peers: { type: [integer, 'null'] }
            size: { type: [number, 'null'] }
            added: { type: number, description: 'Unix seconds, 0 if unknown' }
            title: { type: [string, 'null'] }
            year: { type: [integer, 'null'] }
            season: { type: [integer, 'null'], description: 'kind tv' }
            episode: { type: [integer, 'null'], description: 'kind tv' }
            pack: { type: boolean, description: 'kind tv' }
            matches: { type: boolean, description: 'Its name holds every keyword of `q` (punctuation, "Breaking.Bad" / "breaking bad", "Spider-Man" / "spiderman" aside); sources answer loosely. Always true without `q`' }
    ReleasePage:
      type: object
      required: [provider, page, hasMore, torrents]
      properties:
        provider: { type: [string, 'null'], description: 'null: no source plugin lists this kind' }
        page: { type: integer, description: 'Last page read; ask for page + 1 next' }
        hasMore: { type: boolean }
        torrents: { type: array, items: { $ref: '#/components/schemas/ReleaseTorrent' } }

    # ── search
    SearchProvider:
      type: object
      required: [id, name, kinds]
      properties:
        id: { type: string, description: '`plugin:<id>`' }
        name: { type: string }
        kinds: { type: array, items: { type: string, enum: [http, hls, magnet] }, description: 'What its results can be' }
    SearchSource:
      type: object
      required: [provider, kind, label, matches]
      properties:
        provider: { type: string, description: 'The plugin''s id' }
        kind: { type: string, enum: [file, hls, torrent], description: 'file: an HTTP file (`ref` r_…); hls: a stream (`ref` h_…); torrent: `magnet`' }
        label: { type: string, description: 'Its name' }
        title: { type: [string, 'null'], description: 'What it is, when the provider says' }
        year: { type: [integer, 'null'] }
        season: { type: [integer, 'null'] }
        episode: { type: [integer, 'null'] }
        poster: { type: [string, 'null'], description: 'An https image' }
        ref: { type: string, description: 'file, hls: the media ref (play: GET /media/{ref}…; download: POST /downloads/direct)' }
        magnet: { type: string, description: 'torrent' }
        infoHash: { type: string, description: 'torrent' }
        size: { type: [number, 'null'] }
        quality: { type: [string, 'null'] }
        codec: { type: [string, 'null'] }
        audio: { type: [string, 'null'] }
        seeds: { type: [integer, 'null'] }
        peers: { type: [integer, 'null'] }
        matches: { type: boolean, description: 'Its name (label, else title) holds every keyword (names.searchMatches)' }
    SearchSourcePage:
      type: object
      required: [provider, page, hasMore, items]
      properties:
        provider: { type: string }
        page: { type: integer }
        hasMore: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/SearchSource' } }
    LinkItem:
      type: object
      required: [kind, label, url]
      properties:
        kind: { type: string, enum: [magnet, torrent, video, hls] }
        label: { type: string, description: 'The link''s text, else its file name' }
        url: { type: string, description: 'Where it is (a magnet: the magnet)' }
        ref: { type: string, description: 'video, hls: a media ref to play or download (POST /downloads/direct)' }
        infoHash: { type: string, description: 'magnet' }
        size: { type: [number, 'null'], description: 'video, torrent: when the server learnt it' }
        contentType: { type: [string, 'null'] }
    LinkInspection:
      type: object
      required: [url, kind, items]
      properties:
        url: { type: string, description: 'Where the server ended up (after redirects)' }
        kind: { type: string, enum: [magnet, torrent, video, hls, page], description: 'What the URL itself is' }
        title: { type: [string, 'null'], description: 'A page''s title' }
        items: { type: array, items: { $ref: '#/components/schemas/LinkItem' }, description: 'The URL itself (magnet, torrent, video, hls), or what a page links to' }
        truncated: { type: boolean, description: 'A page longer than the server reads (2 MB): what came after isn''t listed' }
    DirectDownload:
      type: object
      required: [id, name, kind, state, size, received, speed, addedAt, source]
      properties:
        id: { type: string }
        name: { type: string, description: 'Its file name in the download folder' }
        kind: { type: string, enum: [file, hls] }
        state: { type: string, enum: [queued, downloading, paused, completed, error] }
        size: { type: [number, 'null'], description: 'null: unknown (an HLS stream, a server that doesn''t say)' }
        received: { type: number, description: 'Bytes written' }
        speed: { type: number, description: 'Bytes per second, while downloading' }
        path: { type: [string, 'null'], description: 'Its file on the server, once complete' }
        ref: { type: [string, 'null'], description: 'Once complete: the file as a media ref (play it)' }
        error: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        source: { type: object, required: [by, host], properties: { by: { type: string, description: '`links` (a URL the admin gave) or the plugin''s id' }, host: { type: string } } }

    # ── subtitles
    SubtitleProvider:
      type: object
      required: [id, name, description, supports, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        supports:
          type: object
          properties:
            movie: { type: boolean }
            episode: { type: boolean }
        enabled: { type: boolean, description: 'false when its API key is missing' }
    SubtitleSearch:
      type: object
      required: [provider, subtitles]
      properties:
        provider: { type: string }
        subtitles:
          type: array
          items:
            type: object
            required: [provider, ref, language]
            properties:
              provider: { type: string }
              ref: { type: string, description: 'Pass to /subtitles/file' }
              language: { type: string, description: 'ISO 639-1' }
              languageName: { type: string }
              name: { type: [string, 'null'] }
        unsupported: { type: boolean, description: 'The provider doesn''t cover this kind of title' }

    # ── profiles
    Profile:
      type: object
      required: [id, name, avatar, isKid, hasPin, preferences, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: [string, 'null'] }
        isKid: { type: boolean }
        hasPin: { type: boolean }
        preferences:
          type: object
          deprecated: true
          description: 'Always `{}` (what it showed moved to a plugin); use GET /settings?profile='
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
    ProfileList:
      type: object
      required: [profiles, lastUsedId, maxProfiles]
      properties:
        profiles: { type: array, items: { $ref: '#/components/schemas/Profile' } }
        lastUsedId: { type: [string, 'null'] }
        maxProfiles: { type: integer }
    ProfileCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, description: 'Unique, case-insensitive' }
        avatar: { type: string }
        isKid: { type: boolean }
        pin: { type: string, pattern: '^\d{4,6}$' }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        avatar: { type: string }
        isKid: { type: boolean }
        preferences:
          type: object
          deprecated: true
          description: 'Ignored; use PATCH /profiles/{profileId}/settings'

    UserSettingValues:
      type: object
      description: '`{ key: value }`: every registered key of the scope with its effective value, plus stored `client.*` keys'
      additionalProperties: true
    UserSettingsPatch:
      type: object
      description: '`{ key: value | null }`; null resets the key to its default'
      additionalProperties: true
    SettingDefinition:
      type: object
      required: [scope, type, default]
      properties:
        scope: { type: string, enum: [device, profile] }
        type: { type: string, enum: [number, string, boolean] }
        default: {}
        enum: { type: array, items: { type: [number, string] } }
        min: { type: number }
        max: { type: number }
        step: { type: number }
        nullable: { type: boolean }
    UserSettings:
      type: object
      required: [device, profile]
      properties:
        device: { $ref: '#/components/schemas/UserSettingValues' }
        profile:
          oneOf:
            - $ref: '#/components/schemas/UserSettingValues'
            - type: 'null'
        definitions:
          type: object
          description: 'Only with `?definitions=1`: the registry, `{ key: SettingDefinition }`'
          additionalProperties: { $ref: '#/components/schemas/SettingDefinition' }

    # ── catalog
    CatalogInfo:
      type: object
      required: [provider, imageBase, language, region]
      properties:
        provider: { type: string, description: 'tmdb' }
        imageBase: { type: string, description: 'Images are `<imageBase><size>/<path>` (TMDB sizes: w92 … w780, original)' }
        language: { type: string, description: 'What titles and overviews are written in (Settings › Metadata)' }
        region: { type: [string, 'null'] }
    CatalogGenre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CatalogTitle:
      type: object
      description: A movie or a show in a list. Titles are `(mediaType, tmdbId)` everywhere in the API
      required: [mediaType, tmdbId, title, originalTitle, releaseDate, year, overview, posterPath, backdropPath, genreIds, voteAverage, voteCount, originalLanguage]
      properties:
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        title: { type: string, description: In the catalog's language }
        originalTitle: { type: [string, 'null'] }
        releaseDate: { type: [string, 'null'], description: 'A movie''s release, a show''s first air date (YYYY-MM-DD)' }
        year: { type: [string, 'null'] }
        overview: { type: string }
        posterPath: { type: [string, 'null'], description: An image path (`CatalogInfo.imageBase`) }
        backdropPath: { type: [string, 'null'] }
        genreIds: { type: array, items: { type: integer } }
        voteAverage: { type: number, description: TMDB's score, 0–10 }
        voteCount: { type: integer }
        originalLanguage: { type: [string, 'null'] }
    CatalogPerson:
      type: object
      required: [mediaType, personId, name, profilePath, knownForDepartment]
      properties:
        mediaType: { type: string, enum: [person] }
        personId: { type: integer }
        name: { type: string }
        profilePath: { type: [string, 'null'] }
        knownForDepartment: { type: [string, 'null'] }
    CatalogPage:
      type: object
      required: [page, totalPages, totalResults, results]
      properties:
        page: { type: integer }
        totalPages: { type: integer, maximum: 500 }
        totalResults: { type: integer }
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CatalogTitle'
              - $ref: '#/components/schemas/CatalogPerson'
    CatalogVideo:
      type: object
      required: [key, name, site, type, official]
      properties:
        key: { type: string, description: 'The site''s id (a YouTube video id: `/youtube/{videoId}`)' }
        name: { type: string }
        site: { type: string }
        type: { type: string, description: 'Trailer, Teaser, Clip…' }
        official: { type: boolean }
    CatalogSeasonSummary:
      type: object
      required: [seasonNumber, name, overview, airDate, episodeCount, posterPath]
      properties:
        seasonNumber: { type: integer, description: 0 = specials }
        name: { type: string }
        overview: { type: string }
        airDate: { type: [string, 'null'] }
        episodeCount: { type: integer }
        posterPath: { type: [string, 'null'] }
    CatalogDetails:
      description: A title's page; `seasonCount`, `episodeCount` and `seasons` for shows only
      allOf:
        - $ref: '#/components/schemas/CatalogTitle'
        - type: object
          required: [imdbId, genres, runtime, tagline, status, videos]
          properties:
            imdbId: { type: [string, 'null'] }
            genres: { type: array, items: { $ref: '#/components/schemas/CatalogGenre' } }
            runtime: { type: [integer, 'null'], description: 'Minutes: a movie''s, a show''s usual episode' }
            tagline: { type: [string, 'null'] }
            status: { type: [string, 'null'] }
            videos: { type: array, items: { $ref: '#/components/schemas/CatalogVideo' } }
            seasonCount: { type: integer }
            episodeCount: { type: integer }
            seasons: { type: array, items: { $ref: '#/components/schemas/CatalogSeasonSummary' } }
    CatalogCast:
      type: object
      required: [personId, name, character, profilePath, creditId, order]
      properties:
        personId: { type: integer }
        name: { type: string }
        character: { type: [string, 'null'] }
        profilePath: { type: [string, 'null'] }
        creditId: { type: string }
        order: { type: [integer, 'null'] }
    CatalogCrew:
      type: object
      required: [personId, name, job, department, profilePath, creditId]
      properties:
        personId: { type: integer }
        name: { type: string }
        job: { type: [string, 'null'] }
        department: { type: [string, 'null'] }
        profilePath: { type: [string, 'null'] }
        creditId: { type: string }
    CatalogCredits:
      type: object
      required: [cast, crew]
      properties:
        cast: { type: array, items: { $ref: '#/components/schemas/CatalogCast' } }
        crew: { type: array, items: { $ref: '#/components/schemas/CatalogCrew' } }
    CatalogEpisode:
      type: object
      required: [seasonNumber, episodeNumber, name, overview, airDate, runtime, stillPath, voteAverage, voteCount, crew, guestStars]
      properties:
        seasonNumber: { type: integer }
        episodeNumber: { type: integer }
        name: { type: string }
        overview: { type: string }
        airDate: { type: [string, 'null'], description: null = not announced }
        runtime: { type: [integer, 'null'] }
        stillPath: { type: [string, 'null'] }
        voteAverage: { type: number }
        voteCount: { type: integer }
        crew: { type: array, items: { $ref: '#/components/schemas/CatalogCrew' } }
        guestStars: { type: array, items: { $ref: '#/components/schemas/CatalogCast' } }
    CatalogSeason:
      type: object
      required: [tmdbId, seasonNumber, name, overview, airDate, posterPath, episodes]
      properties:
        tmdbId: { type: integer, description: The show's }
        seasonNumber: { type: integer }
        name: { type: string }
        overview: { type: string }
        airDate: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        episodes: { type: array, items: { $ref: '#/components/schemas/CatalogEpisode' } }
    CatalogExtras:
      type: object
      required: [providers, errors]
      properties:
        providers:
          type: array
          description: In the admin's order; only providers that added something
          items:
            type: object
            required: [plugin, name, ratings, tags, links, lines]
            properties:
              plugin: { type: string }
              name: { type: string }
              ratings:
                type: array
                items:
                  type: object
                  required: [source, value, max, votes, url]
                  properties:
                    source: { type: string, description: 'Shown before the value (Trakt, Letterboxd…)' }
                    value: { type: number }
                    max: { type: number, description: 'Its scale: 10, 5, 100…' }
                    votes: { type: [integer, 'null'] }
                    url: { type: [string, 'null'] }
              tags: { type: array, items: { type: string } }
              links:
                type: array
                description: To show (a TV doesn't open them)
                items:
                  type: object
                  required: [label, url]
                  properties:
                    label: { type: string }
                    url: { type: string }
              lines: { type: array, description: 'Meta-line items (as `PluginTitleMeta` items)', items: { type: object } }
        errors:
          type: array
          items:
            type: object
            required: [plugin, code]
            properties:
              plugin: { type: string }
              code: { type: string }
    CatalogPersonCredits:
      type: object
      required: [cast, crew]
      properties:
        cast:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CatalogTitle'
              - type: object
                required: [character]
                properties:
                  character: { type: [string, 'null'] }
        crew:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CatalogTitle'
              - type: object
                required: [job, department]
                properties:
                  job: { type: [string, 'null'] }
                  department: { type: [string, 'null'] }

    # ── library
    MediaType:
      type: string
      enum: [movie, tv]
    Artwork:
      type: object
      description: Sent with writes so lists render without TMDB; a write without them keeps what is stored
      properties:
        title: { type: string }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        genreIds: { type: array, items: { type: integer } }
    WatchlistItem:
      type: object
      required: [profileId, mediaType, tmdbId, title, posterPath, backdropPath, addedAt]
      properties:
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        addedAt: { type: string, format: date-time }
    SaveProgressRequest:
      allOf:
        - $ref: '#/components/schemas/Artwork'
        - type: object
          required: [positionS, durationS]
          properties:
            season: { type: integer, description: 'Episodes only' }
            episode: { type: integer, description: 'Episodes only' }
            positionS: { type: number }
            durationS: { type: number }
            infoHash: { type: [string, 'null'], description: 'The release being played, to resume the same one' }
            filePath: { type: [string, 'null'] }
            fileId: { type: [string, 'null'], description: 'Or a library file being played (the id of its `f_` media ref)' }
            audioTrack: { type: [string, 'null'], maxLength: 32, description: 'The audio track chosen in the player (a MediaTrack id), kept to resume with it' }
            subtitleTrack: { type: [string, 'null'], maxLength: 32, description: "The subtitle track chosen (a MediaTrack id, 'off', or a client's own id)" }
    ProgressRow:
      type: object
      required: [profileId, mediaType, tmdbId, season, episode, positionS, durationS, finished, updatedAt]
      properties:
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer, description: '0 for movies' }
        episode: { type: integer, description: '0 for movies' }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        positionS: { type: number }
        durationS: { type: number }
        infoHash: { type: [string, 'null'] }
        filePath: { type: [string, 'null'] }
        fileId: { type: [string, 'null'] }
        audioTrack: { type: [string, 'null'] }
        subtitleTrack: { type: [string, 'null'] }
        finished: { type: boolean }
        updatedAt: { type: string, format: date-time }
    SaveProgressResult:
      type: object
      required: [progress, finished, justFinished]
      properties:
        progress: { $ref: '#/components/schemas/ProgressRow' }
        finished: { type: boolean }
        justFinished: { type: boolean, description: 'This save finished it for the first time' }
    ProgressState:
      type: object
      required: [resume, finished]
      properties:
        resume:
          oneOf:
            - type: 'null'
            - type: object
              required: [positionS, durationS]
              properties:
                positionS: { type: number }
                durationS: { type: number }
                infoHash: { type: [string, 'null'] }
                filePath: { type: [string, 'null'] }
                fileId: { type: [string, 'null'], description: 'A library file: resume with the source `f_<fileId>`' }
                audioTrack: { type: [string, 'null'], description: 'The tracks chosen last time (MediaTrack ids)' }
                subtitleTrack: { type: [string, 'null'] }
                updatedAt: { type: string, format: date-time }
        finished: { type: boolean }
    EpisodeProgress:
      type: object
      required: [season, episode, ratio, finished]
      properties:
        season: { type: integer }
        episode: { type: integer }
        positionS: { type: number }
        durationS: { type: number }
        ratio: { type: number, minimum: 0, maximum: 1 }
        finished: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ContinueWatchingItem:
      type: object
      required: [kind, mediaType, tmdbId, season, episode]
      properties:
        kind: { type: string, enum: [resume, next], description: "next: the episode after a finished one (the client resolves which)" }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        positionS: { type: number }
        durationS: { type: number }
        ratio: { type: number }
        infoHash: { type: [string, 'null'] }
        filePath: { type: [string, 'null'] }
        fileId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    WatchedTitle:
      type: object
      required: [mediaType, tmdbId, season, episode, watchedAt]
      properties:
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        season: { type: integer, description: 'Latest watched episode' }
        episode: { type: integer }
        episodesWatched: { type: integer }
        watchedAt: { type: string, format: date-time }
    Library:
      type: object
      required: [continueWatching, watchlist, watched]
      properties:
        continueWatching: { type: array, items: { $ref: '#/components/schemas/ContinueWatchingItem' } }
        watchlist: { type: array, items: { $ref: '#/components/schemas/WatchlistItem' } }
        watched: { type: array, items: { $ref: '#/components/schemas/WatchedTitle' } }
    HistoryEntry:
      type: object
      required: [id, profileId, mediaType, tmdbId, season, episode, watchedAt]
      properties:
        id: { type: integer }
        profileId: { type: string }
        mediaType: { $ref: '#/components/schemas/MediaType' }
        tmdbId: { type: integer }
        season: { type: integer }
        episode: { type: integer }
        title: { type: [string, 'null'] }
        posterPath: { type: [string, 'null'] }
        backdropPath: { type: [string, 'null'] }
        genreIds: { type: array, items: { type: integer } }
        watchedRatio: { type: number }
        watchedAt: { type: string, format: date-time }

    # ── auth, devices, events
    DeviceCodeRequest:
      type: object
      required: [client_id]
      properties:
        client_id: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,63}$', description: 'Names the app, e.g. playpex-tv' }
        scope: { type: string }
    DeviceAuthorization:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string, description: 'Secret: only for polling' }
        user_code: { type: string, description: 'Show it; 8 characters, no ambiguous ones (e.g. ZETWHGRK; show as ZETW-HGRK)' }
        verification_uri: { type: string, format: uri, description: 'The dashboard page where the admin types the code' }
        verification_uri_complete: { type: string, format: uri, description: 'Same with the code filled in (for a QR code)' }
        expires_in: { type: integer, description: 'Seconds (the server''s security.pairingRequestMinutes)' }
        interval: { type: integer, description: 'Seconds between polls; faster gets slow_down' }
    DeviceTokenRequest:
      type: object
      required: [grant_type, device_code, client_id]
      properties:
        grant_type: { const: 'urn:ietf:params:oauth:grant-type:device_code' }
        device_code: { type: string }
        client_id: { type: string }
    DeviceToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'Keep it secret (OS keychain / encrypted storage)' }
        token_type: { const: Bearer }
        expires_in: { type: integer, description: 'Seconds; renewed while the device is used' }
        scope: { type: string }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, expired_token, access_denied, invalid_grant, invalid_client, invalid_request, invalid_scope, unauthorized_client, server_error]
        error_description: { type: string }
    DeviceDescription:
      type: object
      description: All optional; null clears a field
      properties:
        name: { type: [string, 'null'], maxLength: 64, description: 'e.g. "Living room TV"' }
        platform: { type: [string, 'null'], maxLength: 32, description: 'e.g. windows, linux, android-tv' }
        deviceId: { type: [string, 'null'], maxLength: 64, description: 'The client''s own id for this install' }
        capabilities:
          type: [object, 'null']
          description: What the device decodes (plan §6.5), at most 4 KB of JSON
          properties:
            containers: { type: array, items: { type: string } }
            video: { type: array, items: { type: string } }
            audio: { type: array, items: { type: string } }
            maxHeight: { type: integer }
    Device:
      type: object
      required: [id, clientId, name, platform, client, clientDeviceId, capabilities, address, lastProfileId, createdAt, lastSeenAt, expiresAt]
      properties:
        id: { type: string }
        clientId: { type: string }
        name: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        client: { type: [string, 'null'], description: '<name>/<version> from X-Playpex-Client when it paired' }
        clientDeviceId: { type: [string, 'null'] }
        capabilities: { type: [object, 'null'] }
        address: { type: [string, 'null'], description: 'Last address it was seen from' }
        lastProfileId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: 'When its token expires unless used' }
        online: { type: boolean, description: 'Admin list only: an open events socket or a request in the last 90 s' }
    PairingRequest:
      type: object
      required: [userCode, clientId, client, address, requestedAt, expiresAt]
      properties:
        userCode: { type: string }
        clientId: { type: [string, 'null'] }
        client: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
    AdminCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-zA-Z0-9_.]{3,30}$' }
        password: { type: string, minLength: 8, maxLength: 128 }
    Overview:
      type: object
      required: [server, process, system, network, activity, downloads, disks, ffmpeg, providers, sources]
      properties:
        server:
          type: object
          required: [id, name, version, startedAt, uptimeS, port, host, urls, lanSharing, recovery, discovery]
          properties:
            id: { type: [string, 'null'] }
            name: { type: string }
            version: { type: string }
            startedAt: { type: [string, 'null'], format: date-time }
            uptimeS: { type: integer }
            port: { type: [integer, 'null'] }
            host: { type: [string, 'null'] }
            urls: { type: array, items: { type: string } }
            lanSharing: { type: boolean }
            discovery: { $ref: '#/components/schemas/DiscoveryStatus' }
            recovery:
              type: [object, 'null']
              description: 'Set in recovery mode: the configured port was taken, only the dashboard is served (loopback)'
              properties:
                reason: { type: string, enum: [PORT_IN_USE, PORT_NOT_ALLOWED] }
                port: { type: integer }
                message: { type: string }
                owner:
                  type: [object, 'null']
                  properties:
                    pid: { type: integer }
                    name: { type: [string, 'null'] }
        process:
          type: object
          required: [pid, node, electron, cpuPercent, rssBytes, heapUsedBytes]
          properties:
            pid: { type: integer }
            node: { type: string }
            electron: { type: [string, 'null'] }
            cpuPercent: { type: number, description: 'Of one core, over the last 5 s' }
            rssBytes: { type: number }
            heapUsedBytes: { type: number }
        system:
          type: object
          required: [hostname, platform, arch, release, cpus, loadAverage, totalMemBytes, freeMemBytes]
          properties:
            hostname: { type: string }
            platform: { type: string }
            arch: { type: string }
            release: { type: string }
            cpus: { type: integer }
            loadAverage: { type: array, items: { type: number } }
            totalMemBytes: { type: number }
            freeMemBytes: { type: number }
        network:
          type: object
          description: BitTorrent traffic of every running torrent
          required: [downloadSpeed, uploadSpeed, peers, downloaded, uploaded]
          properties:
            downloadSpeed: { type: number, description: 'Bytes per second' }
            uploadSpeed: { type: number }
            peers: { type: integer }
            downloaded: { type: number, description: 'Bytes since the server started' }
            uploaded: { type: number }
        activity:
          type: object
          required: [torrents, sessions, eventClients]
          properties:
            torrents: { type: integer, description: 'Running torrents' }
            sessions: { type: integer }
            eventClients: { type: integer }
        downloads:
          type: object
          description: The torrent engine and the downloads
          required: [engine, requestedEngine, engineError, total, active, queued, paused]
          properties:
            engine: { type: [string, 'null'], description: 'The engine running (null: none could start)' }
            requestedEngine: { type: [string, 'null'], description: 'downloads.engine; differs from engine when it failed and the default runs' }
            engineError: { type: [string, 'null'] }
            total: { type: integer }
            active: { type: integer }
            queued: { type: integer }
            paused: { type: boolean, description: 'downloads.paused ("Pause all downloads")' }
            capabilities:
              type: object
              description: 'What the running engine can do (`rateLimits`, `pause`, `fastResume`, `fileSelection`, `streamPriority`, `persistentSession`; port v2: `peerList`, `trackerList`, `trackerEdit`, `recheck`; v3: `trackerRemove`, `reannounce`, `torrentLimits`)'
              additionalProperties: { type: boolean }
        disks:
          type: array
          items:
            type: object
            required: [id, path, free, total]
            properties:
              id: { type: string, enum: [downloads, config, logs] }
              path: { type: string }
              free: { type: [number, 'null'] }
              total: { type: [number, 'null'] }
        ffmpeg:
          type: object
          required: [available, version, source, path]
          properties:
            available: { type: boolean }
            version: { type: [string, 'null'] }
            source: { type: [string, 'null'], description: 'env, settings, bundled or path' }
            path: { type: [string, 'null'] }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderHealth' }
        sources:
          type: object
          description: 'Where torrents and streams come from: the enabled plugins with `play.collect` or `releases.providers` (docs/providers-plan.md §4.4)'
          required: [plugins, notice]
          properties:
            plugins:
              type: array
              items:
                type: object
                required: [id, name]
                properties:
                  id: { type: string }
                  name: { type: string }
            notice: { type: boolean, description: 'Show "Torrents now come from plugins": no source plugin, and `plugins.sourcesNotice` not turned off' }
    DiscoveryStatus:
      type: object
      description: 'How clients on the LAN find this server (mDNS and the UDP responder)'
      required: [enabled, reason, mdns, udp]
      properties:
        enabled: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [lanSharing, disabled, recovery, null]
          description: 'Why discovery is off: LAN sharing off, `network.discovery` off, or recovery mode'
        mdns:
          type: object
          required: [state, name, error]
          properties:
            state: { type: string, enum: ['off', starting, advertising, error] }
            name: { type: [string, 'null'], description: 'The mDNS instance name advertised' }
            error: { type: [string, 'null'] }
        udp:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
    ProviderHealth:
      type: object
      required: [id, name, ok, lastSuccess, lastFailure, lastError, failures]
      properties:
        id: { type: string, description: 'A service (tmdb, imdb, a subtitle provider), or `plugin:<plugin id>:<host>`' }
        name: { type: string }
        plugin: { type: string, description: 'A plugin''s host: the plugin' }
        host: { type: string, description: 'A plugin''s host: the host' }
        ok: { type: [boolean, 'null'], description: 'null = not used since the server started' }
        lastSuccess: { type: [string, 'null'], format: date-time }
        lastFailure: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'], description: 'HTTP status or network error code' }
        failures: { type: integer, description: 'Failures in a row' }
    Settings:
      type: object
      description: Every server setting (plan §5.3); secrets (`providers.*ApiKey`) masked as `••••<last 4>`
      required: [general, network, security, storage, streaming, downloads, dlna, plugins, metadata, providers, transcoding]
      properties:
        general:
          type: object
          required: [serverName, port, logLevel]
          properties:
            serverName: { type: string }
            port: { type: integer, minimum: 1024, maximum: 65535 }
            logLevel: { type: string, enum: [debug, info, warn, error] }
        network:
          type: object
          required: [lanSharing, discovery, allowedHosts, corsOrigins]
          properties:
            lanSharing: { type: boolean }
            discovery: { type: boolean, description: 'Advertise on the LAN (mDNS + UDP 28471); only with lanSharing' }
            allowedHosts: { type: array, items: { type: string } }
            corsOrigins: { type: array, items: { type: string } }
        security:
          type: object
          required: [requirePairingOnLoopback, pairingRequestMinutes]
          properties:
            requirePairingOnLoopback: { type: boolean }
            pairingRequestMinutes: { type: integer, minimum: 1 }
        storage:
          type: object
          required: [downloadDir]
          properties:
            downloadDir: { type: string, description: 'Empty = the default (<cache>/torrent_data)' }
        streaming:
          type: object
          required: [maxTorrents, maxTranscodes, maxLive, idleTimeoutMinutes]
          properties:
            maxTorrents: { type: integer, minimum: 1, description: 'Running torrents at once (streams and downloads)' }
            maxTranscodes: { type: integer, minimum: 1 }
            maxLive: { type: integer, minimum: 1, description: 'Live streams at once (plugins'' live HLS playlists and continuous streams, one per device and stream); past it 503 `BUSY`' }
            idleTimeoutMinutes: { type: integer, minimum: 1 }
        downloads:
          type: object
          required: [engine, peerPort, portForwarding, maxActive, seedRatio, seedMinutes, uploadSlots, downLimitKBps, upLimitKBps, paused]
          properties:
            engine: { type: string, description: 'The torrent engine (`SettingsView.engines`: torrent-stream, rqbit); applied after a restart' }
            peerPort: { type: integer, minimum: 1024, maximum: 65535, description: 'BitTorrent port (taken → a free one); applied after a restart' }
            portForwarding: { type: boolean, description: 'Ask the router to forward peerPort (UPnP), where the engine can (rqbit); applied after a restart' }
            maxActive: { type: integer, minimum: 1, description: 'Downloads (not streams) running at once; the others are queued' }
            seedRatio: { type: number, minimum: 0, description: 'A finished download seeds until this ratio (0 = no ratio limit)' }
            seedMinutes: { type: integer, minimum: 0, description: '…or this long (0 = no time limit); both 0 = no seeding' }
            uploadSlots: { type: integer, minimum: 0, description: 'Peers uploaded to at once per torrent; 0 = never upload' }
            downLimitKBps: { type: integer, minimum: 0, description: 'Download speed of every torrent together, KB/s (0 = no limit); only engines with `rateLimits` (Overview `downloads.capabilities`)' }
            upLimitKBps: { type: integer, minimum: 0, description: 'Upload speed of every torrent together, KB/s (0 = no limit); same' }
            paused: { type: boolean, description: '"Pause all downloads": downloads wait, streams still play' }
        dlna:
          type: object
          required: [enabled, port]
          properties:
            enabled: { type: boolean, description: 'The DLNA / UPnP AV media server (no authentication: read-only, DLNA folders of audience everyone, LAN addresses only); only with network.lanSharing. Applied at once' }
            port: { type: integer, minimum: 1024, maximum: 65535, description: 'Its own HTTP listener (default 28472); applied at once' }
        plugins:
          type: object
          required: [developerMode, publisherKeys, updates, sourcesNotice]
          properties:
            developerMode: { type: boolean, description: 'Unsigned plugin packages install (at once), and the folders of <config>/plugins-dev/ load (after a restart)' }
            publisherKeys: { type: array, items: { type: string }, description: 'ed25519:<base64> public keys whose signed packages install without developer mode' }
            updates: { type: string, enum: [auto, notify, never], description: 'Updates from repositories: auto installs those asking for no new permissions (the others wait), notify lists them, never doesn''t look; a plugin may override it' }
            sourcesNotice: { type: boolean, description: 'The Overview''s "Torrents now come from plugins" notice while no source plugin is installed; false once dismissed' }
        metadata:
          type: object
          required: [language, region, order, disabled]
          properties:
            language: { type: string, pattern: '^[a-z]{2}(-[A-Z]{2})?$', description: 'What `/catalog/*` answers in (en-US, fr, pt-BR…)' }
            region: { type: string, pattern: '^([A-Z]{2})?$', description: 'Region of the movie lists (now playing, upcoming…); empty = the provider''s default' }
            order: { type: array, items: { type: string }, description: 'Metadata providers (plugin ids) whose additions come first, in this order; the others after, by id' }
            disabled: { type: array, items: { type: string }, description: 'Metadata providers switched off (their hooks aren''t asked for title pages)' }
        providers:
          type: object
          required: [tmdbApiKey, openSubtitlesApiKey, wyzieApiKey]
          properties:
            tmdbApiKey: { type: string, description: 'Empty = the TMDB app key Playpex ships' }
            openSubtitlesApiKey: { type: string }
            wyzieApiKey: { type: string }
        transcoding:
          type: object
          required: [ffmpegPath, ffprobePath]
          properties:
            ffmpegPath: { type: string }
            ffprobePath: { type: string }
    DlnaStatus:
      type: object
      required: [enabled, reason, name, udn, port, http, ssdp, urls, renderers, folders, shown]
      properties:
        enabled: { type: boolean, description: 'It should run (`dlna.enabled`, LAN sharing, not recovery mode); `http` / `ssdp` tell whether it does' }
        reason: { type: [string, 'null'], enum: [disabled, lanSharing, recovery, null], description: 'Why it is off' }
        name: { type: string, description: 'What TVs show (the server name)' }
        udn: { type: [string, 'null'], description: 'Its UPnP device id, stable (derived from the server id)' }
        port: { type: integer, description: 'dlna.port' }
        http:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
        ssdp:
          type: object
          required: [state, port, error]
          properties:
            state: { type: string, enum: ['off', starting, listening, error] }
            port: { type: [integer, 'null'] }
            error: { type: [string, 'null'] }
            interfaces: { type: integer, description: 'Networks it announces on' }
        urls: { type: array, items: { type: string }, description: 'The device description on each LAN address' }
        renderers:
          type: array
          description: 'Devices that browsed or played in the last day, latest first'
          items:
            type: object
            required: [address, name, userAgent, lastSeenAt, lastPlayedAt]
            properties:
              address: { type: string }
              name: { type: [string, 'null'], description: 'Its own name, when it announced itself as a renderer' }
              userAgent: { type: [string, 'null'] }
              lastSeenAt: { type: string, format: date-time }
              lastPlayedAt: { type: [string, 'null'], format: date-time }
        folders:
          type: array
          items:
            type: object
            required: [id, path, name, kind, audience, builtin, dlna, files]
            properties:
              id: { type: string }
              path: { type: string }
              name: { type: string }
              kind: { $ref: '#/components/schemas/LibraryFolderKind' }
              audience: { $ref: '#/components/schemas/LibraryAudience' }
              builtin: { type: boolean }
              dlna: { type: boolean, description: 'Included in DLNA (served only when its audience is everyone)' }
              files: { type: integer, description: 'Its files in state ok / unmatched' }
        shown:
          type: object
          description: 'What DLNA devices browse now'
          required: [files, movies, shows]
          properties:
            files: { type: integer }
            movies: { type: integer }
            shows: { type: integer }
    SettingsPatch:
      type: object
      description: 'Any subset of `Settings`, same nesting (`{ general: { port: 28480 } }`)'
      additionalProperties: { type: object, additionalProperties: true }
    SettingsView:
      type: object
      required: [settings, sources, env, file, logLevels, engines, engine]
      properties:
        settings: { $ref: '#/components/schemas/Settings' }
        sources:
          type: object
          description: "'general.port' → env (locked by an environment variable) / file / default"
          additionalProperties: { type: string, enum: [env, file, default] }
        env:
          type: object
          description: "'general.port' → the environment variable that sets it"
          additionalProperties: { type: string }
        file: { type: string, description: 'Path of settings.json' }
        logLevels: { type: array, items: { type: string } }
        engines:
          type: array
          description: 'The torrent engines `downloads.engine` can name, with what each is good at'
          items: { $ref: '#/components/schemas/Engine' }
        engine: { type: [string, 'null'], description: 'The engine running now (it differs from downloads.engine until a restart, or when that one failed to start)' }
    SettingsUpdate:
      type: object
      required: [settings, changed, restartRequired, lockedByEnv]
      properties:
        settings: { $ref: '#/components/schemas/SettingsView' }
        changed: { type: array, items: { type: string }, description: 'Keys saved' }
        restartRequired: { type: array, items: { type: string }, description: 'Changed keys applied on the next start' }
        lockedByEnv: { type: array, items: { type: string }, description: 'Saved, but an environment variable still wins' }
    Engine:
      type: object
      description: 'A torrent engine. Built in (torrent-stream), or an optional program the admin installs (never bundled)'
      required: [id, name, summary, available, detail, installable, installed, version, latest]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string, description: 'What it is good and bad at' }
        available: { type: boolean, description: 'It can run on this server now' }
        detail: { type: [string, 'null'], description: 'Why not, when unavailable' }
        installable: { type: boolean, description: 'An optional download with a build for this platform' }
        installed: { type: [string, 'null'], enum: [builtin, installed, env, path, null], description: 'builtin; installed (by the server); env / path (found elsewhere); null: not installed' }
        version: { type: [string, 'null'], description: 'Installed version' }
        latest: { type: [string, 'null'], description: 'The version this server installs' }
    EngineList:
      type: object
      required: [engines]
      properties:
        engines: { type: array, items: { $ref: '#/components/schemas/Engine' } }
    PortCheck:
      type: object
      required: [port, free, current, owner]
      properties:
        port: { type: integer }
        free: { type: boolean }
        current: { type: boolean, description: 'The port this server listens on now' }
        owner:
          type: [object, 'null']
          description: 'The process holding it, when the OS tells'
          properties:
            pid: { type: integer }
            name: { type: [string, 'null'] }
    LogEntry:
      type: object
      required: [time, level, area, msg]
      properties:
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        area: { type: string }
        msg: { type: string }
      additionalProperties: true
    Storage:
      type: object
      required: [dir, disk, totalBytes, items]
      properties:
        dir: { type: string }
        disk:
          type: [object, 'null']
          required: [free, total]
          properties:
            free: { type: number }
            total: { type: number }
        totalBytes: { type: number }
        items:
          type: array
          items:
            type: object
            required: [name, bytes, modifiedAt, infoHash, torrentName]
            properties:
              name: { type: string }
              bytes: { type: number, description: 'On disk (files are sparse until downloaded)' }
              modifiedAt: { type: [string, 'null'], format: date-time }
              infoHash: { type: [string, 'null'], description: 'The running torrent using it (then it cannot be deleted)' }
              torrentName: { type: [string, 'null'] }
              download:
                type: [object, 'null']
                description: 'The download it belongs to; deleting the entry of a stopped one forgets that download'
                required: [infoHash, name, active]
                properties:
                  infoHash: { type: string }
                  name: { type: string }
                  active: { type: boolean }
    DirCheck:
      type: object
      required: [path, exists, writable, free, total]
      properties:
        path: { type: string }
        exists: { type: boolean }
        writable: { type: boolean, description: 'The directory, or the parent it would be created in' }
        free: { type: [number, 'null'] }
        total: { type: [number, 'null'] }
    HostInfo:
      type: object
      required: [kind, desktop]
      properties:
        kind: { type: string, enum: [headless, desktop] }
        desktop:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DesktopState'
    DesktopState:
      type: object
      description: 'The desktop app (apps/server-desktop): its settings and its updater'
      required: [appVersion, platform, openAtLogin, checkForUpdates, update]
      properties:
        appVersion: { type: string }
        platform: { type: string, description: 'win32, darwin, linux' }
        openAtLogin: { type: boolean, description: 'Starts (hidden, in the tray) when the user logs in' }
        checkForUpdates: { type: boolean, description: 'Looks for updates at start and every 6 hours, downloads them in the background' }
        update:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [unsupported, idle, checking, none, available, downloading, downloaded, error]
              description: '`unsupported`: this build can''t update itself (a development run, a Linux .deb without pkexec…)'
            version: { type: [string, 'null'], description: 'The update found or downloaded' }
            percent: { type: [number, 'null'] }
            checkedAt: { type: [string, 'null'], format: date-time }
            error: { type: [string, 'null'] }
    ServerStatusEvent:
      type: object
      description: '`data` of `server.status`'
      properties:
        uptimeS: { type: integer }
        torrents: { type: integer, description: 'Running torrents' }
        sessions: { type: integer }
        eventClients: { type: integer }
    TorrentStatsEvent:
      type: array
      description: '`data` of `torrent.stats`: torrents that have a lease'
      items:
        type: object
        properties:
          infoHash: { type: string }
          peers: { type: integer }
          downloadSpeed: { type: number, description: 'bytes/s' }
          uploadSpeed: { type: number, description: 'bytes/s' }
          downloaded: { type: number, description: 'bytes' }
    SessionEndedEvent:
      type: object
      description: '`data` of `session.ended` (`session.started` / `session.updated` carry a `Session`)'
      properties:
        id: { type: string }
        deviceId: { type: string }
        infoHash: { type: [string, 'null'], description: 'null for a file on disk' }
        ref: { type: [string, 'null'], description: 'Media ref of the file last streamed' }
    Event:
      type: object
      required: [topic, time, data]
      properties:
        topic: { type: string, description: 'server.status, torrent.stats, session.*, download.*, settings.changed, library.changed, library.scan, log, device.*, pairing.*, host.updated' }
        time: { type: string, format: date-time }
        data: {}
