<div class="playerPageContainer">
  <video crossorigin="anonymous" class="moviePlayer" type="video/mp4" muted></video>
  <img src="assets/icons/loading.svg" class="loading" >
  <div class="audioWarning" *ngIf="audioWarning">
    No sound: this release's audio (Dolby or DTS) can't be played here. Try another title or release.
  </div>
  <div class="controls">
    <div class="controlsContainer">
      <div class="wrapper">
        <div class="infoSection">
          <span class="title">{{playback?.title}}</span>
          <span class="infos" *ngIf="playback?.subtitle">{{playback.subtitle}}</span>
          <span class="infos" *ngIf="!playback?.subtitle">{{year}} . {{runtime?.hh}} hr {{runtime?.min}} min</span>
        </div>
        <div class="timeSlider">
          <div class="slider">
            <button class="progress controlsElem"
              data-sn-down =".playerPageContainer .playBtn">

              <div class="reachedDot"></div>
            </button>
          </div>
          <div class="timeInfo">
            <span class="currentTime">00:00</span>
            <span class="duration">00:00:00</span>
        </div>
        </div>
        <div class="options">
          <div class="subOpt">
            <button class="optBtn controlsElem ccBtn"
              data-sn-up =".playerPageContainer .timeSlider .progress">
                <img src="assets/icons/caption.svg" alt="">
            </button>
          </div>
          <div class="playbackOpt">
            <button class="optBtn controlsElem seekLeft seekBtn"
              disabled
              data-sn-up =".playerPageContainer .timeSlider .progress">
                <img src="assets/icons/rightSeek.svg" alt="">
            </button>
            <button class="optBtn controlsElem playBtn"
              data-sn-up =".playerPageContainer .timeSlider .progress">
                <img src="assets/icons/playSharp.svg" alt="">
            </button>
            <button class="optBtn controlsElem seekBtn"
            disabled
              data-sn-up =".playerPageContainer .timeSlider .progress">
                <img src="assets/icons/rightSeek.svg" alt="">
            </button>
          </div>
          <div class="settingsOpt">
            <button class="optBtn controlsElem"
              data-sn-up =".playerPageContainer .timeSlider .progress">
                <img src="assets/icons/opts.svg" alt="">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="sidePannel">
    <div class="optionsTitle">Subtitles</div>

    <!-- Subtitle source; the choice is remembered (SubtitlesService.preferredProvider) -->
    <div class="providerTabs" *ngIf="subtitleProviders.length > 1">
      <button *ngFor="let provider of subtitleProviders"
        class="controlsElem providerTab"
        [class.selected]="provider.id == subtitleProvider"
        [attr.data-provider]="provider.id">
        {{provider.name}}
      </button>
    </div>

    <div class="content" *ngIf="subtitles?.length">
      <button *ngFor="let subtitle of subtitles; let i = index" class="controlsElem subtitle"
        [attr.data-index]="i"
        [attr.data-language]="subtitle.language">
        <div class="name">{{subtitle.name}}</div>
        <div class="params">
          <div class="language">
            <span>language : </span>
            {{subtitle.languageName}}
          </div>

          <img class="tick" src="assets/icons/tick.svg" alt="">
        </div>
      </button>
    </div>

    <div class="loadingSubs" *ngIf="!subtitles">
      Fetching subtitles
      <img src="assets/icons/loading_small.svg" alt="">
    </div>

    <div class="loadingSubs" *ngIf="subtitles && !subtitles.length">
      {{subtitlesError || 'No subtitles from this provider'}}
    </div>
  </div>

</div>
